name: Fix camp map label clipping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-coupang-camp-map-label-width.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply marker label width patch
        run: python3 .github/scripts/patch_coupang_camp_map_label_width.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupang_camp_map coupang_camp_map
          git commit -m "Prevent camp map label clipping"
          git pull --rebase origin main
          git push origin main
