name: Patch maroowell schedule collapse and colors

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-maroowell-schedule-collapse-colors.yml'
      - '.github/scripts/patch_maroowell_schedule_collapse_colors.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply schedule patch
        run: python3 .github/scripts/patch_maroowell_schedule_collapse_colors.py

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'function collapseUniformChildSchedulesForDisplay()' public/maroowell_schedule
          grep -q 'function normalizeUniformChildrenBeforeSave()' public/maroowell_schedule
          grep -q 'const collapsedUniformCount=collapseUniformChildSchedulesForDisplay();' public/maroowell_schedule
          grep -q 'normalizeUniformChildrenBeforeSave();' public/maroowell_schedule
          grep -q '#eeb5d8' public/maroowell_schedule

      - name: Commit patch to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maroowell_schedule
          git rm .github/workflows/patch-maroowell-schedule-collapse-colors.yml
          git commit -m "Normalize schedule subroutes and expand person colors"
          git pull --rebase origin main
          git push origin main
