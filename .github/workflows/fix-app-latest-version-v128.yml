name: Publish Maroowell Android v1.3.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-app-latest-version-v128.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v1.3.5 release artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprcentralus.oaiusercontent.com/files/00000000-9864-81f5-a8ce-39ff96b0c123/raw?se=2026-08-31T15%3A07%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=2bd2ee50-ad16-5763-bbea-692422433f81&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T00%3A58%3A23Z&ske=2026-09-01T00%3A58%3A23Z&sks=b&skv=2026-02-06&sig=YHdehNXsw7bZ3uhtdIy3zhdbtSKVYVipINIAbbJ1CeU%3D'
          curl -fL --retry 3 --retry-all-errors "$URL" -o /tmp/v135.zip
          rm -rf /tmp/v135
          mkdir -p /tmp/v135
          unzip -q /tmp/v135.zip -d /tmp/v135
          test -f /tmp/v135/Maroowell-1.3.5.apk
          test -f /tmp/v135/maroowell-latest.apk
          EXPECTED_SHA='a3d38354b08d16249cabbc365ddd8595c01aee17c3804e156c28cc18a95fc0f5'
          for APK in /tmp/v135/Maroowell-1.3.5.apk /tmp/v135/maroowell-latest.apk; do
            test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
            unzip -t "$APK" >/dev/null
          done

      - name: Install APK and v1.3.5 metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/v135/Maroowell-1.3.5.apk public/apk/Maroowell-1.3.5.apk
          cp /tmp/v135/maroowell-latest.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 38,
            "versionName": "1.3.5",
            "updatedAt": "2026-08-31",
            "fileName": "Maroowell-1.3.5.apk",
            "downloadUrl": "https://raw.githubusercontent.com/nuclearwarp/maroowell.com/main/public/apk/Maroowell-1.3.5.apk",
            "changes": [
              "저장된 일상점검 기록을 날짜별로 삭제할 수 있는 버튼 추가",
              "삭제 전 확인창을 표시하고 해당 날짜 기록만 삭제",
              "오늘 포함 과거 날짜는 일상점검 등록 및 수정 가능",
              "오늘 이후 미래 날짜는 O/X 입력, 메모, 초기화 및 저장을 차단",
              "과거에 잘못 저장된 미래 날짜 기록은 삭제만 가능"
            ]
          }
          JSON
          cp public/app_version.json app_version.json

      - name: Commit public v1.3.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apk/Maroowell-1.3.5.apk public/apk/maroowell-latest.apk public/app_version.json app_version.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'v1.3.5 is already published'
            exit 0
          fi
          git commit -m 'Publish Maroowell Android v1.3.5'
          git push origin HEAD:main
