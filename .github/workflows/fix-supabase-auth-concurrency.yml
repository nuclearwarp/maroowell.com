name: Build Maroowell schedule frontend fixed copy
on:
  push:
    branches:
      - deliver/maroowell-schedule-account-fix-20260915
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deliver/maroowell-schedule-account-fix-20260915
          fetch-depth: 0
      - name: Patch schedule account resolution
        env:
          PATCH_B64: ""
      - name: Patch file
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('public/maroowell_schedule').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          js=max([b for b in blocks if b.strip()],key=len)
          f=tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False)
          try:
              f.write(js); f.close()
              r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(r.returncode)
          finally:
              try: os.unlink(f.name)
              except: pass
          PY
      - name: Commit fixed copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/maroowell_schedule maroowell_schedule_front_fixed.txt
          git commit -m "Fix schedule master account resolution"
          git push
