name = "maroowell-security"
main = "worker.js"
compatibility_date = "2026-11-06"
account_id = "0f644373a9db40f2b36e4ffece348c46"
workers_dev = true

# Specific route takes precedence over the existing maroowell.com/* login worker.
routes = [
  { pattern = "maroowell.com/api/session/*", zone_name = "maroowell.com" },
  { pattern = "maroowell.com/api/web/*", zone_name = "maroowell.com" },
  { pattern = "maroowell.com/api/supabase/*", zone_name = "maroowell.com" },
  { pattern = "maroowell.com/api/worker/*", zone_name = "maroowell.com" }
]
keep_vars = true

# Isolated deployment. No routes, custom domains, service-role keys or generic DB proxy.
[vars]
SUPABASE_URL = "https://rgqerimdxkthkcewqbbe.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FUFuH5JVyM-JLWWVeasgOw_Sk_LtD9H"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionStore"

[exports.SessionStore]
type = "durable-object"
storage = "sqlite"
