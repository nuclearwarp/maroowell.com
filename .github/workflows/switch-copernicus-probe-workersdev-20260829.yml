name: Switch Copernicus probe to workers.dev

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/switch-copernicus-probe-workersdev-20260829.yml

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Switch probe origin
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#PROBE_ORIGIN: https://zip.maroowell.com#PROBE_ORIGIN: https://purple-resonance-61ea.brain-0f6.workers.dev#' .github/workflows/live-copernicus-auth-probe-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/live-copernicus-auth-probe-v2.yml
          git commit -m 'Probe Copernicus through workers.dev'
          git pull --rebase origin main
          git push origin HEAD:main
# run switch 2026-08-29
