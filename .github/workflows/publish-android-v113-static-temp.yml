name: Publish Maroowell Android v1.1.3 static APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-v113-static-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed v1.1.3 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-5b94-8206-9c8a-088069db0e0c/raw?se=2026-08-21T06%3A26%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=00c8fd20-7a2b-5047-bab0-9bca6d4bd41e&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T00%3A34%3A53Z&ske=2026-08-22T00%3A34%3A53Z&sks=b&skv=2026-02-06&sig=RZuQXHT00o3F3x4B6RzEw3cQxAL8NWd14wzNFZF83vs%3D' -o artifact.zip
          rm -rf artifact
          mkdir -p artifact
          unzip -o artifact.zip -d artifact
          APK=$(find artifact -type f -name 'Maroowell-1.1.3.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK"

      - name: Stage APK as static site asset
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find artifact -type f -name 'Maroowell-1.1.3.apk' | head -n 1)
          mkdir -p apk public/apk
          cp "$APK" apk/Maroowell-1.1.3.apk
          cp "$APK" public/apk/Maroowell-1.1.3.apk
          cp "$APK" apk/maroowell-latest.apk
          cp "$APK" public/apk/maroowell-latest.apk
          ls -lh apk/Maroowell-1.1.3.apk public/apk/Maroowell-1.1.3.apk

      - name: Update public app metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > app_version.json <<'JSON'
          {
            "versionCode": 14,
            "versionName": "1.1.3",
            "updatedAt": "2026-08-21",
            "fileName": "Maroowell-1.1.3.apk",
            "downloadUrl": "https://maroowell.com/apk/Maroowell-1.1.3.apk",
            "changes": [
              "26~25일 정산 달력의 앞뒤 빈칸에 이전·다음 날짜를 흐리게 표시하고 대한민국 공휴일을 표시",
              "배송 수량 등록의 캠프·라우트 입력 라벨과 텍스트 겹침 수정",
              "마루웰 정보를 네이티브 화면으로 복구하고 신규 인원 추가 기능을 보강",
              "우편번호 검색·라우트 편집·쿠팡 캠프 조회에 기존 마루웰 카카오 지도 설정을 적용"
            ]
          }
          JSON
          cp app_version.json public/app_version.json

      - name: Commit static APK and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Maroowell-1.1.3.apk public/apk/Maroowell-1.1.3.apk apk/maroowell-latest.apk public/apk/maroowell-latest.apk app_version.json public/app_version.json
          git rm .github/workflows/publish-android-v113-static-temp.yml
          git commit -m "Publish Maroowell Android v1.1.3 static APK"
          git pull --rebase origin main
          git push origin main
