name: Run secure route API writes v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-secure-route-api-writes-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify route API write authentication
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://route-api.brain-0f6.workers.dev'
          health=$(curl -sS -o /tmp/health.txt -w '%{http_code}' "$BASE/health")
          cat /tmp/health.txt
          test "$health" = '200'

          route_code=$(curl -sS -o /tmp/route-write.txt -w '%{http_code}' \
            -X POST "$BASE/route" \
            -H 'Content-Type: application/json' \
            --data '{"camp":"__security_probe__","code":"__probe__","polygon_wgs84":[]}')
          cat /tmp/route-write.txt
          test "$route_code" = '401'

          vendor_code=$(curl -sS -o /tmp/vendor-write.txt -w '%{http_code}' \
            -X POST "$BASE/vendors" \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer invalid-security-probe' \
            --data '{"name":"__security_probe__","business_number":"0000000000"}')
          cat /tmp/vendor-write.txt
          test "$vendor_code" = '401'

          camp_code=$(curl -sS -o /tmp/camp-write.txt -w '%{http_code}' \
            -X POST "$BASE/camps" \
            -H 'Content-Type: application/json' \
            --data '{"camp":"__security_probe__","mb_camp":"__probe__","address":"__probe__"}')
          cat /tmp/camp-write.txt
          test "$camp_code" = '401'

          echo 'PASS: unauthenticated route/camp/vendor mutations are blocked.'
