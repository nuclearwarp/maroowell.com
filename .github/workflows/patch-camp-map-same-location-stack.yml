name: Stack same-location camp markers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-camp-map-same-location-stack.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch camp marker grouping and stack spacing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [Path('public/coupang_camp_map'), Path('coupang_camp_map')]

          for path in paths:
              text = path.read_text(encoding='utf-8')

              text = text.replace('const LABEL_STACK_GAP = 2;', 'const LABEL_STACK_GAP = 0;')

              pattern = re.compile(
                  r'      function buildMarkerGroups\(rows\) \{[\s\S]*?^      \}\n\n      function rectanglesOverlap',
                  re.MULTILINE,
              )

              replacement = r'''      function markerDistanceMeters(a, b) {
        const aLat = Number(a?.latitude);
        const aLng = Number(a?.longitude);
        const bLat = Number(b?.latitude);
        const bLng = Number(b?.longitude);

        if (![aLat,aLng,bLat,bLng].every(Number.isFinite)) return Infinity;

        const rad = Math.PI / 180;
        const dLat = (bLat - aLat) * rad;
        const dLng = (bLng - aLng) * rad;
        const lat1 = aLat * rad;
        const lat2 = bLat * rad;
        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;

        return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }

      function normalizedMarkerAddress(row) {
        return text(row?.address).replace(/\s+/g, " ").toLowerCase();
      }

      function rowsShareSubHubRelation(a, b) {
        const aType = text(a?.camp_type).toUpperCase();
        const bType = text(b?.camp_type).toUpperCase();
        const aId = text(a?.id);
        const bId = text(b?.id);
        const aSh = text(a?.effective_receiving_sh_id);
        const bSh = text(b?.effective_receiving_sh_id);

        return (
          (aType === "SUB_HUB" && aId && bSh === aId) ||
          (bType === "SUB_HUB" && bId && aSh === bId)
        );
      }

      function shouldMergeMarkerRows(a, b, mergeNearbyRelated = false) {
        if (overlapMarkerKey(a) === overlapMarkerKey(b)) return true;
        if (!mergeNearbyRelated) return false;

        const aAddress = normalizedMarkerAddress(a);
        const bAddress = normalizedMarkerAddress(b);
        if (aAddress && bAddress && aAddress === bAddress) return true;

        const distance = markerDistanceMeters(a, b);
        if (distance <= 4) return true;
        if (rowsShareSubHubRelation(a, b) && distance <= 18) return true;

        return false;
      }

      function buildMarkerGroups(rows, mergeNearbyRelated = false) {
        const rawGroups = [];

        if (!mergeNearbyRelated) {
          const grouped = new Map();
          for (const row of rows) {
            const key = overlapMarkerKey(row);
            if (!grouped.has(key)) grouped.set(key, []);
            grouped.get(key).push(row);
          }
          for (const [key, groupRows] of grouped.entries()) {
            rawGroups.push({ key, rows: groupRows });
          }
        } else {
          for (const row of rows) {
            let group = rawGroups.find(candidate =>
              candidate.rows.some(existing => shouldMergeMarkerRows(existing, row, true))
            );

            if (!group) {
              group = { key: `near:${rowId(row)}`, rows: [] };
              rawGroups.push(group);
            }

            group.rows.push(row);
          }
        }

        return rawGroups.map(({ key, rows: groupRows }) => {
          groupRows.sort(compareOverlapRows);

          const items = groupRows.map(row => ({
            row,
            metrics: markerVisualMetrics(row)
          }));

          const width = Math.max(...items.map(item => item.metrics.width));
          const height =
            items.reduce((sum, item) => sum + item.metrics.bubbleHeight, 0) +
            Math.max(0, items.length - 1) * LABEL_STACK_GAP +
            items[items.length - 1].metrics.pointerHeight;

          const validRows = groupRows.filter(row =>
            Number.isFinite(Number(row?.latitude)) && Number.isFinite(Number(row?.longitude))
          );
          const latitude = validRows.length
            ? validRows.reduce((sum, row) => sum + Number(row.latitude), 0) / validRows.length
            : Number(groupRows[0]?.latitude);
          const longitude = validRows.length
            ? validRows.reduce((sum, row) => sum + Number(row.longitude), 0) / validRows.length
            : Number(groupRows[0]?.longitude);

          return {
            key,
            items,
            width,
            height,
            latitude,
            longitude,
            hasSubHub: groupRows.some(
              row => text(row?.camp_type).toUpperCase() === "SUB_HUB"
            ),
            sortLabel: groupRows.map(overlapSortLabel).join(" ")
          };
        });
      }

      function rectanglesOverlap'''

              text, count = pattern.subn(replacement, text, count=1)
              if count != 1 and 'function shouldMergeMarkerRows' not in text:
                  raise SystemExit(f'{path}: buildMarkerGroups block patch failed')

              # Forced relation label image: only the bottom label gets a pointer.
              text = text.replace(
                  'function makeForcedRelationLabelImage(row, offsetX = 0, offsetY = 0) {',
                  'function makeForcedRelationLabelImage(row, offsetX = 0, offsetY = 0, showPointer = true) {',
                  1,
              )
              text = text.replace(
                  '          Math.round(offsetY)\n        ].join("|");',
                  '          Math.round(offsetY),\n          showPointer ? "pointer" : "no-pointer"\n        ].join("|");',
                  1,
              )
              text = text.replace(
                  '        const labelHeight = metrics.bubbleHeight + metrics.pointerHeight;',
                  '        const labelHeight = metrics.bubbleHeight + (showPointer ? metrics.pointerHeight : 0);',
                  1,
              )

              pointer_line = '          `<path d="M${centerX - 4} ${bubbleBottom} L${centerX} ${labelTop + labelHeight} L${centerX + 4} ${bubbleBottom} Z" fill="${bubbleColor}" stroke="${borderColor}" stroke-width="1"/>`,'
              if pointer_line in text:
                  text = text.replace(
                      '        const connectorSvg =\n',
                      '        const pointerSvg = showPointer\n          ? `<path d="M${centerX - 4} ${bubbleBottom} L${centerX} ${labelTop + labelHeight} L${centerX + 4} ${bubbleBottom} Z" fill="${bubbleColor}" stroke="${borderColor}" stroke-width="1"/>`\n          : "";\n\n        const connectorSvg =\n',
                      1,
                  )
                  text = text.replace(pointer_line, '          pointerSvg,', 1)

              # In selected SH mode, nearby related markers share one anchor and stack flush.
              render_pattern = re.compile(
                  r'(      function renderSelectedSubHubMarkers\(\) \{[\s\S]*?^      \}\n)\n\n      function clearLabelOverlays',
                  re.MULTILINE,
              )
              match = render_pattern.search(text)
              if not match:
                  raise SystemExit(f'{path}: renderSelectedSubHubMarkers not found')
              block = match.group(1)
              block = block.replace('const groups = buildMarkerGroups(relatedRows);', 'const groups = buildMarkerGroups(relatedRows, true);')
              block = block.replace(
                  '              position: new kakao.maps.LatLng(\n                item.row.latitude,\n                item.row.longitude\n              ),',
                  '              position: new kakao.maps.LatLng(\n                group.latitude,\n                group.longitude\n              ),',
              )
              block = block.replace(
                  '                layout.y - heightBelow\n              ),',
                  '                layout.y - heightBelow,\n                showPointer\n              ),',
              )
              text = text[:match.start(1)] + block + text[match.end(1):]

              path.write_text(text, encoding='utf-8')

              final = path.read_text(encoding='utf-8')
              checks = [
                  'const LABEL_STACK_GAP = 0;',
                  'function shouldMergeMarkerRows',
                  'rowsShareSubHubRelation(a, b)',
                  'distance <= 18',
                  'buildMarkerGroups(relatedRows, true)',
                  'group.latitude',
                  'showPointer ? "pointer" : "no-pointer"',
                  'layout.y - heightBelow,\n                showPointer',
              ]
              for check in checks:
                  if check not in final:
                      raise SystemExit(f'{path}: missing validation anchor: {check}')
          PY

          git diff --check
          git diff -- public/coupang_camp_map coupang_camp_map

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupang_camp_map coupang_camp_map
          git commit -m "Stack same-location camp and subhub labels"
          git pull --rebase origin main
          git push origin main
