name: Publish Maroowell Android v1.3.2 directly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v132-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v1.3.2 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-d118-8206-8d15-d1ec74f41d53/raw?se=2026-08-30T13%3A17%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=c5572fd0-e8e8-5630-a7c8-c8cdbfe7e501&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T19%3A41%3A41Z&ske=2026-08-30T19%3A41%3A41Z&sks=b&skv=2026-02-06&sig=/TvupzUQO5PIRa5AcdDvNInjp9GmWiXCL4TEMV/t2Mw%3D' -o /tmp/v132.zip
          rm -rf /tmp/v132
          mkdir -p /tmp/v132
          unzip -q /tmp/v132.zip -d /tmp/v132
          EXPECTED='e9ab412aa70c5b93b1a157167bc828e7a5bef475753c4246aa091391e5a830d8'
          test "$(sha256sum /tmp/v132/Maroowell-1.3.2.apk | awk '{print $1}')" = "$EXPECTED"
          test "$(sha256sum /tmp/v132/maroowell-latest.apk | awk '{print $1}')" = "$EXPECTED"

      - name: Publish APK and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/v132/Maroowell-1.3.2.apk public/apk/Maroowell-1.3.2.apk
          cp /tmp/v132/maroowell-latest.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 35,
            "versionName": "1.3.2",
            "updatedAt": "2026-08-30",
            "fileName": "Maroowell-1.3.2.apk",
            "downloadUrl": "https://maroowell.com/apk/Maroowell-1.3.2.apk",
            "changes": [
              "26일 이후 홈 달력을 다음 정산월 기준으로 자동 전환",
              "용차 스케줄 표 행 정렬과 높이 불일치 수정",
              "용차 스케줄 배정 표시를 캠프명/라우트 2줄 형식으로 단순화",
              "배정 셀의 용차·배차 문구 제거"
            ]
          }
          JSON
          cp public/app_version.json app_version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apk/Maroowell-1.3.2.apk public/apk/maroowell-latest.apk public/app_version.json app_version.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already published'
            exit 0
          fi
          git commit -m 'Publish Maroowell Android v1.3.2'
          git push origin HEAD:main
