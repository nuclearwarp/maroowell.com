name: Inspect live Cloudflare building worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-zip-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0f644373a9db40f2b36e4ffece348c46
      CLOUDFLARE_SCRIPT_NAME: purple-resonance-61ea
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact production Worker source
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/cf-inspect .diagnostics

          v2_code=$(curl -sS -D /tmp/cf-inspect/v2.headers -o /tmp/cf-inspect/v2.bin -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_SCRIPT_NAME}/content/v2" || true)

          V2_HTTP="$v2_code" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const candidate = fs.existsSync('/tmp/cf-inspect/v2.bin') ? fs.readFileSync('/tmp/cf-inspect/v2.bin') : Buffer.alloc(0);
          const headers = fs.existsSync('/tmp/cf-inspect/v2.headers') ? fs.readFileSync('/tmp/cf-inspect/v2.headers','utf8') : '';
          const contentType = (headers.match(/^content-type:\s*([^\r\n]+)/im)||[])[1] || '';
          const text = candidate.toString('utf8');

          function redact(s) {
            return String(s)
              .replace(/(Bearer\s+)[A-Za-z0-9._~+\/-]+/gi, '$1[redacted]')
              .replace(/(service[_-]?role[^\r\n:=]{0,40}[:=]\s*["'`]?)[A-Za-z0-9._~+\/-]{18,}/gi, '$1[redacted]')
              .replace(/(apikey[^\r\n:=]{0,30}[:=]\s*["'`]?)[A-Za-z0-9._~+\/-]{18,}/gi, '$1[redacted]')
              .replace(/(secret[^\r\n:=]{0,30}[:=]\s*["'`]?)[A-Za-z0-9._~+\/-]{18,}/gi, '$1[redacted]')
              .replace(/eyJ[A-Za-z0-9._-]{40,}/g, '[jwt-redacted]');
          }

          const startMarker = '// K-APT에서 총세대수가 정상 확인된 단지만 먼저 집계한다.';
          const endMarker = 'const topContributors';
          const start = text.indexOf(startMarker);
          const end0 = start >= 0 ? text.indexOf(endMarker, start) : -1;
          if (start < 0 || end0 < 0) throw new Error('Target aggregation block not found');
          const end = Math.min(text.length, end0 + 1200);
          const target = redact(text.slice(start, end));

          const sourceVersionMatch = text.match(/const BUILDING_STATS_SOURCE_VERSION\s*=\s*\n?\s*"([^"]+)"/);
          let out = '# Live Cloudflare building Worker target block\n\n';
          out += `worker: ${process.env.CLOUDFLARE_SCRIPT_NAME}\n\n`;
          out += '```text\n';
          out += `v2_http=${process.env.V2_HTTP || ''}\n`;
          out += `bytes=${candidate.length}\n`;
          out += `content_type=${contentType}\n`;
          out += `source_sha256=${crypto.createHash('sha256').update(candidate).digest('hex')}\n`;
          out += `source_version=${sourceVersionMatch ? sourceVersionMatch[1] : 'unknown'}\n`;
          out += `target_start=${start} target_end=${end}\n`;
          out += '```\n\n## Aggregation block\n\n```js\n' + target + '\n```\n';
          fs.writeFileSync('.diagnostics/live-zip-worker-summary.md', out);
          NODE

          if grep -Fq "$CLOUDFLARE_API_TOKEN" .diagnostics/live-zip-worker-summary.md; then
            echo 'Token leakage guard failed' >&2
            exit 1
          fi

      - name: Commit sanitized diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/live-zip-worker-summary.md
          if git diff --cached --quiet; then
            echo 'No diagnostic changes'
            exit 0
          fi
          git commit -m 'Record live KAPT parcel aggregation block'
          git push origin HEAD:main
