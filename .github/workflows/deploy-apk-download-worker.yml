name: Deploy APK download worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/apk-download/**'
      - '.github/workflows/deploy-apk-download-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-apk-download-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Worker with Durable Object storage
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p .diagnostics
          : > .diagnostics/apk-worker-wrangler.log
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          cat > wrangler-apk.toml <<'TOML'
          name = "maroowell-app-download"
          main = "workers/apk-download/index.js"
          account_id = "0f644373a9db40f2b36e4ffece348c46"
          compatibility_date = "2026-08-21"
          workers_dev = true
          routes = [
            { pattern = "maroowell.com/downloads/*", zone_name = "maroowell.com" },
            { pattern = "maroowell.com/upload/*", zone_name = "maroowell.com" }
          ]

          [durable_objects]
          bindings = [
            { name = "APK_STORE", class_name = "ApkStore" }
          ]

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["ApkStore"]
          TOML
          npx wrangler@4 deploy --config wrangler-apk.toml 2>&1 | tee .diagnostics/apk-worker-wrangler.log

      - name: Verify Worker health
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          curl -fsS --retry 5 --retry-delay 2 https://maroowell-app-download.brain-0f6.workers.dev/health 2>&1 | tee .diagnostics/apk-worker-health.log
          grep -q 'durable-object' .diagnostics/apk-worker-health.log

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .diagnostics
          {
            echo "deploy=$DEPLOY_OUTCOME"
            echo "verify=$VERIFY_OUTCOME"
            echo "commit=$GITHUB_SHA"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '--- wrangler tail ---'
            tail -n 80 .diagnostics/apk-worker-wrangler.log 2>/dev/null || true
            echo '--- health tail ---'
            tail -n 30 .diagnostics/apk-worker-health.log 2>/dev/null || true
          } > .diagnostics/apk-worker-deploy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/apk-worker-deploy.txt
          git commit -m 'Record APK worker deployment details' || exit 0
          git pull --rebase origin main
          git push origin main

      - name: Fail if deployment failed
        if: steps.deploy.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1

# Trigger marker: durable-object-v1
