name: Probe Copernicus runtime auth 20260829

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-copernicus-runtime-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0f644373a9db40f2b36e4ffece348c46
      CLOUDFLARE_SCRIPT_NAME: purple-resonance-61ea
      PROBE_ORIGIN: https://zip.maroowell.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact production worker and settings
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/cop-probe .diagnostics
          curl -fsS -D /tmp/cop-probe/content.headers \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_SCRIPT_NAME}/content/v2" \
            -o /tmp/cop-probe/content.multipart
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_SCRIPT_NAME}/settings" \
            -o /tmp/cop-probe/settings.json

      - name: Extract source, metadata and add temporary random probe route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import json, re, secrets

          headers=Path('/tmp/cop-probe/content.headers').read_text(errors='ignore')
          ctype=re.findall(r'(?im)^content-type:\s*([^\r\n]+)',headers)[-1].strip()
          raw=Path('/tmp/cop-probe/content.multipart').read_bytes()
          msg=BytesParser(policy=default).parsebytes((f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
          source=None
          for part in msg.iter_parts():
              if part.get_param('name',header='content-disposition')=='worker.js':
                  source=(part.get_payload(decode=True) or b'').decode('utf-8')
                  break
          if source is None: raise SystemExit('worker.js part not found')
          Path('/tmp/cop-probe/original-worker.js').write_text(source,encoding='utf-8')

          settings=json.loads(Path('/tmp/cop-probe/settings.json').read_text()).get('result') or {}
          metadata={'main_module':'worker.js'}
          bindings=[]
          for b in settings.get('bindings') or []:
              if isinstance(b,dict) and b.get('name'):
                  bindings.append({'type':'inherit','name':b['name'],'version_id':'latest'})
          if bindings: metadata['bindings']=bindings
          for key in ('compatibility_date','compatibility_flags','placement'):
              val=settings.get(key)
              if val not in (None,[],{}): metadata[key]=val
          Path('/tmp/cop-probe/metadata.json').write_text(json.dumps(metadata,separators=(',',':')),encoding='utf-8')

          nonce=secrets.token_urlsafe(24)
          probe_path=f'/__mw_copernicus_probe_{nonce}'
          Path('/tmp/cop-probe/probe-path.txt').write_text(probe_path,encoding='utf-8')

          helper=r'''
async function __mwCopernicusRuntimeProbe(env) {
  const out = {
    ok: true,
    endpoint: String(COPERNICUS_PROCESS_URL || ""),
    tokenEndpoint: String(COPERNICUS_TOKEN_URL || ""),
    existing: {},
    manual: {}
  };

  const safeClaims = (token) => {
    try {
      const p = String(token || "").split(".")[1] || "";
      const padded = p.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((p.length + 3) % 4);
      const json = JSON.parse(atob(padded));
      return {
        iss: json.iss || null,
        aud: json.aud || null,
        azp: json.azp || null,
        scope: json.scope || null,
        typ: json.typ || null,
        exp: json.exp || null,
        iat: json.iat || null
      };
    } catch (e) {
      return { parseError: String(e?.message || e) };
    }
  };

  const probeProcess = async (token, path) => {
    const url = `https://sh.dataspace.copernicus.eu${path}`;
    const r = await fetch(url, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: "{}",
      cf: { cacheTtl: 0, cacheEverything: false }
    });
    const text = await r.text().catch(() => "");
    return { status: r.status, body: text.slice(0, 500) };
  };

  try {
    const token = await getCopernicusAccessToken(env, true);
    out.existing.tokenClaims = safeClaims(token);
    out.existing.legacyPath = await probeProcess(token, "/api/v1/process");
    out.existing.newPath = await probeProcess(token, "/process/v1");
  } catch (e) {
    out.existing.error = String(e?.message || e);
  }

  try {
    const body = new URLSearchParams();
    body.set("grant_type", "client_credentials");
    body.set("client_id", String(env.COPERNICUS_CLIENT_ID || ""));
    body.set("client_secret", String(env.COPERNICUS_CLIENT_SECRET || ""));
    const tr = await fetch(COPERNICUS_TOKEN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=utf-8" },
      body: body.toString(),
      cf: { cacheTtl: 0, cacheEverything: false }
    });
    const tt = await tr.text().catch(() => "");
    let td = null;
    try { td = tt ? JSON.parse(tt) : null; } catch {}
    out.manual.tokenStatus = tr.status;
    if (tr.ok && td?.access_token) {
      out.manual.tokenClaims = safeClaims(td.access_token);
      out.manual.legacyPath = await probeProcess(td.access_token, "/api/v1/process");
      out.manual.newPath = await probeProcess(td.access_token, "/process/v1");
    } else {
      out.manual.tokenError = String(td?.error_description || td?.error || tt || `HTTP ${tr.status}`).slice(0, 500);
    }
  } catch (e) {
    out.manual.error = String(e?.message || e);
  }

  return new Response(JSON.stringify(out), {
    status: 200,
    headers: { "Content-Type": "application/json", "Cache-Control": "no-store" }
  });
}
'''
          source=helper+'\n'+source
          m=re.search(r'(export\s+default\s*\{[\s\S]{0,600}?async\s+fetch\s*\([^)]*\)\s*\{)',source)
          if not m:
              raise SystemExit('module fetch handler not found')
          inject=f'''\n      try {{\n        if (new URL(request.url).pathname === {json.dumps(probe_path)}) {{\n          return await __mwCopernicusRuntimeProbe(env);\n        }}\n      }} catch (e) {{}}\n'''
          source=source[:m.end()]+inject+source[m.end():]
          Path('/tmp/cop-probe/probe-worker.js').write_text(source,encoding='utf-8')
          PY

      - name: Deploy temporary runtime probe
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cp /tmp/cop-probe/probe-worker.js /tmp/cop-probe/worker.js
          code=$(curl -sS -o /tmp/cop-probe/probe-deploy.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/cop-probe/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/cop-probe/worker.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_SCRIPT_NAME}?bindings_inherit=strict" || true)
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Call runtime probe and sanitize result
        shell: bash
        run: |
          set -euo pipefail
          set +x
          sleep 3
          path=$(cat /tmp/cop-probe/probe-path.txt)
          code=$(curl -sS -o /tmp/cop-probe/result.json -w '%{http_code}' "${PROBE_ORIGIN}${path}" || true)
          echo "probe_http=$code"
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          raw=Path('/tmp/cop-probe/result.json').read_text(errors='ignore') if Path('/tmp/cop-probe/result.json').exists() else ''
          try: data=json.loads(raw)
          except Exception: data={'raw':raw[:1000]}
          text=json.dumps(data,ensure_ascii=False,indent=2)
          text=re.sub(r'eyJ[A-Za-z0-9._-]{40,}','[jwt-redacted]',text)
          text=re.sub(r'(?i)(client_secret|access_token|refresh_token)\s*[=:]\s*[^\s,}\"]+',r'\1=[redacted]',text)
          out='# Copernicus runtime auth probe 2026-08-29\n\n```json\n'+text+'\n```\n'
          Path('.diagnostics/copernicus-runtime-probe-20260829.md').write_text(out,encoding='utf-8')
          PY

      - name: Restore exact production worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ ! -f /tmp/cop-probe/original-worker.js ] || [ ! -f /tmp/cop-probe/metadata.json ]; then
            echo 'Original worker or metadata missing; cannot restore' >&2
            exit 1
          fi
          cp /tmp/cop-probe/original-worker.js /tmp/cop-probe/worker.js
          code=$(curl -sS -o /tmp/cop-probe/restore.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/cop-probe/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/cop-probe/worker.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_SCRIPT_NAME}?bindings_inherit=strict" || true)
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Commit sanitized probe result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .diagnostics/copernicus-runtime-probe-20260829.md ]; then
            echo '# Copernicus runtime auth probe 2026-08-29' > .diagnostics/copernicus-runtime-probe-20260829.md
            echo >> .diagnostics/copernicus-runtime-probe-20260829.md
            echo 'Probe did not produce a readable result.' >> .diagnostics/copernicus-runtime-probe-20260829.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/copernicus-runtime-probe-20260829.md
          git diff --cached --check
          git commit -m 'Record Copernicus runtime auth probe' || true
          git pull --rebase origin main
          git push origin HEAD:main
