name: Deploy route worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-route-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-route-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify secured source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node tests/vendor-access-regression.mjs
          grep -Fq 'MW_ROUTE_WRITE_AUTH_V1' worker.js
          grep -Fq 'requireRouteWriteAccess(request, env)' worker.js
          grep -Fq 'ROUTE_WRITE_MIN_LEVEL = 60' worker.js
          grep -Fq 'name = "purple-river-0717"' wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config wrangler.toml

      - name: Verify live auth gate
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://purple-river-0717.brain-0f6.workers.dev'
          sleep 3
          health=$(curl -sS -o /tmp/health -w '%{http_code}' "$BASE/health")
          test "$health" = '200'

          route=$(curl -sS -o /tmp/route -w '%{http_code}' -X POST "$BASE/route" \
            -H 'Content-Type: application/json' --data '{}')
          cat /tmp/route
          test "$route" = '401'

          vendor_read=$(curl -sS -o /tmp/vendor-read -w '%{http_code}' "$BASE/vendors?limit=1")
          cat /tmp/vendor-read
          test "$vendor_read" = '200'
          grep -q '"rows"' /tmp/vendor-read

          public_vendor=$(curl -sS -o /tmp/public-vendor -w '%{http_code}' "$BASE/vendors/view?limit=1")
          cat /tmp/public-vendor
          test "$public_vendor" = '200'
          node - <<'NODE'
          const fs = require('node:fs');
          const obj = JSON.parse(fs.readFileSync('/tmp/public-vendor', 'utf8'));
          if (!Array.isArray(obj.rows) || !obj.rows.length) throw new Error('Public vendor list is empty');
          for (const row of obj.rows) {
            for (const secret of ['memo', 'email', 'vendor_contact', 'company_address', 'vendor_representative']) {
              if (Object.prototype.hasOwnProperty.call(row, secret)) throw new Error('Public vendor list leaked ' + secret);
            }
          }
          NODE

          permission=$(curl -sS -o /tmp/vendor-permission -w '%{http_code}' "$BASE/vendors/permissions")
          cat /tmp/vendor-permission
          test "$permission" = '401'

          private_vendor=$(curl -sS -o /tmp/private-vendor -w '%{http_code}' "$BASE/vendors/admin?limit=1")
          cat /tmp/private-vendor
          test "$private_vendor" = '401'

          vendor=$(curl -sS -o /tmp/vendor -w '%{http_code}' -X POST "$BASE/vendors" \
            -H 'Content-Type: application/json' --data '{}')
          cat /tmp/vendor
          test "$vendor" = '401'

          fake_vendor='00000000-0000-0000-0000-000000000000'
          vendor_patch=$(curl -sS -o /tmp/vendor-patch -w '%{http_code}' -X PATCH "$BASE/vendors/$fake_vendor" \
            -H 'Content-Type: application/json' --data '{"name":"test"}')
          cat /tmp/vendor-patch
          test "$vendor_patch" = '401'

          vendor_delete=$(curl -sS -o /tmp/vendor-delete -w '%{http_code}' -X DELETE "$BASE/vendors/$fake_vendor")
          cat /tmp/vendor-delete
          test "$vendor_delete" = '401'

          external_vendor=$(curl -sS -o /tmp/external-vendor -w '%{http_code}' "$BASE/api/v1/vendors?limit=1")
          cat /tmp/external-vendor
          test "$external_vendor" = '401'

          master=$(curl -sS -o /tmp/master -w '%{http_code}' "$BASE/route-master")
          cat /tmp/master
          test "$master" = '401'
