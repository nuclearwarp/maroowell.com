name: Run realtime driver PK patch v3
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_realtime_driver_pk_v3.py
      - name: Syntax check
        run: node --check workers/meta-collector/entry.js
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workers/meta-collector/entry.js public/realtime
          git commit -m "Use Maroowell PK for realtime identity"
          git push
