name: Patch signup approval and app-only access

on:
  push:
    branches: [feature/admin-approval-app-only]
    paths:
      - '.github/workflows/patch-admin-approval-app-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-approval-app-only
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch website
        run: |
          python - <<'PY'
