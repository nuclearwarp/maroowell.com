name: Deploy Maroowell Android v1.0.4 APK

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprseasia.oaiusercontent.com/files/00000000-f02c-8207-a105-2d164e789ce9/raw?se=2026-08-17T23%3A11%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=1160249a-bf6c-5707-9372-63bb5c7d47e9&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T22%3A44%3A39Z&ske=2026-08-18T22%3A44%3A39Z&sks=b&skv=2026-02-06&sig=66pBE2leYuVWxdNaTPkIja4R5cKy%2BJSMiswau4OV7U4%3D' -o artifact.zip
          unzip -o artifact.zip -d artifact
          APK=$(find artifact -type f -name 'Maroowell-1.0.4.apk' | head -n 1)
          test -n "$APK"
          mkdir -p apk-dist/downloads
          cp "$APK" apk-dist/downloads/Maroowell-1.0.4.apk
          cp "$APK" apk-dist/downloads/maroowell-latest.apk
          sha256sum apk-dist/downloads/Maroowell-1.0.4.apk
      - name: Deploy and verify
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cat > wrangler-apk.toml <<'TOML'
          name = "maroowell-app-download"
          account_id = "0f644373a9db40f2b36e4ffece348c46"
          compatibility_date = "2026-08-18"
          workers_dev = true
          routes = [
            { pattern = "maroowell.com/downloads/*", zone_name = "maroowell.com" }
          ]

          [assets]
          directory = "./apk-dist"
          TOML
          npx wrangler@4 deploy --config wrangler-apk.toml
          curl -fL --retry 5 --retry-delay 3 -o /tmp/verify.apk https://maroowell-app-download.brain-0f6.workers.dev/downloads/Maroowell-1.0.4.apk
          test -s /tmp/verify.apk
          sha256sum /tmp/verify.apk
