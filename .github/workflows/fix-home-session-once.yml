name: Fix Home session storage once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-session-once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Home auth storage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/home')
          s = p.read_text(encoding='utf-8')
          before = s.count('storage:localStorage') + s.count('storage: localStorage')
          s = s.replace('storage:localStorage', 'storage:sessionStorage')
          s = s.replace('storage: localStorage', 'storage: sessionStorage')
          p.write_text(s, encoding='utf-8')
          print('replacements=', before)
          if before == 0:
              raise SystemExit('No Home localStorage auth occurrence found')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/home
          git commit -m "Fix Home auth session storage"
          git push
