name: Diagnose schedule worker
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag-schedule-worker.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List worker scripts and routes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 0f644373a9db40f2b36e4ffece348c46
        run: |
          set -e
          echo '--- worker scripts ---'
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" | jq -r '.result[]?.id'
          echo '--- zone ---'
          ZONE=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=maroowell.com" | jq -r '.result[0].id')
          echo "zone=$ZONE"
          echo '--- routes ---'
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" | jq -r '.result[]? | [.pattern,.script] | @tsv'
          echo '--- custom domains ---'
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains" | jq -r '.result[]? | [.hostname,.service] | @tsv'
