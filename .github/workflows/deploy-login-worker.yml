name: Deploy login worker

on:
  push:
    branches:
      - main
    paths:
      - 'login-worker-v2.js'
      - 'public/mw-secure-web.js'
      - 'tests/security-web-bridge.test.mjs'
      - 'login-wrangler.toml'
      - 'public/**'
      - '.github/workflows/deploy-login-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-login-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser security bridge
        run: node tests/security-web-bridge.test.mjs && node --check login-worker-v2.js
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config login-wrangler.toml --keep-vars
