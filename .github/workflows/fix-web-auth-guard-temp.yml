name: Fix web auth guard and Cloudflare cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-web-auth-guard-temp.yml'

permissions:
  contents: write

concurrency:
  group: fix-web-auth-guard-main
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden web permission guard and bust cached guard URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          board = Path('public/board-menu.js')
          s = board.read_text(encoding='utf-8')
          version = '20260822-auth-guard-v2'

          anchor = '  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));\n'
          marker = f'  const BOARD_MENU_BUILD = "{version}";\n'
          if marker not in s:
              if anchor not in s:
                  raise SystemExit('wait anchor not found')
              s = s.replace(anchor, anchor + marker, 1)

          old = '''  async function requestSessionCopy(supabaseUrl, timeoutMs = 1400) {
    const projectRef = getSupabaseProjectRef(supabaseUrl);
    if (!projectRef || readStoredSession(supabaseUrl)) return !!readStoredSession(supabaseUrl);
'''
          new = '''  async function requestSessionCopy(supabaseUrl, timeoutMs = 1400, force = false) {
    const projectRef = getSupabaseProjectRef(supabaseUrl);
    if (!projectRef) return false;
    const existing = readStoredSession(supabaseUrl);
    if (!force && isSessionFresh(existing)) return true;
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'requestSessionCopy(supabaseUrl, timeoutMs = 1400, force = false)' not in s:
              raise SystemExit('requestSessionCopy target not found')

          helper_anchor = '  async function supabaseJson(path, { token, method = "GET", body, object = false } = {}) {\n'
          helper = '''  function isSessionFresh(session, skewSeconds = 45) {
    const token = String(session?.access_token || "");
    if (!token) return false;
    const jwt = decodeJwtPayload(token) || {};
    const exp = Number(session?.expires_at || jwt.exp || 0);
    if (!exp) return true;
    return exp > (Date.now() / 1000) + Math.max(0, Number(skewSeconds) || 0);
  }

  function sessionLabel(session) {
    const token = String(session?.access_token || "");
    const jwt = decodeJwtPayload(token) || {};
    return String(session?.user?.email || jwt.email || "");
  }

'''
          if 'function isSessionFresh(' not in s:
              if helper_anchor not in s:
                  raise SystemExit('supabaseJson anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          target = '''      throw new Error(message);
    }
    if (!text) return null;
'''
          repl = '''      const error = new Error(message);
      error.status = res.status;
      throw error;
    }
    if (!text) return null;
'''
          if target in s:
              s = s.replace(target, repl, 1)
          elif 'error.status = res.status;' not in s:
              raise SystemExit('status-aware REST error target not found')

          old = '''    let session = readStoredSession(SUPABASE_URL);
    if (!session) {
      await requestSessionCopy(SUPABASE_URL, 1400);
      session = readStoredSession(SUPABASE_URL);
    }
    const accessToken = String(session?.access_token || "");
    if (!accessToken) return out;
'''
          new = '''    let session = readStoredSession(SUPABASE_URL);
    if (!isSessionFresh(session)) {
      await requestSessionCopy(SUPABASE_URL, 1800, true);
      session = readStoredSession(SUPABASE_URL);
    }
    const accessToken = String(session?.access_token || "");
    if (!accessToken) return out;
    if (!isSessionFresh(session, 5)) {
      const staleEmail = sessionLabel(session);
      const error = new Error(staleEmail
        ? `로그인 세션 갱신이 지연되고 있습니다. (${staleEmail}) 잠시 후 다시 확인해주세요.`
        : "로그인 세션 갱신이 지연되고 있습니다. 잠시 후 다시 확인해주세요.");
      error.status = 401;
      throw error;
    }
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '로그인 세션 갱신이 지연되고 있습니다.' not in s:
              raise SystemExit('loadAccessOnce session block not found')

          old = '''  async function loadAccess() {
    let lastError = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        return await loadAccessOnce();
      } catch (error) {
        lastError = error;
        if (attempt < 3) await wait(250 * (attempt + 1));
      }
    }
    throw lastError || new Error("권한 정보를 확인하지 못했습니다.");
  }
'''
          new = '''  async function loadAccess() {
    let lastError = null;
    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        return await loadAccessOnce();
      } catch (error) {
        lastError = error;
        if (Number(error?.status || 0) === 401) {
          const { SUPABASE_URL } = window.MARUWELL_CONFIG || {};
          if (SUPABASE_URL) await requestSessionCopy(SUPABASE_URL, 1800, true);
        }
        if (attempt < 4) await wait(350 * (attempt + 1));
      }
    }
    throw lastError || new Error("권한 정보를 확인하지 못했습니다.");
  }
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'attempt < 5' not in s:
              raise SystemExit('loadAccess retry block not found')

          init_old = '''  async function init() {
    const current = findCurrentPage();
'''
          init_new = '''  async function init() {
    console.info("[board-menu] build", BOARD_MENU_BUILD);
    const current = findCurrentPage();
'''
          if init_old in s:
              s = s.replace(init_old, init_new, 1)

          board.write_text(s, encoding='utf-8')

          # Cache-bust every page that loads the shared guard.
          pattern = re.compile(r'(<script\s+src=["\'])/board-menu\.js(?:\?[^"\']*)?(["\']\s*>\s*</script>)', re.I)
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or p == board:
                  continue
              posix = p.as_posix()
              if posix.startswith('.git/') or posix.startswith('.github/'):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if '/board-menu.js' not in text:
                  continue
              updated = pattern.sub(r'\1/board-menu.js?v=' + version + r'\2', text)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(posix)

          diag = Path('.diagnostics/web-auth-fix.txt')
          diag.parent.mkdir(parents=True, exist_ok=True)
          diag.write_text(
              f'build={version}\n'
              'reason=stale-or-transient auth must not become false permission denial\n'
              f'cache_bust=/board-menu.js?v={version}\n'
              f'cache_busted_files={len(changed)}\n',
              encoding='utf-8'
          )
          print('cache-busted files:', len(changed))
          PY
          git diff --check

      - name: Commit web fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-web-auth-guard-temp.yml
          git add -A
          git commit -m "Fix false web access denial and bust auth guard cache"
          git pull --rebase origin main
          git push origin main

      - name: Audit Cloudflare edge and purge stale web cache
        id: cloudflare
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: '0f644373a9db40f2b36e4ffece348c46'
        run: |
          set +e
          mkdir -p .diagnostics
          : > .diagnostics/web-auth-cloudflare.txt
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'cloudflare_token_present=false' >> .diagnostics/web-auth-cloudflare.txt
            exit 0
          fi
          echo 'cloudflare_token_present=true' >> .diagnostics/web-auth-cloudflare.txt
          H1="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_json=$(curl -sS -H "$H1" 'https://api.cloudflare.com/client/v4/zones?name=maroowell.com&status=active')
          zone_id=$(printf '%s' "$zone_json" | python -c 'import json,sys; x=json.load(sys.stdin); r=x.get("result") or []; print(r[0].get("id","") if r else "")' 2>/dev/null)
          echo "zone_found=$([ -n "$zone_id" ] && echo true || echo false)" >> .diagnostics/web-auth-cloudflare.txt
          if [ -n "$zone_id" ]; then
            routes_json=$(curl -sS -H "$H1" "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes")
            python - "$routes_json" >> .diagnostics/web-auth-cloudflare.txt <<'PY'
          import json,sys
          try: x=json.loads(sys.argv[1]); rows=x.get('result') or []
          except Exception: rows=[]
          print('worker_routes_count=' + str(len(rows)))
          for r in rows:
              print('worker_route=' + str(r.get('pattern') or '') + ' -> ' + str(r.get('script') or r.get('script_name') or ''))
          PY
            purge=$(curl -sS -X POST -H "$H1" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" --data '{"purge_everything":true}')
            purge_ok=$(printf '%s' "$purge" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("success"))).lower())' 2>/dev/null)
            echo "purge_success=${purge_ok:-false}" >> .diagnostics/web-auth-cloudflare.txt
          fi

          # Inspect the deployed routeinfo Worker without ever printing its source/secrets.
          code=$(curl -sS -o /tmp/routeinfo-worker -w '%{http_code}' -H "$H1" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/routeinfo")
          echo "routeinfo_script_fetch_http=${code}" >> .diagnostics/web-auth-cloudflare.txt
          if [ "$code" = 200 ]; then
            grep -a -qi 'Authorization' /tmp/routeinfo-worker; echo "routeinfo_has_authorization_logic=$([ $? -eq 0 ] && echo true || echo false)" >> .diagnostics/web-auth-cloudflare.txt
            grep -a -Eqi 'mw_my_access|is_maroowell|user_access' /tmp/routeinfo-worker; echo "routeinfo_has_maroowell_access_logic=$([ $? -eq 0 ] && echo true || echo false)" >> .diagnostics/web-auth-cloudflare.txt
            grep -a -qi 'Access-Control-Allow-Origin' /tmp/routeinfo-worker; echo "routeinfo_has_cors_logic=$([ $? -eq 0 ] && echo true || echo false)" >> .diagnostics/web-auth-cloudflare.txt
            grep -a -Eqi 'Cache-Control.{0,50}(no-store|private)|no-store.{0,50}Cache-Control' /tmp/routeinfo-worker; echo "routeinfo_has_private_cache_control=$([ $? -eq 0 ] && echo true || echo false)" >> .diagnostics/web-auth-cloudflare.txt
          fi

          options_code=$(curl -sS -o /tmp/routeinfo-options -w '%{http_code}' --max-time 10 -X OPTIONS 'https://routeinfo.brain-0f6.workers.dev/route-info/routes' -H 'Origin: https://maroowell.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')
          unauth_code=$(curl -sS -o /tmp/routeinfo-unauth -w '%{http_code}' --max-time 10 -X POST 'https://routeinfo.brain-0f6.workers.dev/route-info/routes' -H 'Origin: https://maroowell.com' -H 'Content-Type: application/json' --data '{}')
          health_code=$(curl -sS -o /tmp/routeinfo-health -w '%{http_code}' --max-time 10 'https://routeinfo.brain-0f6.workers.dev/health')
          echo "routeinfo_options_http=${options_code:-000}" >> .diagnostics/web-auth-cloudflare.txt
          echo "routeinfo_unauth_http=${unauth_code:-000}" >> .diagnostics/web-auth-cloudflare.txt
          echo "routeinfo_health_http=${health_code:-000}" >> .diagnostics/web-auth-cloudflare.txt
          exit 0

      - name: Verify live web guard
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .diagnostics
          ok=0
          for i in $(seq 1 24); do
            curl -fsS --max-time 10 "https://maroowell.com/board-menu.js?mwfix=20260822-auth-guard-v2-${GITHUB_RUN_ID}-${i}" -o /tmp/board-menu-live.js
            if [ $? -eq 0 ] && grep -q '20260822-auth-guard-v2' /tmp/board-menu-live.js && grep -q 'error.status = res.status' /tmp/board-menu-live.js; then
              ok=1
              break
            fi
            sleep 5
          done
          echo "web_guard_live=${ok}" > .diagnostics/web-auth-live.txt
          exit $([ "$ok" = 1 ] && echo 0 || echo 1)

      - name: Record edge verification
        if: always()
        shell: bash
        env:
          CF_OUTCOME: ${{ steps.cloudflare.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          echo "cloudflare_step=${CF_OUTCOME}" >> .diagnostics/web-auth-live.txt
          echo "verify_step=${VERIFY_OUTCOME}" >> .diagnostics/web-auth-live.txt
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .diagnostics/web-auth-live.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add .diagnostics/web-auth-cloudflare.txt .diagnostics/web-auth-live.txt
          git commit -m "Record web auth Cloudflare verification" || exit 0
          git push origin main

      - name: Fail if live guard did not deploy
        if: steps.verify.outcome != 'success'
        run: exit 1

