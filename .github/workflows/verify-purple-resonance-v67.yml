name: Verify purple-resonance V67

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-purple-resonance-v67.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0f644373a9db40f2b36e4ffece348c46
      CLOUDFLARE_SCRIPT_NAME: purple-resonance-61ea
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect live source
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics /tmp/cf-verify
          code=$(curl -sS -D /tmp/cf-verify/headers -o /tmp/cf-verify/live.multipart -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_SCRIPT_NAME}/content/v2" || true)
          version='unknown'
          if grep -a -q 'BUILDING_HUB_KAPT_V67_KAPT_PARCEL_DEDUPE_2026-08-23' /tmp/cf-verify/live.multipart; then version='V67'; fi
          sha=$(sha256sum /tmp/cf-verify/live.multipart | awk '{print $1}')
          guard_count=$(grep -a -o 'coveredByKapt && unitType !== "commercial"' /tmp/cf-verify/live.multipart | wc -l | tr -d ' ')
          fallback_count=$(grep -a -o 'coveredByKapt && part.type !== "commercial"' /tmp/cf-verify/live.multipart | wc -l | tr -d ' ')
          cat > .diagnostics/purple-resonance-v67-status.md <<EOF
          # purple-resonance-61ea V67 status

          - http: ${code}
          - live_version: ${version}
          - live_sha256: ${sha}
          - exclusive_guard_count: ${guard_count}
          - fallback_guard_count: ${fallback_count}
          EOF

      - name: Commit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/purple-resonance-v67-status.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record purple-resonance V67 live status'
            git push origin HEAD:main
          fi

      - name: Enforce V67
        shell: bash
        run: |
          grep -q 'live_version: V67' .diagnostics/purple-resonance-v67-status.md
          grep -Eq 'exclusive_guard_count: [1-9]' .diagnostics/purple-resonance-v67-status.md
          grep -Eq 'fallback_guard_count: [2-9]' .diagnostics/purple-resonance-v67-status.md
