name: Test META auto recover

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-meta-auto-recover.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call auto recover safely
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 'https://meta-direct-poc.brain-0f6.workers.dev/auto-recover' -o /tmp/r.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r.json'))
          print(json.dumps({
            'ok':d.get('ok'),
            'stage':d.get('stage'),
            'mfaRequired':d.get('mfaRequired'),
            'loginRequired':d.get('loginRequired'),
            'status':d.get('status'),
            'title':d.get('title'),
            'error':d.get('error')
          },ensure_ascii=False))
          PY

