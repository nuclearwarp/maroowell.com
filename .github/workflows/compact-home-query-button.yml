name: Compact Home query control
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-home-query-button.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Home query control
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/home')
          s=p.read_text(encoding='utf-8')
          s=s.replace('grid-template-columns:minmax(330px,1.25fr) minmax(300px,1fr) minmax(420px,1.35fr) auto','grid-template-columns:minmax(240px,1.15fr) minmax(220px,.9fr) minmax(330px,1.25fr) auto')
          s=s.replace('.actions .btn{height:46px}', '.actions .btn{height:46px;min-width:72px;padding:0 14px;white-space:nowrap}')
          s=s.replace('>전체 현황 조회</button>', '>조회</button>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/home
          git commit -m "Compact Home query button"
          git push
