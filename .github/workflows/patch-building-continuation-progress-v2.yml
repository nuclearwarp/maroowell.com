name: Structural building continuation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-building-continuation-progress-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch continuation loops
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/zipcode_search')
          s = p.read_text(encoding='utf-8')
          old = "      const BUILDING_SCOPE_TITLE_CONTINUATION_MAX_ROUNDS = 32;\n      const BUILDING_KAPT_INFO_CONTINUATION_MAX_ROUNDS = 32;\n      const BUILDING_DETAIL_CONTINUATION_MAX_ROUNDS = 256;"
          new = "      // Continuation is driven by server progress, not an arbitrary round cap.\n      const BUILDING_CONTINUATION_MAX_STALL_ROUNDS = 5;"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('continuation constants not found')
          stages = [
              ('title', '          let scopeTitleEvidence = Array.isArray(data?.scopeTitleContinuation?.evidence)\n            ? data.scopeTitleContinuation.evidence\n            : [];', '\n          let scopeTitleProgressSignature = null;\n          let scopeTitleStallRounds = 0;', '          for (\n            let titleRound = 0;\n            data?.requiresScopeTitleContinuation === true &&\n              titleRound < BUILDING_SCOPE_TITLE_CONTINUATION_MAX_ROUNDS;\n            titleRound++\n          ) {', '          for (\n            let titleRound = 0;\n            data?.requiresScopeTitleContinuation === true;\n            titleRound++\n          ) {', '            const remaining = Number(progress.remainingParcelCount || 0);', '\n            const progressSignature = `${processed}:${remaining}`;\n            if (scopeTitleProgressSignature === progressSignature) scopeTitleStallRounds += 1;\n            else scopeTitleStallRounds = 0;\n            scopeTitleProgressSignature = progressSignature;\n            if (scopeTitleStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS) {\n              throw new Error(`건축물대장 표제부 조회 진행이 멈췄습니다. 처리 ${processed.toLocaleString("ko-KR")}건 / 남은 ${remaining.toLocaleString("ko-KR")}건`);\n            }', 'scopeTitleStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS'),
              ('kapt', '          let kaptInfoEvidence = Array.isArray(data?.kaptInfoContinuation?.evidence)\n            ? data.kaptInfoContinuation.evidence\n            : [];', '\n          let kaptInfoProgressSignature = null;\n          let kaptInfoStallRounds = 0;', '          for (\n            let kaptRound = 0;\n            data?.requiresKaptInfoContinuation === true &&\n              kaptRound < BUILDING_KAPT_INFO_CONTINUATION_MAX_ROUNDS;\n            kaptRound++\n          ) {', '          for (\n            let kaptRound = 0;\n            data?.requiresKaptInfoContinuation === true;\n            kaptRound++\n          ) {', '            const remaining = Number(progress.remainingComplexCount || 0);', '\n            const progressSignature = `${processed}:${remaining}`;\n            if (kaptInfoProgressSignature === progressSignature) kaptInfoStallRounds += 1;\n            else kaptInfoStallRounds = 0;\n            kaptInfoProgressSignature = progressSignature;\n            if (kaptInfoStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS) {\n              throw new Error(`K-APT 상세조회 진행이 멈췄습니다. 처리 ${processed.toLocaleString("ko-KR")}건 / 남은 ${remaining.toLocaleString("ko-KR")}건`);\n            }', 'kaptInfoStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS'),
              ('detail', '          let detailEvidence = Array.isArray(data?.detailContinuation?.evidence)\n            ? data.detailContinuation.evidence\n            : [];', '\n          let detailProgressSignature = null;\n          let detailStallRounds = 0;', '          for (\n            let detailRound = 0;\n            data?.requiresDetailContinuation === true && detailRound < BUILDING_DETAIL_CONTINUATION_MAX_ROUNDS;\n            detailRound++\n          ) {', '          for (\n            let detailRound = 0;\n            data?.requiresDetailContinuation === true;\n            detailRound++\n          ) {', '            const remaining = Number(progress.remainingParcelCount || 0);', '\n            const progressSignature = `${processed}:${remaining}`;\n            if (detailProgressSignature === progressSignature) detailStallRounds += 1;\n            else detailStallRounds = 0;\n            detailProgressSignature = progressSignature;\n            if (detailStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS) {\n              throw new Error(`상세 필지 조회 진행이 멈췄습니다. 처리 ${processed.toLocaleString("ko-KR")}건 / 남은 ${remaining.toLocaleString("ko-KR")}건`);\n            }', 'detailStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS'),
          ]
          for name, init, vars_, loop_old, loop_new, anchor, guard, marker in stages:
              if marker in s:
                  continue
              if init not in s or loop_old not in s:
                  raise SystemExit(name + ' continuation block not found')
              s = s.replace(init, init + vars_, 1)
              s = s.replace(loop_old, loop_new, 1)
              pos = s.find(init)
              anchor_pos = s.find(anchor, pos)
              if anchor_pos < 0:
                  raise SystemExit(name + ' progress anchor not found')
              end = anchor_pos + len(anchor)
              s = s[:end] + guard + s[end:]
          for bad in ('BUILDING_SCOPE_TITLE_CONTINUATION_MAX_ROUNDS', 'BUILDING_KAPT_INFO_CONTINUATION_MAX_ROUNDS', 'BUILDING_DETAIL_CONTINUATION_MAX_ROUNDS'):
              if bad in s:
                  raise SystemExit('old fixed cap remains: ' + bad)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'BUILDING_CONTINUATION_MAX_STALL_ROUNDS = 5' public/zipcode_search
          grep -q 'detailStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS' public/zipcode_search
          grep -q 'scopeTitleStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS' public/zipcode_search
          grep -q 'kaptInfoStallRounds >= BUILDING_CONTINUATION_MAX_STALL_ROUNDS' public/zipcode_search

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/zipcode_search
          git commit -m 'Make building continuation progress driven'
          git pull --rebase origin main
          git push origin HEAD:main
