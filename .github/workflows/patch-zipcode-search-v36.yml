name: Patch zipcode_search location finder

on:
  push:
    paths:
      - '.github/workflows/patch-zipcode-search-v36.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply zipcode location search patch
        run: python3 .github/scripts/patch_zipcode_location_search.py

      - name: Verify patch
        run: |
          grep -q 'ZIP_LOCATION_SEARCH_V1' public/zipcode_search
          grep -q 'id="locationSearchInput"' public/zipcode_search
          grep -q 'new kakao.maps.services.Places()' public/zipcode_search
          grep -q 'closeApartmentPopup();' public/zipcode_search

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zipcode_search
          if git diff --cached --quiet; then
            echo "No frontend changes"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Add compact Kakao location search to zipcode map"
          git push origin HEAD:main
