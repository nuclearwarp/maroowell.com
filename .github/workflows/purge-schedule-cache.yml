name: Purge schedule cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-schedule-cache.yml'
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge maroowell schedule URLs
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=maroowell.com" | python -c 'import sys,json; d=json.load(sys.stdin); print(d["result"][0]["id"])')
          curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            --data '{"files":["https://maroowell.com/maroowell_schedule","https://maroowell.com/maroowell_schedule.html","https://maroowell.com/maroowell_schedule-v20260926-1","https://maroowell.com/maroowell_schedule-v20260926-1.html"]}'
