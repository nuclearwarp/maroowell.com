name: Remove plaintext login password storage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/security-remove-password-storage.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch login page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')

          s=re.sub(r'\n\s*<label class="remember-row" for="rememberPassword">.*?</label>','',s,count=1,flags=re.S)
          s=s.replace('  const SAVED_PASSWORD_KEY = "mw_saved_login_password";','  const LEGACY_SAVED_PASSWORD_KEY = "mw_saved_login_password";')
          s=s.replace('  const rememberPassword = document.getElementById("rememberPassword");\n','')

          a=s.find('  function loadSavedPassword() {')
          b=s.find('  function shouldCountLoginFailure(',a)
          if a<0 or b<0: raise SystemExit('password helper block not found')
          s=s[:a]+'  function purgeLegacySavedPasswordStorage() {\n    try { window.localStorage.removeItem(LEGACY_SAVED_PASSWORD_KEY); } catch {}\n  }\n\n'+s[b:]

          s=s.replace('  loadSavedEmail();\n  loadSavedPassword();\n  refreshForgotPasswordUi();','  purgeLegacySavedPasswordStorage();\n  loadSavedEmail();\n  refreshForgotPasswordUi();')
          s=s.replace('  email.addEventListener("input", () => {\n    refreshForgotPasswordUi();\n    syncSavedPasswordByEmail();\n  });','  email.addEventListener("input", () => {\n    refreshForgotPasswordUi();\n  });')

          s=re.sub(r'\n\s*if \(rememberPassword\?\.checked\) \{.*?window\.localStorage\.removeItem\(SAVED_PASSWORD_KEY\);\s*\n\s*\}', '', s, count=1, flags=re.S)
          s=s.replace('        else window.localStorage.removeItem(SAVED_EMAIL_KEY);','        else window.localStorage.removeItem(SAVED_EMAIL_KEY);\n        window.localStorage.removeItem(LEGACY_SAVED_PASSWORD_KEY);',1)
          s=re.sub(r'\n\s*if \(rememberPassword\) \{.*?clearSavedPassword\(\);.*?\}\s*\n\s*\}\);\s*\n\s*\}', '', s, count=1, flags=re.S)

          forbidden=['rememberPassword','savedPassword','SAVED_PASSWORD_KEY','loadSavedPassword','syncSavedPasswordByEmail','clearSavedPassword']
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('leftovers: '+','.join(bad))
          if 'LEGACY_SAVED_PASSWORD_KEY = "mw_saved_login_password"' not in s: raise SystemExit('legacy key missing')
          if 'autocomplete="current-password"' not in s: raise SystemExit('autocomplete missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'purgeLegacySavedPasswordStorage' public/index.html
          grep -Fq 'autocomplete="current-password"' public/index.html
          ! grep -Fq 'rememberPassword' public/index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Stop storing login passwords in localStorage'
          git pull --rebase origin main
          git push origin HEAD:main
