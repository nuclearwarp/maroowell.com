name: Diagnose Maroowell META outage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/meta-incident-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify META login entry (one request)
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.error
          req=urllib.request.Request('https://meta-direct-poc.brain-0f6.workers.dev/login-send-code',headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json'})
          try:
              r=urllib.request.urlopen(req,timeout=90)
          except urllib.error.HTTPError as e:
              r=e
          text=r.read().decode('utf-8','replace')
          summary={'http':r.status,'otp_form':'name="code"' in text and 'name="state"' in text,'title':re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:1]}
          try:
              d=json.loads(text)
              summary.update({k:d[k] for k in ['ok','error','stage','status'] if k in d})
              diag=d.get('diagnostics') or {}
              summary['page_title']=diag.get('title')
              summary['page_text']=re.sub(r'\b\d{4,}\b','[redacted]',diag.get('visibleText',''))[:450]
              summary['form_fields']=[[i.get('name') for i in f.get('inputs',[])] for f in diag.get('forms',[])]
          except ValueError:
              if 'text/plain' in (r.headers.get('content-type') or ''):summary['text']=text[:200]
          print('LOGIN_RESULT',json.dumps(summary,ensure_ascii=False))
          PY
