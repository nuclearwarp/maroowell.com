name: Clean selected SH label stack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-selected-sh-label-stack-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch selected SH labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [Path('public/coupang_camp_map'), Path('coupang_camp_map')]

          for path in paths:
              text = path.read_text(encoding='utf-8')

              old_merge = '''      function shouldMergeSelectedRelationRows(a, b) {
        if (overlapMarkerKey(a) === overlapMarkerKey(b)) return true;
        const distance = markerDistanceMeters(a, b);
        if (distance <= 4) return true;
        if (rowsShareSubHubRelation(a, b) && distance <= 18) return true;
        return false;
      }
'''
              new_merge = '''      function shouldMergeSelectedRelationRows(a, b) {
        if (overlapMarkerKey(a) === overlapMarkerKey(b)) return true;

        const aAddress = lower(a?.address).replace(/\\s+/g, " ");
        const bAddress = lower(b?.address).replace(/\\s+/g, " ");
        if (aAddress && bAddress && aAddress === bAddress) return true;

        const distance = markerDistanceMeters(a, b);
        if (distance <= 4) return true;

        // 같은 SUB_HUB 관계이고 실제 지도상 가까운 거점이면 한 묶음으로 표시한다.
        // DB 좌표와 주소 지오코딩 좌표 차이를 감안해 선택 화면에서만 300m까지 허용한다.
        if (rowsShareSubHubRelation(a, b) && distance <= 300) return true;
        return false;
      }
'''
              if old_merge in text:
                  text = text.replace(old_merge, new_merge, 1)
              elif new_merge not in text:
                  raise SystemExit(f'{path}: merge function anchor not found')

              old_image = '''      function makeForcedRelationLabelImage(row, offsetX = 0, offsetY = 0) {
        const metrics = markerVisualMetrics(row);
        const key = [
          "forced-relation",
          metrics.type,
          metrics.isMobile ? "mobile" : "base",
          ...metrics.lines,
          ...metrics.fontSizes,
          Math.round(offsetX),
          Math.round(offsetY)
        ].join("|");

        if (state.markerImages.has(key)) {
          return state.markerImages.get(key);
        }

        const labelWidth = metrics.width;
        const labelHeight = metrics.bubbleHeight + metrics.pointerHeight;
        const padding = 5;

        const minX = Math.min(0, offsetX - labelWidth / 2);
        const maxX = Math.max(0, offsetX + labelWidth / 2);
        const minY = Math.min(0, offsetY - labelHeight);
        const maxY = Math.max(0, offsetY);

        const imageWidth = Math.ceil(maxX - minX + padding * 2);
        const imageHeight = Math.ceil(maxY - minY + padding * 2);
        const anchorX = -minX + padding;
        const anchorY = -minY + padding;
        const labelLeft = anchorX + offsetX - labelWidth / 2;
        const labelTop = anchorY + offsetY - labelHeight;
        const bubbleColor = markerLabelBackground(metrics);
        const textColor = markerLabelColor(metrics);
        const borderColor = metrics.isMobile ? "#e0f2fe" : "#ffffff";
        const centerX = labelLeft + labelWidth / 2;
        const bubbleBottom = labelTop + metrics.bubbleHeight;

        const textSvg = metrics.lines.length > 1
          ? [
              `<text x="${centerX}" y="${labelTop + 12.5}" text-anchor="middle" dominant-baseline="middle"`,
              ` font-family="Arial, Noto Sans KR, sans-serif" font-size="${metrics.fontSizes[0]}" font-weight="900" fill="${textColor}">`,
              `${escapeSvgText(metrics.lines[0])}</text>`,
              `<text x="${centerX}" y="${labelTop + 29.2}" text-anchor="middle" dominant-baseline="middle"`,
              ` font-family="Arial, Noto Sans KR, sans-serif" font-size="${metrics.fontSizes[1]}" font-weight="800" fill="${textColor}">`,
              `${escapeSvgText(metrics.lines[1])}</text>`
            ].join("")
          : [
              `<text x="${centerX}" y="${labelTop + 1 + metrics.bubbleHeight / 2}" text-anchor="middle" dominant-baseline="middle"`,
              ` font-family="Arial, Noto Sans KR, sans-serif" font-size="${metrics.fontSizes[0]}" font-weight="900" fill="${textColor}">`,
              `${escapeSvgText(metrics.lines[0])}</text>`
            ].join("");

        const connectorSvg =
          Math.abs(offsetX) > 2 || Math.abs(offsetY) > 2
            ? `<line x1="${anchorX}" y1="${anchorY}" x2="${centerX}" y2="${labelTop + labelHeight}" stroke="${bubbleColor}" stroke-width="1.8" stroke-opacity=".72"/>`
            : "";

        const svg = [
          `<svg xmlns="http://www.w3.org/2000/svg" width="${imageWidth}" height="${imageHeight}" viewBox="0 0 ${imageWidth} ${imageHeight}" overflow="visible">`,
          '<defs>',
          '<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">',
          '<feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity=".28"/>',
          '</filter>',
          '</defs>',
          connectorSvg,
          '<g filter="url(#shadow)">',
          `<rect x="${labelLeft}" y="${labelTop}" width="${labelWidth}" height="${metrics.bubbleHeight}" rx="7" fill="${bubbleColor}" stroke="${borderColor}" stroke-width="1.2"/>`,
          `<path d="M${centerX - 4} ${bubbleBottom} L${centerX} ${labelTop + labelHeight} L${centerX + 4} ${bubbleBottom} Z" fill="${bubbleColor}" stroke="${borderColor}" stroke-width="1"/>`,
          '</g>',
          textSvg,
          '</svg>'
        ].join("");

        const image = new kakao.maps.MarkerImage(
          "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
          new kakao.maps.Size(imageWidth, imageHeight),
          { offset: new kakao.maps.Point(anchorX, anchorY) }
        );

        state.markerImages.set(key, image);
        return image;
      }
'''
              new_image = '''      function makeForcedRelationLabelImage(row, offsetX = 0, offsetY = 0) {
        const metrics = markerVisualMetrics(row);
        const key = [
          "forced-relation-flat",
          metrics.type,
          metrics.isMobile ? "mobile" : "base",
          ...metrics.lines,
          ...metrics.fontSizes,
          Math.round(offsetX),
          Math.round(offsetY)
        ].join("|");

        if (state.markerImages.has(key)) {
          return state.markerImages.get(key);
        }

        const labelWidth = metrics.width;
        const labelHeight = metrics.bubbleHeight;
        const padding = 4;

        const minX = Math.min(0, offsetX - labelWidth / 2);
        const maxX = Math.max(0, offsetX + labelWidth / 2);
        const minY = Math.min(0, offsetY - labelHeight);
        const maxY = Math.max(0, offsetY);

        const imageWidth = Math.ceil(maxX - minX + padding * 2);
        const imageHeight = Math.ceil(maxY - minY + padding * 2);
        const anchorX = -minX + padding;
        const anchorY = -minY + padding;
        const labelLeft = anchorX + offsetX - labelWidth / 2;
        const labelTop = anchorY + offsetY - labelHeight;
        const bubbleColor = markerLabelBackground(metrics);
        const textColor = markerLabelColor(metrics);
        const borderColor = metrics.isMobile ? "#e0f2fe" : "#ffffff";
        const centerX = labelLeft + labelWidth / 2;

        const textSvg = metrics.lines.length > 1
          ? [
              `<text x="${centerX}" y="${labelTop + 12.5}" text-anchor="middle" dominant-baseline="middle"`,
              ` font-family="Arial, Noto Sans KR, sans-serif" font-size="${metrics.fontSizes[0]}" font-weight="900" fill="${textColor}">`,
              `${escapeSvgText(metrics.lines[0])}</text>`,
              `<text x="${centerX}" y="${labelTop + 29.2}" text-anchor="middle" dominant-baseline="middle"`,
              ` font-family="Arial, Noto Sans KR, sans-serif" font-size="${metrics.fontSizes[1]}" font-weight="800" fill="${textColor}">`,
              `${escapeSvgText(metrics.lines[1])}</text>`
            ].join("")
          : [
              `<text x="${centerX}" y="${labelTop + 1 + metrics.bubbleHeight / 2}" text-anchor="middle" dominant-baseline="middle"`,
              ` font-family="Arial, Noto Sans KR, sans-serif" font-size="${metrics.fontSizes[0]}" font-weight="900" fill="${textColor}">`,
              `${escapeSvgText(metrics.lines[0])}</text>`
            ].join("");

        const svg = [
          `<svg xmlns="http://www.w3.org/2000/svg" width="${imageWidth}" height="${imageHeight}" viewBox="0 0 ${imageWidth} ${imageHeight}" overflow="visible">`,
          '<defs>',
          '<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">',
          '<feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity=".28"/>',
          '</filter>',
          '</defs>',
          '<g filter="url(#shadow)">',
          `<rect x="${labelLeft}" y="${labelTop}" width="${labelWidth}" height="${metrics.bubbleHeight}" rx="7" fill="${bubbleColor}" stroke="${borderColor}" stroke-width="1.2"/>`,
          '</g>',
          textSvg,
          '</svg>'
        ].join("");

        const image = new kakao.maps.MarkerImage(
          "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
          new kakao.maps.Size(imageWidth, imageHeight),
          { offset: new kakao.maps.Point(anchorX, anchorY) }
        );

        state.markerImages.set(key, image);
        return image;
      }
'''
              if old_image in text:
                  text = text.replace(old_image, new_image, 1)
              elif new_image not in text:
                  raise SystemExit(f'{path}: forced label image block not found')

              old_loop = '''          for (let index = group.items.length - 1; index >= 0; index--) {
            const item = group.items[index];
            const showPointer = index === group.items.length - 1;

            const marker = new kakao.maps.Marker({
'''
              new_loop = '''          for (let index = group.items.length - 1; index >= 0; index--) {
            const item = group.items[index];

            const marker = new kakao.maps.Marker({
'''
              text = text.replace(old_loop, new_loop, 1)

              old_height = '''            heightBelow +=
              item.metrics.bubbleHeight +
              (showPointer ? item.metrics.pointerHeight : 0);
'''
              new_height = '''            heightBelow += item.metrics.bubbleHeight;
'''
              if old_height in text:
                  text = text.replace(old_height, new_height, 1)
              elif new_height not in text:
                  raise SystemExit(f'{path}: selected stack height block not found')

              old_relation = '''      function renderRelationLines() {
        const unique = new Set();
'''
              new_relation = '''      function renderRelationLines() {
        // SUB_HUB를 선택한 상태에서는 관계 캠프 라벨을 한 묶음으로 보여주므로
        // 회색 연결선은 중복 정보가 되어 숨긴다.
        if (selectedSubHubId()) return;

        const unique = new Set();
'''
              if old_relation in text:
                  text = text.replace(old_relation, new_relation, 1)
              elif new_relation not in text:
                  raise SystemExit(f'{path}: relation lines anchor not found')

              path.write_text(text, encoding='utf-8')

              final = path.read_text(encoding='utf-8')
              checks = [
                  'if (aAddress && bAddress && aAddress === bAddress) return true;',
                  'rowsShareSubHubRelation(a, b) && distance <= 300',
                  '"forced-relation-flat"',
                  'const labelHeight = metrics.bubbleHeight;',
                  'heightBelow += item.metrics.bubbleHeight;',
                  'if (selectedSubHubId()) return;',
              ]
              for check in checks:
                  if check not in final:
                      raise SystemExit(f'{path}: missing validation: {check}')

          PY

          git diff --check
          git diff -- public/coupang_camp_map coupang_camp_map

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupang_camp_map coupang_camp_map
          git commit -m "Tighten selected subhub label stacks"
          git pull --rebase origin main
          git push origin main
