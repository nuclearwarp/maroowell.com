name: Temp copy schedule source
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy source
        run: cp public/maroowell_schedule maroowell_schedule_original.txt
      - uses: actions/upload-artifact@v4
        with:
          name: maroowell_schedule_original
          path: maroowell_schedule_original.txt
          retention-days: 1
