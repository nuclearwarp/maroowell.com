name: Deploy tested AWS terrain fallback

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test fallback then deploy live worker
        shell: bash
        run: python3 .diagnostics/deploy_terrain_aws_fallback.py
