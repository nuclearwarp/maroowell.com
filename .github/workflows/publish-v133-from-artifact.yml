name: Publish Maroowell Android v1.3.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v133-from-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v1.3.3 release artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-7eb4-81fb-81c9-eeb4b57c6e01/raw?se=2026-08-31T07%3A47%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=99591446-8690-5ff7-a1ec-f9f78e6da9ec&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T01%3A23%3A10Z&ske=2026-09-01T01%3A23%3A10Z&sks=b&skv=2026-02-06&sig=0R7Eh%2BOmAwm7QobJREkpx/LyhhWElBNnnj%2BdnVuTSzY%3D'
          curl -fL --retry 3 --retry-all-errors "$URL" -o /tmp/v133.zip
          rm -rf /tmp/v133
          mkdir -p /tmp/v133
          unzip -q /tmp/v133.zip -d /tmp/v133
          test -f /tmp/v133/Maroowell-1.3.3.apk
          test -f /tmp/v133/maroowell-latest.apk
          EXPECTED_SHA='5c57e22b0569b0ab23d5d085827a5d2ef9e2c7397296bad11aa95823ef340a4f'
          for APK in /tmp/v133/Maroowell-1.3.3.apk /tmp/v133/maroowell-latest.apk; do
            test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
          done

      - name: Install APK and v1.3.3 metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/v133/Maroowell-1.3.3.apk public/apk/Maroowell-1.3.3.apk
          cp /tmp/v133/maroowell-latest.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 36,
            "versionName": "1.3.3",
            "updatedAt": "2026-08-31",
            "fileName": "Maroowell-1.3.3.apk",
            "downloadUrl": "https://maroowell.com/apk/Maroowell-1.3.3.apk",
            "changes": [
              "META 실시간 배송 현황의 야간 출근일 기준 수정",
              "야간 20:00~23:59에는 당일 출근부를 조회",
              "야간 00:00~07:59에는 전일 출근부를 조회",
              "08:00 이후 야간 조회는 다시 당일 기준으로 적용"
            ]
          }
          JSON
          cp public/app_version.json app_version.json

      - name: Commit public v1.3.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apk/Maroowell-1.3.3.apk public/apk/maroowell-latest.apk public/app_version.json app_version.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'v1.3.3 is already published'
            exit 0
          fi
          git commit -m 'Publish Maroowell Android v1.3.3'
          git push origin HEAD:main

# trigger publisher
