name: Deploy live route worker v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-live-route-worker-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secured route source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          grep -q 'MW_ROUTE_WRITE_AUTH_V1' worker.js
          grep -q 'requireRouteWriteAccess(request, env)' worker.js
          grep -q 'ROUTE_WRITE_MIN_LEVEL = 60' worker.js

      - name: Build live worker config
        shell: bash
        run: |
          cat > wrangler.route-live.toml <<'EOF'
          name = "purple-river-0717"
          main = "worker.js"
          compatibility_date = "2024-01-01"
          account_id = "0f644373a9db40f2b36e4ffece348c46"
          keep_vars = true
          EOF

      - name: Deploy to live route worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config wrangler.route-live.toml

      - name: Verify live worker bindings preserved
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 0f644373a9db40f2b36e4ffece348c46
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          json=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/services/purple-river-0717/environments/production/settings")
          echo "$json" | jq '{success, bindings: [.result.bindings[]? | {name,type}]}'
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            echo "$json" | jq -e --arg n "$name" '.result.bindings | any(.name == $n)' >/dev/null
          done

      - name: Verify secured live script directly
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://purple-river-0717.brain-0f6.workers.dev'
          health=$(curl -sS -o /tmp/health.txt -w '%{http_code}' "$BASE/health")
          cat /tmp/health.txt
          test "$health" = '200'
          route_code=$(curl -sS -o /tmp/route.txt -w '%{http_code}' -X POST "$BASE/route" -H 'Content-Type: application/json' --data '{"camp":"__security_probe__","code":"__probe__","polygon_wgs84":[]}')
          cat /tmp/route.txt
          test "$route_code" = '401'
          bad_code=$(curl -sS -o /tmp/bad.txt -w '%{http_code}' -X POST "$BASE/vendors" -H 'Content-Type: application/json' -H 'Authorization: Bearer invalid-security-probe' --data '{"name":"__security_probe__","business_number":"0000000000"}')
          cat /tmp/bad.txt
          test "$bad_code" = '401'
          ! grep -q 'Missing ENV' /tmp/bad.txt
          echo 'PASS: live route worker has auth hardening and Supabase bindings.'

      - name: Probe custom domain without mutating data
        shell: bash
        run: |
          set -euo pipefail
          for ua in \
            'Maroowell-Android/1.4.6' \
            'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/152 Mobile Safari/537.36'; do
            echo "=== UA: $ua ==="
            code=$(curl -sS -o /tmp/custom.txt -D /tmp/custom.h -w '%{http_code}' -A "$ua" https://route.maroowell.com/health || true)
            echo "HTTP $code"
            grep -iE '^(server:|cf-mitigated:|cf-ray:|content-type:)' /tmp/custom.h || true
            head -c 250 /tmp/custom.txt || true
            echo
          done
