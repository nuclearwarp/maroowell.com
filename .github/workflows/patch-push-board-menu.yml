name: Patch PUSH board menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-push-board-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add PUSH menu entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('public/board-menu.js')
          s=p.read_text(encoding='utf-8')
          old='    { key:"mw-schedule", label:"마루웰 입차 스케줄", path:"/maroowell_schedule", aliases:["/maroowell_schedule","/maroowell_schedule.html"], requireRoleLevel:30, desc:"마루웰 입차 스케줄" },\n'
          new=old+'    { key:"mw-push", label:"PUSH 알림", path:"/maroowell_push", aliases:["/maroowell_push","/maroowell_push.html"], requireRoleLevel:30, desc:"긴급 PUSH / 팀 공지 발송" },\n'
          if 'key:"mw-push"' not in s:
              if old not in s:
                  raise SystemExit('menu anchor not found')
              s=s.replace(old,new,1)
          s=s.replace('const BUILD = "20260822-auth-guard-v3";','const BUILD = "20260823-push-board-v1";',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/board-menu.js
          if git diff --cached --quiet; then
            echo 'Already patched'
            exit 0
          fi
          git commit -m 'Add PUSH alert board to menu'
          git push origin HEAD:main
