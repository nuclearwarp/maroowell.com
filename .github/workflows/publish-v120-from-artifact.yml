name: Publish Maroowell Android v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v120-from-artifact.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified signed APK artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_URL='https://sdmntprjapaneast.oaiusercontent.com/files/00000000-be2c-8209-b5ca-cd4eb31453a4/raw?se=2026-08-24T14%3A08%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=5178277a-008b-5be3-86e7-5837186cb3a1&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T01%3A00%3A51Z&ske=2026-08-25T01%3A00%3A51Z&sks=b&skv=2026-02-06&sig=CKgzk/2BbaZr/gOxQ/SGejU5zFL6LJ%2BV59fwzXQMOt0%3D'
          curl -fL --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/maroowell-v120.zip
          rm -rf /tmp/maroowell-v120
          mkdir -p /tmp/maroowell-v120
          unzip -q /tmp/maroowell-v120.zip -d /tmp/maroowell-v120
          test -f /tmp/maroowell-v120/Maroowell-1.2.0.apk
          test "$(stat -c%s /tmp/maroowell-v120/Maroowell-1.2.0.apk)" = "9335763"
          echo '011d07932843682dd05adc034454da45ea6e23b15a406c9dd2a95574a307e42d  /tmp/maroowell-v120/Maroowell-1.2.0.apk' | sha256sum -c -

      - name: Publish APK and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/maroowell-v120/Maroowell-1.2.0.apk public/apk/Maroowell-1.2.0.apk
          cp /tmp/maroowell-v120/Maroowell-1.2.0.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 23,
            "versionName": "1.2.0",
            "updatedAt": "2026-08-24",
            "fileName": "Maroowell-1.2.0.apk",
            "downloadUrl": "https://raw.githubusercontent.com/nuclearwarp/maroowell.com/main/public/apk/Maroowell-1.2.0.apk",
            "changes": [
              "마루웰 라우트정보 검색 동작 및 세션 재시도 보강",
              "마루웰 라우트 단가의 원청단가 조회 보강",
              "계정 관리 검색 결과에 계정 삭제 기능 추가",
              "앱 장기 백그라운드 후 세션 만료 시 자동 로그아웃 처리",
              "마루웰 앱 버전을 1.2.0으로 업데이트"
            ]
          }
          JSON
          rm -f .github/workflows/publish-v120-from-artifact.yml

      - name: Commit published APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/apk public/app_version.json .github/workflows/publish-v120-from-artifact.yml
          git commit -m 'Publish Maroowell Android v1.2.0'
          git pull --rebase origin main
          git push origin HEAD:main
