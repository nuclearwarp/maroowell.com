name: Deploy APK download worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/apk-download/**'
      - '.github/workflows/deploy-apk-download-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-apk-download-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure APK KV namespace exists
        id: kv
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f644373a9db40f2b36e4ffece348c46
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          LIST=$(mktemp)
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -o "$LIST"
          KV_ID=$(python3 - "$LIST" <<'PY'
          import json, sys
          body=json.load(open(sys.argv[1], encoding='utf-8'))
          for item in body.get('result') or []:
              if item.get('title') == 'maroowell-app-downloads':
                  print(item.get('id',''), end='')
                  break
          PY
          )
          if [ -z "$KV_ID" ]; then
            CREATE=$(mktemp)
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"title":"maroowell-app-downloads"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -o "$CREATE"
            KV_ID=$(python3 - "$CREATE" <<'PY'
          import json, sys
          body=json.load(open(sys.argv[1], encoding='utf-8'))
          if body.get('success') is not True:
              raise SystemExit(body)
          print((body.get('result') or {}).get('id',''), end='')
          PY
            )
          fi
          test -n "$KV_ID"
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_ID: ${{ steps.kv.outputs.kv_id }}
        run: |
          set -euo pipefail
          cat > wrangler-apk.toml <<TOML
          name = "maroowell-app-download"
          main = "workers/apk-download/index.js"
          account_id = "0f644373a9db40f2b36e4ffece348c46"
          compatibility_date = "2026-08-22"
          workers_dev = true
          routes = [
            { pattern = "maroowell.com/downloads/*", zone_name = "maroowell.com" },
            { pattern = "maroowell.com/upload/*", zone_name = "maroowell.com" }
          ]

          [[kv_namespaces]]
          binding = "APK_STORE"
          id = "$KV_ID"
          TOML
          npx wrangler@4 deploy --config wrangler-apk.toml

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 3 https://maroowell-app-download.brain-0f6.workers.dev/health | tee health.json
          python3 - <<'PY'
          import json
          body=json.load(open('health.json', encoding='utf-8'))
          assert body.get('ok') is True
          PY

      - name: Record deployment success
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostics
          printf 'status=ok\ncommit=%s\nchecked_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .diagnostics/apk-worker-deploy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/apk-worker-deploy.txt
          git commit -m 'Record APK worker deployment' || exit 0
          git pull --rebase origin main
          git push origin main
