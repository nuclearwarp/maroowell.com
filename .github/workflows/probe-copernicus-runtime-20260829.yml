name: Probe Copernicus runtime auth 20260829

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/probe-copernicus-runtime-20260829.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test AWS terrain fallback and deploy live worker
        shell: bash
        run: python3 .diagnostics/deploy_terrain_aws_fallback.py
