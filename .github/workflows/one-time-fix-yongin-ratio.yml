name: One-time Yongin ratio source fix

on:
  push:
    paths:
      - .github/workflows/one-time-fix-yongin-ratio.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update source and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/maroowell_freshbag_ratio')
          text = path.read_text(encoding='utf-8')

          old_option = '<option value="용인3">용인3 - 주간</option>'
          new_option = '<option value="용인1">용인1 - 주간</option>'
          old_map = '    "용인3":"W2",'
          new_map = '    "용인1":"W2",'

          if old_option not in text:
              raise SystemExit('camp option target not found')
          if old_map not in text:
              raise SystemExit('camp wave map target not found')

          text = text.replace(old_option, new_option, 1)
          text = text.replace(old_map, new_map, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/one-time-fix-yongin-ratio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maroowell_freshbag_ratio .github/workflows/one-time-fix-yongin-ratio.yml
          git commit -m "Replace Yongin3 with Yongin1 in freshbag ratio source"
          git push
