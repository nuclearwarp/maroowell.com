name: Diagnose route domain v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-route-domain-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect DNS and HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DNS ==='
          getent ahosts route.maroowell.com || true
          echo
          echo '=== route.maroowell.com /health ==='
          curl -sS -D /tmp/custom.headers -o /tmp/custom.body --max-time 20 https://route.maroowell.com/health || true
          sed -n '1,40p' /tmp/custom.headers || true
          echo '-- body --'
          head -c 1500 /tmp/custom.body || true
          echo
          echo
          echo '=== direct worker /health ==='
          curl -sS -D /tmp/direct.headers -o /tmp/direct.body --max-time 20 https://route-api.brain-0f6.workers.dev/health || true
          sed -n '1,40p' /tmp/direct.headers || true
          echo '-- body --'
          head -c 1500 /tmp/direct.body || true
          echo

      - name: Inspect Cloudflare worker mappings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 0f644373a9db40f2b36e4ffece348c46
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json')

          echo '=== Worker custom domains ==='
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains" \
            | jq '{success, errors, result: [.result[]? | {id, hostname, service, environment, zone_id}]}'

          echo
          echo '=== Worker services ==='
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/services" \
            | jq '{success, errors, result: [.result[]? | {id, default_environment, created_on, modified_on}]}'

          echo
          echo '=== route-api environments ==='
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/services/route-api/environments" \
            | jq '{success, errors, result: [.result[]? | {environment, script, created_on, modified_on}]}' || true

          echo
          echo '=== Zone lookup ==='
          zone_json=$(curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=maroowell.com')
          echo "$zone_json" | jq '{success, errors, result: [.result[]? | {id, name, status}]}'
          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')
          if [ -n "$zone_id" ]; then
            echo
            echo '=== Worker routes for maroowell.com ==='
            curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" \
              | jq '{success, errors, result: [.result[]? | {id, pattern, script}]}'
          fi

      - name: Inspect route-api binding names only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 0f644373a9db40f2b36e4ffece348c46
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          for envname in production ''; do
            if [ -n "$envname" ]; then
              url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/services/route-api/environments/$envname/settings"
              label="$envname"
            else
              url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/services/route-api/environments/production/settings"
              label='production(recheck)'
            fi
            echo "=== settings: $label ==="
            curl -sS "${auth[@]}" "$url" \
              | jq '{success, errors, bindings: [.result.bindings[]? | {name, type, namespace_id, service, environment}]}' || true
          done
