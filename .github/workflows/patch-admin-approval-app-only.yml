    const state = await webAccountState();
    let message = "";
    if (state.approval_status === "pending") message = "가입 승인 대기 중입니다. 관리자 승인 후 이용할 수 있습니다.";
    else if (state.approval_status === "rejected") message = "가입 승인이 거절된 계정입니다. 관리자에게 문의해주세요.";
