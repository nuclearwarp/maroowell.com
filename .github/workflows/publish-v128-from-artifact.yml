name: Publish Maroowell Android v1.2.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v128-from-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download v1.2.8 release artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a294-8211-ab99-7f9b9dcc56de/raw?se=2026-08-30T09%3A37%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=9c9d4fd3-e943-5fe4-b5c0-491012626e25&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T18%3A52%3A49Z&ske=2026-08-30T18%3A52%3A49Z&sks=b&skv=2026-02-06&sig=Zslry4XChinybFuiTldNxH0QvmSqdoisukuOF%2B0b7cQ%3D'
          curl -fL --retry 3 --retry-all-errors "$URL" -o /tmp/v128.zip
          rm -rf /tmp/v128
          mkdir -p /tmp/v128
          unzip -q /tmp/v128.zip -d /tmp/v128
          test -f /tmp/v128/Maroowell-1.2.8.apk
          test -f /tmp/v128/maroowell-latest.apk
          EXPECTED_SHA='454d12ad2b88bd9b9a1247e4ca3909df29b17c5323d7ff5e3b1d4b0ee7157f1f'
          for APK in /tmp/v128/Maroowell-1.2.8.apk /tmp/v128/maroowell-latest.apk; do
            test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
          done

      - name: Install APK into public download path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/v128/Maroowell-1.2.8.apk public/apk/Maroowell-1.2.8.apk
          cp /tmp/v128/maroowell-latest.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 31,
            "versionName": "1.2.8",
            "updatedAt": "2026-08-30",
            "fileName": "Maroowell-1.2.8.apk",
            "downloadUrl": "https://maroowell.com/apk/Maroowell-1.2.8.apk",
            "changes": [
              "개인정보처리방침을 웹뷰가 아닌 앱 내부 네이티브 화면으로 변경",
              "로그인 화면의 권한·도구 안내 문구 제거 및 개인정보처리방침 URL 노출 제거",
              "라우트 편집 메뉴명을 라우트 편집기로 변경",
              "마루웰 라우트 단가에서 모든 캠프를 캠프명 - 라우트 형식으로 표시",
              "라우트 단가 금액을 소수점 없이 원 단위로 표시",
              "용차 및 용차 스케줄을 네이티브 앱 화면으로 제공"
            ]
          }
          JSON
          cp public/app_version.json app_version.json

      - name: Commit public v1.2.8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apk/Maroowell-1.2.8.apk public/apk/maroowell-latest.apk public/app_version.json app_version.json
          git diff --cached --check
          git commit -m 'Publish Maroowell Android v1.2.8'
          git push origin HEAD:main
