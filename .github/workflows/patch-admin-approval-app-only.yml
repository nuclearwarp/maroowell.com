          p=Path('public/admin_access.html');s=p.read_text()
          insert='''
    <div class="card">
      <div class="sectionTitle">가입 승인 / 계정 검색</div>
      <div class="row">
        <button id="copySignupLinkBtn" class="ok">회원가입 링크 복사</button>
