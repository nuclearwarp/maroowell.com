<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벤더 관리 | MAROOWELL</title><link rel="icon" href="/favicon.ico?v=2"><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--blue:#2563eb;--navy:#17364a;--line:#dce5ed;--bg:#f5f7fb;--muted:#687b89}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px "Noto Sans KR",system-ui,sans-serif;color:#172b36}button,input,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);z-index:5;padding:14px 22px;display:flex;align-items:center;gap:14px}header img{width:36px;height:36px}h1{font-size:22px;margin:0}main{padding:18px 20px;max-width:1800px;margin:auto}.sub{font-size:13px;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #17364a08}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:210px}input,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5df;border-radius:10px;background:#fff}textarea{min-height:90px;resize:vertical}button{padding:10px 16px;border:1px solid #cbd5df;border-radius:10px;background:white;color:var(--navy);font-weight:700}.primary{background:var(--navy);border-color:var(--navy);color:white}.danger{color:#b91c1c}.muted{color:var(--muted)}.tablewrap{width:100%;overflow:auto}table{border-collapse:collapse;width:100%;min-width:1320px;font-size:13px}th,td{border-bottom:1px solid #edf0f5;padding:12px 10px;text-align:left;white-space:nowrap}th{background:#f6f9fc;color:#536777;position:sticky;top:0}td.memo{white-space:normal;min-width:180px;max-width:260px;overflow-wrap:anywhere}td button{padding:6px 11px}dialog{border:none;border-radius:18px;padding:0;width:min(750px,calc(100vw - 24px));max-height:92vh;box-shadow:0 18px 70px #0f172a55}dialog::backdrop{background:#0f172a88}.dialoghead{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:20px 22px;overflow:auto;max-height:70vh}.fields label{font-size:13px;font-weight:700;display:grid;gap:6px}.wide{grid-column:1/-1}.foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.status{min-height:22px;color:#536777}.red{color:#b91c1c}@media(max-width:620px){main{padding:10px}.fields{grid-template-columns:1fr}.wide{grid-column:1}h1{font-size:19px}header{padding:10px}}
/* Match the existing Maroowell administrator pages rather than a full-width plain toolbar. */
html,body{background:linear-gradient(180deg,#fff 0%,#f6f8fc 100%);font-weight:700}
.mw-topbar{top:8px;max-width:1440px;margin:8px auto 0;padding:10px 13px;border:1px solid #d8e0ee;border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 10px 28px rgba(15,23,42,.055);position:sticky}
.mw-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#0f172a;border-radius:12px;padding:3px 6px;min-width:0}
.mw-brand:hover{background:#eff6ff}
.mw-brand img{width:43px;height:43px;object-fit:contain}
.mw-brandtext h1{font-size:21px;font-weight:900;letter-spacing:-.04em}
.mw-brandtext p{font-size:11px;color:#64748b;margin:4px 0 0}
.mw-menuchip{font-size:11px;padding:6px 10px;border:1px solid #bfdbfe;color:#2563eb;background:#eff6ff;border-radius:100px}
.mw-grow{flex:1}
.mw-logout{border:1px solid #fecdd3;color:#b91c1c;background:#fff1f2}
.mw-logout:hover{background:#ffe4e6}
.mw-home{border:1px solid #d8e0ee;background:#fff}
main{max-width:1440px;margin:0 auto;padding:18px 0 42px}
.card{border-color:#d8e0ee;border-radius:17px;box-shadow:0 10px 28px rgba(15,23,42,.055)}
dialog{border-radius:18px}
#editor .dialoghead{background:linear-gradient(180deg,#fff,#fbfdff)}
@media(max-width:1460px){main{padding:16px 14px 42px}.mw-topbar{margin:8px 10px 0}}
@media(max-width:650px){.mw-brandtext p{display:none}.mw-menuchip{display:none}.mw-topbar{gap:6px}.mw-topbar button{padding:8px 10px}.mw-brandtext h1{font-size:17px}.mw-brand img{width:36px;height:36px}}
/* Full-width vendor workspace, independent vertical table scrolling and fixed headers. */
:root{--vendor-page-gutter:clamp(10px,1.1vw,24px)}
.mw-topbar{width:calc(100% - 2 * var(--vendor-page-gutter));max-width:none;margin:8px var(--vendor-page-gutter) 0}
main{width:100%;max-width:none;margin:0;padding:14px var(--vendor-page-gutter) 24px}
main>.card{width:100%;min-width:0;padding:14px 16px}
.tablewrap{width:100%;height:clamp(400px,calc(100dvh - 336px),1200px);overflow-x:auto;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border:1px solid #e4eaf2;border-radius:11px}
.tablewrap table{width:100%;min-width:1570px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tablewrap th,.tablewrap td{height:53px;padding:10px 9px;border-bottom:1px solid #e9eef5;text-align:left;vertical-align:middle;white-space:normal;line-height:1.45}
.tablewrap thead th{position:sticky;top:0;z-index:4;height:46px;background:#f2f6fb;color:#4c6075;font-weight:800;white-space:nowrap;box-shadow:0 1px 0 #dfe6ef}
.tablewrap tbody td{background:#fff}
.tablewrap tbody tr:hover td{background:#f7faff}
.tablewrap th:first-child,.tablewrap td:first-child{position:sticky;left:0;z-index:3;background:#fff;box-shadow:1px 0 0 #e4eaf2}
.tablewrap thead th:first-child{z-index:7;background:#f2f6fb}
.tablewrap th:last-child,.tablewrap td:last-child{position:sticky;right:0;z-index:3;background:#fff;box-shadow:-1px 0 0 #e4eaf2;text-align:center}
.tablewrap thead th:last-child{z-index:7;background:#f2f6fb}
.tablewrap tbody tr:hover td:first-child,.tablewrap tbody tr:hover td:last-child{background:#f7faff}
.tablewrap thead th:nth-child(1){width:17%}
.tablewrap thead th:nth-child(2){width:9%}
.tablewrap thead th:nth-child(3){width:10%}
.tablewrap thead th:nth-child(4){width:8%}
.tablewrap thead th:nth-child(5){width:6.5%}
.tablewrap thead th:nth-child(6){width:6.5%}
.tablewrap thead th:nth-child(7){width:7%}
.tablewrap thead th:nth-child(8){width:11%}
.tablewrap thead th:nth-child(9){width:12%}
.tablewrap thead th:nth-child(10){width:9%}
.tablewrap thead th:nth-child(11){width:4%}
.tablewrap .cell-value{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tablewrap .cell-value.cell-multiline{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.tablewrap td button{display:inline-flex;align-items:center;justify-content:center;min-width:50px;padding:7px 9px;border-color:#bfcede;font-size:12px}
@media(max-width:850px){.tablewrap{height:clamp(350px,calc(100dvh - 340px),900px)}main>.card{padding:12px}.tablewrap table{min-width:1550px}}
</style></head><body>
<header class="mw-topbar"><a href="#" id="mwBoardMenuToggle" class="mw-brand" title="마루웰 메뉴 열기"><img src="/favicon.ico?v=2" alt="MW"><div class="mw-brandtext"><h1>벤더 관리</h1><p>업체 기본정보 · 담당자 · 업태/업종 · 주소 · 메모</p></div><span class="mw-menuchip">메뉴</span></a><div class="mw-grow"></div><button id="back" class="mw-home">Home</button><button id="logout" class="mw-logout">로그아웃</button></header>
<main><section class="card toolbar"><input id="search" placeholder="상호명 / 별칭 / 사업자번호 검색"><button id="refresh">조회</button><button id="add" class="primary">+ 벤더 추가</button><span id="count" class="sub"></span></section><section class="card"><div id="status" class="status">로그인 및 권한 확인 중...</div><div class="tablewrap"><table><thead><tr><th>상호명 (가나다순)</th><th>별칭</th><th>사업자번호</th><th>벤더 대표</th><th>업태</th><th>업종</th><th>대표자</th><th>메일주소</th><th>회사주소</th><th>메모</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<dialog id="editor"><form id="form"><div class="dialoghead"><strong id="dialogTitle">벤더 추가</strong><button type="button" id="close">닫기</button></div><div class="fields">
<label>상호명 *<input name="name" required maxlength="180"></label><label>별칭<input name="nickname" maxlength="180"></label>
<label>사업자번호 *<input name="business_number" required placeholder="000-00-00000" maxlength="12"></label>
<label>벤더 대표 (담당자)<input name="vendor_contact" maxlength="180"></label><label>대표자 (사업자등록상)<input name="representative_name" maxlength="180"></label>
<label>업태<input name="business_type" maxlength="180"></label><label>업종<input name="business_category" maxlength="180"></label>
<label>메일주소<input name="email" type="email" maxlength="254"></label><label>회사주소<input name="company_address" maxlength="500"></label>
<label class="wide">메모<textarea name="memo" maxlength="5000"></textarea></label>
</div><div class="foot"><span id="saveState" class="sub" style="margin-right:auto"></span><button type="button" id="cancel">취소</button><button class="primary" id="save" type="submit">저장</button></div></form></dialog>
<script>
(()=>{"use strict";
const cfg=window.MARUWELL_CONFIG||{}, fields=["name","nickname","business_number","vendor_contact","representative_name","business_type","business_category","email","company_address","memo"];
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sb,rows=[],editId=null,loading=false;
const status=(m,bad=false)=>{ $("status").textContent=m;$("status").classList.toggle("red",bad);};
async function api(path,opt={}){const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data?.session?.access_token)throw Error("로그인 세션이 필요합니다.");const res=await fetch("https://route.maroowell.com/vendors/admin"+path,{...opt,headers:{"Authorization":"Bearer "+data.session.access_token,"Content-Type":"application/json",...opt.headers},cache:"no-store"});const json=await res.json().catch(()=>({}));if(!res.ok)throw Error(json.error||"HTTP "+res.status);return json;}
function render(){const q=$("search").value.toLowerCase().trim(),selected=rows.filter(v=>!q||["name","nickname","business_number"].some(k=>String(v[k]||"").toLowerCase().includes(q)));$("count").textContent="전체 "+rows.length+"개 / 표시 "+selected.length+"개";$("rows").innerHTML=selected.map(v=>'<tr>'+["name","nickname","business_number","vendor_contact","business_type","business_category","representative_name","email","company_address","memo"].map(k=>'<td class="'+(k==="memo"?"memo":"")+'"><span class="cell-value'+((k==="memo"||k==="company_address")?" cell-multiline":"")+'" title="'+esc(v[k]||"-")+'">'+esc(v[k]||"-")+'</span></td>').join("")+'<td><button data-edit="'+esc(v.id)+'">수정</button></td></tr>').join("")||'<tr><td colspan="11" class="muted">조회된 벤더가 없습니다.</td></tr>';}
async function load(){if(loading)return;loading=true;$("refresh").disabled=true;status("벤더를 불러오는 중...");try{const out=await api("?limit=1000");rows=(out.rows||[]).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ko-KR",{sensitivity:"base",numeric:true})||String(a.nickname||"").localeCompare(String(b.nickname||""),"ko-KR"));render();status("벤더 정보 "+rows.length+"건 조회 완료 · 상호 가나다순");}catch(e){status("조회 실패: "+e.message,true);}finally{loading=false;$("refresh").disabled=false;}}
function open(id){editId=id||null;$("form").reset();$("saveState").textContent="";$("dialogTitle").textContent=editId?"벤더 수정":"벤더 추가";if(editId){const v=rows.find(x=>x.id===editId);if(!v)return;for(const k of fields){if($("form").elements[k])$("form").elements[k].value=v[k]??""}}$("editor").showModal();}
async function save(e){e.preventDefault();const submit=$("save");submit.disabled=true;$("saveState").textContent="저장 중...";try{const o={};for(const k of fields)o[k]=String($("form").elements[k]?.value||"").trim();if(!o.name)throw Error("상호명은 필수입니다.");if(o.business_number.replace(/\D/g,"").length!==10)throw Error("사업자번호는 숫자 10자리입니다.");if(editId){const original=rows.find(v=>v.id===editId);if(original){for(const k of ["name","nickname","business_number"]){if(o[k]===String(original[k]??"").trim())delete o[k];}}}await api(editId?"/"+encodeURIComponent(editId):"",{method:editId?"PATCH":"POST",body:JSON.stringify(o)});$("editor").close();await load();}catch(err){$("saveState").textContent=err.message;}finally{submit.disabled=false;}}
async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){status("Supabase 연결 설정 오류",true);return;}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{storage:sessionStorage,persistSession:true,autoRefreshToken:true}});try{await load();}catch(e){status(e.message,true)}}
$("refresh").onclick=load;$("search").oninput=render;$("add").onclick=()=>open(null);$("rows").onclick=e=>{const b=e.target.closest("[data-edit]");if(b)open(b.dataset.edit)};$("form").onsubmit=save;$("close").onclick=$("cancel").onclick=()=>$("editor").close();$("back").onclick=()=>location.assign("/home");$("logout").onclick=async()=>{await sb?.auth.signOut();location.assign("/")};init();
})();
</script><script>window.MW_BOARD_MENU_MODE="admin"</script><script src="/board-menu.js?v=20261010-vendors1"></script></body></html>
