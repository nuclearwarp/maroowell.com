name: Finalize Maroowell Android test download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-maroowell-app-download-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workers.dev APK
        shell: bash
        run: |
          set -euxo pipefail
          curl -fLI --retry 5 --retry-delay 2 https://maroowell-app-download.brain-0f6.workers.dev/downloads/maroowell-latest.apk

      - name: Point download page at direct public APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          for file_name in ('app', 'public/app'):
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              if 'if(exists){' not in text:
                  raise SystemExit(f'HEAD check anchor missing in {file_name}')
              text = text.replace('if(exists){', 'if(true){', 1)
              path.write_text(text, encoding='utf-8')

          data = {
              'versionCode': 2,
              'versionName': '1.0.1-test',
              'updatedAt': '2026-08-17',
              'downloadUrl': 'https://maroowell-app-download.brain-0f6.workers.dev/downloads/maroowell-latest.apk',
              'changes': [
                  '운수종사자 일상점검 입력칸 겹침 수정 및 예시값 정리',
                  '일상점검은 O/X만 직접 입력',
                  'PDF 생성 시 오늘 이전 미입력 일자를 미운행으로 일괄 확인',
                  '앱 홈의 환영 문구를 누르면 로그아웃',
              ],
          }
          payload = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          Path('app_version.json').write_text(payload, encoding='utf-8')
          Path('public/app_version.json').write_text(payload, encoding='utf-8')
          PY
          git diff --check

      - name: Commit final public download configuration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app public/app app_version.json public/app_version.json
          if [ -f .github/workflows/verify-maroowell-test-apk-temp.yml ]; then
            git rm .github/workflows/verify-maroowell-test-apk-temp.yml
          fi
          git rm .github/workflows/finalize-maroowell-app-download-temp.yml
          git commit -m "Enable direct signed APK download"
          git push origin main
