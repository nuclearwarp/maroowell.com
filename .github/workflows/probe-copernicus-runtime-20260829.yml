name: Probe Copernicus runtime auth 20260829

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/probe-copernicus-runtime-20260829.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify live terrain patch only
        shell: bash
        run: python3 .diagnostics/check_live_terrain_patch.py
