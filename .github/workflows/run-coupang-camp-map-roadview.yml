name: Run coupang camp map roadview patch

on:
  push:
    paths:
      - '.github/scripts/patch_coupang_camp_map_roadview.py'
      - '.github/workflows/run-coupang-camp-map-roadview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_coupang_camp_map_roadview.py
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupang_camp_map
          git commit -m "Add roadview overlay to coupang camp map"
          git push
