name: Test building job monitor
on:
  pull_request:
    paths:
      - 'public/coupangRouteMap.html'
      - 'public/building-job-monitor.js'
      - '.diagnostics/test_building_job_monitor.cjs'
      - '.github/workflows/test-building-job-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'public/coupangRouteMap.html'
      - 'public/building-job-monitor.js'
      - '.diagnostics/test_building_job_monitor.cjs'
      - '.github/workflows/test-building-job-monitor.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check module syntax
        run: node --check public/building-job-monitor.js
      - name: Run offline regression tests
        run: node --test .diagnostics/test_building_job_monitor.cjs
