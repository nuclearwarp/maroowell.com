    run(() => setAccountState(btn.dataset.userId, btn.dataset.pendingAction === "approve" ? "approved" : "rejected", "pending"));
  };
  $("accountSearchList").onclick = event => {
    const pick = event.target.closest("[data-account-pick]");
    if (pick) { setTarget(pick.dataset.name || "", pick.dataset.email || ""); return; }
    const btn = event.target.closest("[data-account-state]");
    if (btn) run(() => setAccountState(btn.dataset.userId, btn.dataset.accountState, "search"));
  };

