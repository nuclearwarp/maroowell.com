keep_vars = true

routes = [
  { pattern = "maroowell.com/maroowell_schedule*", zone_name = "maroowell.com" },
  { pattern = "maroowell.com/config.js", zone_name = "maroowell.com" },
  { pattern = "maroowell.com/board-menu.js", zone_name = "maroowell.com" }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
