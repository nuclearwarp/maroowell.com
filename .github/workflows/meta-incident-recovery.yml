name: Recover Maroowell META session and mobile login
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/meta-incident-recovery.yml']
permissions:
  contents: write
concurrency:
  group: maroowell-meta-incident-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted tested recovery patch
        run: python3 tools/apply-meta-recovery.py .
      - name: Validate source and regression cases
        run: |
          node --check workers/meta-collector/entry.js
          node --check workers/meta-collector/auth-v12-base.js
          node --check public/meta-connection.js
          node --check login-worker-v2.js
          node tools/meta-recovery.test.cjs .
          git diff --check
      - name: Commit only reviewed incident changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/meta-collector/entry.js workers/meta-collector/auth-v12-base.js public/home public/realtime login-worker-v2.js
          if ! git diff --cached --quiet; then
            git commit -m 'Fix META session failure state and mobile re-login recovery'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
      - name: Deploy corrected Maroowell collector
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config workers/meta-collector/wrangler.toml --keep-vars
      - name: Deploy Home and realtime login recovery
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config login-wrangler.toml --keep-vars
      - name: Verify live frontend and truthful collector result
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          def read(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:return r.status,r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:return e.code,e.read().decode('utf-8','replace')
          for path in ['/home','/realtime']:
              status,text=read('https://maroowell.com'+path+'?verify=meta-recovery-20261008')
              ready=status==200 and '/meta-connection.js?v=20261008-recovery1' in text
              print('FRONTEND',path,status,'recovery_hook='+str(ready))
              assert ready,'Frontend recovery hook not live'
          status,text=read('https://maroowell.com/meta-connection.js?v=20261008-recovery1')
          assert status==200 and 'login-send-code' in text
          print('MOBILE_LOGIN_ASSET',status)
          status,text=read('https://meta-direct-poc.brain-0f6.workers.dev/collector/run')
          data=json.loads(text)
          print('COLLECTOR_LIVE',json.dumps({'http':status,'ok':data.get('ok'),'successful':data.get('successful'),'due':data.get('due'),'error':data.get('error'),'errors':[r.get('error') for r in data.get('results',[]) if r.get('error')]},ensure_ascii=False))
          assert status==200
          assert not (data.get('ok') is True and any(r.get('error') for r in data.get('results',[]))),'False healthy status remains'
          PY
