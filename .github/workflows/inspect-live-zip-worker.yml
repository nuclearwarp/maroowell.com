name: Inspect live Cloudflare zip worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-zip-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Discover accounts and inspect live Worker source
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/cf-inspect .diagnostics
          : > /tmp/cf-inspect/download-summary.txt

          accounts_http=$(curl -sS -o /tmp/cf-inspect/accounts.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50' || true)
          echo "accounts_http=${accounts_http}" >> /tmp/cf-inspect/download-summary.txt

          node <<'NODE' > /tmp/cf-inspect/accounts.tsv
          const fs=require('fs');
          let data={}; try{data=JSON.parse(fs.readFileSync('/tmp/cf-inspect/accounts.json','utf8'));}catch{}
          for(const a of data.result||[]) if(a?.id) console.log(`${a.id}\t${String(a.name||'').replace(/[\r\n\t]/g,' ')}`);
          NODE

          found_source=0
          while IFS=$'\t' read -r account_id account_name; do
            [ -n "$account_id" ] || continue
            echo "account_name=${account_name}" >> /tmp/cf-inspect/download-summary.txt
            scripts_file="/tmp/cf-inspect/scripts-${account_id}.json"
            scripts_http=$(curl -sS -o "$scripts_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts" || true)
            echo "scripts_http=${scripts_http}" >> /tmp/cf-inspect/download-summary.txt

            node - "$scripts_file" <<'NODE' > /tmp/cf-inspect/script-names.txt
          const fs=require('fs');
          const p=process.argv[2];
          let data={}; try{data=JSON.parse(fs.readFileSync(p,'utf8'));}catch{}
          const rows=Array.isArray(data.result)?data.result:[];
          for(const r of rows){ const id=String(r?.id||r?.name||'').trim(); if(id) console.log(id); }
          NODE

            while IFS= read -r script_name; do
              [ -n "$script_name" ] || continue
              echo "script_name=${script_name}" >> /tmp/cf-inspect/download-summary.txt
              out="/tmp/cf-inspect/source.raw"
              code=$(curl -sS -o "$out" -w '%{http_code}' \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts/${script_name}" || true)
              bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
              echo "source_http=${code} bytes=${bytes}" >> /tmp/cf-inspect/download-summary.txt
              if [ "$code" = "200" ] && grep -a -q '/building/stats' "$out"; then
                cp "$out" /tmp/cf-inspect/live-zip-worker.raw
                echo "matched_account_name=${account_name}" >> /tmp/cf-inspect/download-summary.txt
                echo "matched_script=${script_name}" >> /tmp/cf-inspect/download-summary.txt
                found_source=1
                break 2
              fi
            done < /tmp/cf-inspect/script-names.txt
          done < /tmp/cf-inspect/accounts.tsv

          if [ "$found_source" != "1" ]; then
            echo 'No accessible Worker source contained /building/stats' >> /tmp/cf-inspect/download-summary.txt
          fi

          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          let summary = fs.readFileSync('/tmp/cf-inspect/download-summary.txt','utf8');
          summary=summary.replace(/[0-9a-f]{32}/gi,'[account-id-redacted]');
          let out = '# Live zip Worker diagnostic\n\n```text\n' + summary + '```\n';
          const p='/tmp/cf-inspect/live-zip-worker.raw';
          if (fs.existsSync(p)) {
            const text=fs.readFileSync(p,'utf8');
            out += `\nsource_sha256: ${crypto.createHash('sha256').update(text).digest('hex')}\n`;
            const lines=text.split(/\r?\n/);
            const terms=['unclassifiedUnitCount','unclassified_unit_count','residentialUnitCount','residential_unit_count','deliveryUnitCount','delivery_unit_count','householdCount','household_count','kapt','KAPT'];
            const hits=[];
            for(let i=0;i<lines.length;i++) if(terms.some(t=>lines[i].includes(t))) hits.push(i);
            const wanted=new Set();
            for(const i of hits) for(let j=Math.max(0,i-16);j<=Math.min(lines.length-1,i+28);j++) wanted.add(j);
            let last=-2;
            out+='\n## Relevant source excerpts\n\n```js\n';
            for(const i of [...wanted].sort((a,b)=>a-b)) {
              if(i>last+1) out+='\n// ...\n';
              let line=lines[i]
                .replace(/(Bearer\s+)[A-Za-z0-9._~+\/-]+/g,'$1[redacted]')
                .replace(/([A-Za-z0-9_-]{40,})/g,'[long-token-redacted]');
              out+=String(i+1).padStart(5,' ')+' | '+line+'\n';
              last=i;
            }
            out+='```\n';
          }
          fs.writeFileSync('.diagnostics/live-zip-worker-summary.md',out);
          NODE

          if grep -Fq "$CLOUDFLARE_API_TOKEN" .diagnostics/live-zip-worker-summary.md; then
            echo 'Token leakage guard failed' >&2
            exit 1
          fi

      - name: Commit sanitized diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostics/live-zip-worker-summary.md
          git commit -m 'Record live zip worker diagnostic'
          git push origin HEAD:main
