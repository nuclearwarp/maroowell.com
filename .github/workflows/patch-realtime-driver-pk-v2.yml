name: Temp generate schedule frontend TXT
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-realtime-driver-pk-v2.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fixed schedule frontend
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('public/maroowell_schedule')
          s=p.read_text(encoding='utf-8')
          old='''        if(found)return found;
        return {displayName:raw,ownerName:raw,exportName:raw,exportId:"",accountType:"직접입력",colorKey:raw,search:raw};'''
          new='''        if(found)return found;

        const master=resolveMetaInfoAccount(raw);
        if(master && clean(master.exportId)) return master;

        return {displayName:raw,ownerName:raw,exportName:raw,exportId:"",accountType:"직접입력",colorKey:raw,search:raw};'''
          if old not in s: raise SystemExit('resolveAccount anchor missing')
          s=s.replace(old,new,1)

          pattern=r'''      function makeDirtyRecord\(\{date,routeLabel,value,rowOrder,source\}\)\{[\s\S]*?\n      \}\n\n      function applyInputVisual'''
          replacement='''      function makeDirtyRecord({date,routeLabel,value,rowOrder,source}){
        const cleanValue=clean(value);
        const keepAssignmentFields=!!cleanValue;
        let account=null;
        if(cleanValue){
          account=resolveMetaInfoAccount(cleanValue)
            || resolvePddAccount(cleanValue,source||{})
            || resolveAccount(cleanValue);
        }
        const parsedAccountId=parseAccountToken(account?.exportId,clean(account?.exportName || account?.displayName || cleanValue));
        const masterId=clean(parsedAccountId.id);
        const parsedSourceId=parseAccountToken(clean(source?.driver_coupang_id),clean(source?.driver_export_name || source?.driver_name || cleanValue));
        const sourceId=clean(parsedSourceId.id);
        const accountType=clean(account?.accountType);
        const sourceAccountType=clean(source?.driver_account_type);
        const authoritativeAccountType=masterId ? (accountType || "본계정") : (sourceAccountType || accountType || null);
        return {
          schedule_date:date,
          camp:state.camp,
          wave:state.wave,
          route_label:normalizeRouteLabel(routeLabel),
          driver_name:cleanValue||null,
          driver_display_name:cleanValue||null,
          driver_owner_name:keepAssignmentFields?(clean(account?.ownerName)||clean(source?.driver_owner_name)||cleanValue||null):null,
          driver_export_name:keepAssignmentFields?(clean(account?.exportName)||clean(source?.driver_export_name)||cleanValue||null):null,
          driver_coupang_id:keepAssignmentFields?(masterId||sourceId||null):null,
          driver_account_type:keepAssignmentFields?authoritativeAccountType:null,
          memo:keepAssignmentFields?(clean(source?.memo)||null):null,
          row_order:Number(rowOrder||source?.row_order||0),
          cell_color:cleanValue?colorForValue(cleanValue):null,
          is_active:!!cleanValue
        };
      }

      function applyInputVisual'''
          s,n=re.subn(pattern,replacement,s,count=1)
          if n!=1: raise SystemExit(f'makeDirtyRecord replacement count={n}')

          old='''      async function saveAll(){
        if(!state.camp||!state.weekDates.length){alert("먼저 불러오기를 해주세요.");return}

        normalizeUniformChildrenBeforeSave();'''
          new='''      async function saveAll(){
        if(!state.camp||!state.weekDates.length){alert("먼저 불러오기를 해주세요.");return}

        try{
          const added=await loadAllMaroowellInfoRowsForAccountLookup();
          if(added>0) buildDriverAccounts();
        }catch(e){
          console.warn("[schedule save] maroowell_info account refresh failed",e);
        }

        normalizeUniformChildrenBeforeSave();'''
          if old not in s: raise SystemExit('saveAll anchor missing')
          s=s.replace(old,new,1)
          Path('maroowell_schedule_front_fixed.txt').write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('maroowell_schedule_front_fixed.txt').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          js=max([b for b in blocks if b.strip()],key=len)
          f=tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False)
          try:
            f.write(js); f.close()
            r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
            if r.returncode:
              print(r.stderr)
              raise SystemExit(r.returncode)
          finally:
            try: os.unlink(f.name)
            except: pass
      - uses: actions/upload-artifact@v4
        with:
          name: maroowell_schedule_front_fixed
          path: maroowell_schedule_front_fixed.txt
          retention-days: 1
# trigger
