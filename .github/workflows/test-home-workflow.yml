name: Test Home workflow attachments
on:
  push:
    branches: [main]
    paths:
      - 'workers/home-system/worker.js'
      - 'tests/home-workflow-attachments.test.mjs'
      - 'tests/home-workflow-dropzone.test.mjs'
      - 'public/home-admin.js'
      - 'public/home-admin.css'
      - 'public/home'
      - '.github/workflows/test-home-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check workers/home-system/worker.js
          node --check tests/home-workflow-attachments.test.mjs
      - name: Workflow attachment regression
        run: node tests/home-workflow-attachments.test.mjs
      - name: Workflow drag-and-drop regression
        run: node tests/home-workflow-dropzone.test.mjs
