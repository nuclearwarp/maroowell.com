name: Temporary add Yongin1 to account statistics

on:
  push:
    paths:
      - ".github/workflows/temp-add-yongin1-account.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch maroowell_account
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("public/maroowell_account")
          text = path.read_text(encoding="utf-8")

          old_option = '''          <option value="일산2">일산2</option>
          <option value="용인3">용인3</option>'''
          new_option = '''          <option value="일산2">일산2</option>
          <option value="용인1">용인1</option>
          <option value="용인3">용인3</option>'''

          if '<option value="용인1">용인1</option>' not in text:
              if old_option not in text:
                  raise SystemExit("camp option target not found")
              text = text.replace(old_option, new_option, 1)

          old_wave = '''      function autoWaveForCampBeforeLoad(){
        const camp = loose(els.currentCampInput.value);

        if(camp !== "m익산1") return;

        if(normalizeWave(els.waveSelect.value) !== "야간"){
          els.waveSelect.value = "야간";
        }
      }'''

          new_wave = '''      function autoWaveForCampBeforeLoad(){
        const camp = loose(els.currentCampInput.value);

        if(camp === "m익산1"){
          if(normalizeWave(els.waveSelect.value) !== "야간"){
            els.waveSelect.value = "야간";
          }
          return;
        }

        if(camp === "용인1" && normalizeWave(els.waveSelect.value) !== "주간"){
          els.waveSelect.value = "주간";
        }
      }'''

          if old_wave not in text:
              if 'camp === "용인1"' not in text:
                  raise SystemExit("auto wave target not found")
          else:
              text = text.replace(old_wave, new_wave, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/temp-add-yongin1-account.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maroowell_account .github/workflows/temp-add-yongin1-account.yml
          git commit -m "Add Yongin1 daytime account statistics"
          git push origin main
