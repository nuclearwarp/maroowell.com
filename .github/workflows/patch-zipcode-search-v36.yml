name: Patch zipcode_search V36

on:
  push:
    paths:
      - '.github/workflows/patch-zipcode-search-v36.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch zipcode_search directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/zipcode_search')
          text = path.read_text(encoding='utf-8')

          # 1) UI: 엘베 O는 파란색, 엘베 X는 기존 주황색 계열 유지.
          css_anchor = '''    .buildingStatsMetric.walkup strong{\n      color:#c2410c;\n    }\n'''
          css_replacement = '''    .buildingStatsMetric.walkup strong{\n      color:#c2410c;\n    }\n\n    .buildingStatsMetric.elevatorYes{\n      border-color:#bfdbfe;\n      background:#eff6ff;\n    }\n\n    .buildingStatsMetric.elevatorYes span,\n    .buildingStatsMetric.elevatorYes strong{\n      color:#2563eb;\n    }\n'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css_replacement, 1)

          old_metrics = '''                <div class="buildingStatsMetric">\n                  <span>엘베 있음</span>\n                  <strong>${formatDeliveryUnitCount(confirmedElevatorUnits)}</strong>\n                  <small>${formatUnitPercent(confirmedElevatorUnits, totalUnits)}</small>\n                </div>\n                <div class="buildingStatsMetric inferred">\n                  <span>엘베 추정</span>\n                  <strong>${formatDeliveryUnitCount(inferredElevatorUnits)}</strong>\n                  <small>${formatUnitPercent(inferredElevatorUnits, totalUnits)}</small>\n                </div>\n                <div class="buildingStatsMetric walkup">\n                  <span>엘베 없음</span>\n'''
          new_metrics = '''                <div class="buildingStatsMetric elevatorYes">\n                  <span>엘베 O</span>\n                  <strong>${formatDeliveryUnitCount(confirmedElevatorUnits)}</strong>\n                  <small>${formatUnitPercent(confirmedElevatorUnits, totalUnits)}</small>\n                </div>\n                <div class="buildingStatsMetric walkup">\n                  <span>엘베 X</span>\n'''
          if old_metrics not in text:
              raise SystemExit('Elevator metric block not found')
          text = text.replace(old_metrics, new_metrics, 1)

          # 2) 프론트 BUILDING 진단 콘솔 제거. 실제 오류 UI/상태 처리는 유지한다.
          patterns = [
              r'\n\s*console\.info\("\[BUILDING_LEGAL_DONG_CODES\]"[\s\S]*?\n\s*\}\)\);',
              r'\n\s*console\.info\(\n\s*"\[BUILDING_SCOPE_PARCELS\]"[\s\S]*?\n\s*\);',
              r'\n\s*console\.info\("\[BUILDING_GEOCODE_SUMMARY\]"[\s\S]*?\n\s*\}\);',
              r'\n\s*console\.warn\("\[BUILDING_STATS_RETRY\]"[\s\S]*?\n\s*\}\);',
              r'\n\s*console\.error\("\[BUILDING_STATS_ZERO_DIAGNOSTICS\]"[\s\S]*?\n\s*\}\);',
              r'\n\s*console\.info\("\[BUILDING_SCOPE_RESULT\]"[\s\S]*?\n\s*\);',
              r'\n\s*console\.info\("\[BUILDING_ELEVATOR_RESULT\]"[\s\S]*?\n\s*\);',
              r'\n\s*console\.info\("\[BUILDING_STATS_RESULT\]"[\s\S]*?\n\s*\}\);',
              r'\n\s*console\.warn\("\[BUILDING_STATS_API\] fetch failed"[\s\S]*?\n\s*\}\);',
          ]
          for pattern in patterns:
              text = re.sub(pattern, '', text, count=1)

          text = text.replace(
              '배송호수 원천 연결 실패 (${detail}). 콘솔 BUILDING_STATS_ZERO_DIAGNOSTICS에서 폴리곤 필지 직접조회와 K-APT 응답을 확인해주세요.',
              '배송호수 원천 연결 실패 (${detail}). 원천 데이터 연결 상태를 확인해주세요.'
          )

          # 화면 버전 표기를 V36으로 맞춘다.
          text = text.replace(
              'const ZIPCODE_AREA_UI_VERSION = "2026-08-09-terrain-building-stats-v32";',
              'const ZIPCODE_AREA_UI_VERSION = "2026-08-09-terrain-building-stats-v36";'
          )
          text = text.replace(
              'console.log("[mw] zipcode_search loaded white design · building V32 phased K-APT/detail budget");\n\n',
              ''
          )

          # V36에서는 추정 엘리베이터를 O 판정에 사용하지 않는다.
          text = text.replace(
              'confirmedElevatorUnits + inferredElevatorUnits === 0',
              'confirmedElevatorUnits === 0'
          )

          path.write_text(text, encoding='utf-8')

          # 임시 런타임 패치는 완전히 제거한다.
          runtime = Path('public/zipcode_search_runtime.js')
          if runtime.exists():
              runtime.unlink()

          # config.js에 런타임 로더가 남아 있는 경우 제거한다.
          config = Path('public/config.js')
          config_text = config.read_text(encoding='utf-8')
          config_text = re.sub(
              r'\n// zipcode_search 전용 가벼운 런타임 패치\.[\s\S]*?document\.head\.appendChild\(script\);\n\}\n',
              '\n',
              config_text,
              count=1,
          )
          config.write_text(config_text, encoding='utf-8')

          # 검증
          final = path.read_text(encoding='utf-8')
          assert 'zipcode_search_runtime.js' not in config.read_text(encoding='utf-8')
          assert '<span>엘베 O</span>' in final
          assert '<span>엘베 X</span>' in final
          assert '<span>엘베 추정</span>' not in final
          assert '[BUILDING_SCOPE_RESULT]' not in final
          assert '[BUILDING_ELEVATOR_RESULT]' not in final
          assert '[BUILDING_STATS_RESULT]' not in final
          PY

      - name: Commit patched frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zipcode_search public/config.js
          git add -u public/zipcode_search_runtime.js || true
          git diff --cached --check
          git commit -m "Inline V36 elevator UI and remove building console noise"
          git push

      - name: Export full zipcode_search txt
        uses: actions/upload-artifact@v4
        with:
          name: zipcode-search-v36
          path: public/zipcode_search
          if-no-files-found: error
