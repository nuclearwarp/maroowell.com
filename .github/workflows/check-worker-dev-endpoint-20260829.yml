name: Check terrain worker dev endpoint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-worker-dev-endpoint-20260829.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run Copernicus runtime probe
        shell: bash
        run: python3 .diagnostics/copernicus_probe_runtime.py
