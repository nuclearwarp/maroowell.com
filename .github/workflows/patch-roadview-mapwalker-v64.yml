name: Patch roadview map walker V64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-roadview-mapwalker-v64.yml'
      - '.github/scripts/patch_roadview_mapwalker_v64.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply roadview patch
        run: python3 .github/scripts/patch_roadview_mapwalker_v64.py

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -q 'MW_ROADVIEW_MAPWALKER_V64' public/zipcode_search
          grep -q 'MW_ROADVIEW_MAPWALKER_V64' public/coupangRouteMap.html
          grep -q 'MapTypeId.ROADVIEW' public/zipcode_search
          grep -q 'MapTypeId.ROADVIEW' public/coupangRouteMap.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zipcode_search public/coupangRouteMap.html coupangRouteMap.html
          git commit -m "Sync roadview roads and viewing direction"
          git pull --rebase origin main
          git push origin main
