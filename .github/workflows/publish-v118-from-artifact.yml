name: Publish Maroowell Android v1.1.8 test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v118-from-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified signed artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprseasia.oaiusercontent.com/files/00000000-1ca8-8207-ba80-6f6304c24fbc/raw?se=2026-08-23T03%3A28%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=2a95e87f-fcf3-5d13-82fb-81c9cde2b85b&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T01%3A13%3A53Z&ske=2026-08-24T01%3A13%3A53Z&sks=b&skv=2026-02-06&sig=HMbTMVMoNHCAjJd9BJgSE2AAS8OkLaIz5FiCWU7v52U%3D'
          curl -fL --retry 2 --connect-timeout 20 "$URL" -o /tmp/maroowell-1.1.8-signed.zip
          echo 'fb79d8fe7443cc79afd507d4302a9dc35413e627eb309d43e34432794a371321  /tmp/maroowell-1.1.8-signed.zip' | sha256sum -c -
          rm -rf /tmp/mw118 && mkdir -p /tmp/mw118
          unzip -q /tmp/maroowell-1.1.8-signed.zip -d /tmp/mw118
          test -f /tmp/mw118/Maroowell-1.1.8.apk
          test -f /tmp/mw118/maroowell-latest.apk
          test "$(stat -c%s /tmp/mw118/Maroowell-1.1.8.apk)" = '9286611'
          echo '019e1b5a9450c29d1c15bd2998b7fe97ebfe677eea2db2f1f82ab2ab88ceca40  /tmp/mw118/Maroowell-1.1.8.apk' | sha256sum -c -

      - name: Publish APK and version metadata atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/mw118/Maroowell-1.1.8.apk public/apk/Maroowell-1.1.8.apk
          cp /tmp/mw118/maroowell-latest.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 20,
            "versionName": "1.1.8",
            "updatedAt": "2026-08-23",
            "fileName": "Maroowell-1.1.8.apk",
            "downloadUrl": "https://raw.githubusercontent.com/nuclearwarp/maroowell.com/main/public/apk/Maroowell-1.1.8.apk",
            "changes": [
              "긴급 공지 PUSH 수신을 위한 Firebase Cloud Messaging 기반 추가",
              "로그인한 기기의 PUSH 토큰을 Supabase 서버에 등록·갱신하도록 추가",
              "일반 공지와 긴급 알림 채널을 분리하고 긴급 알림은 높은 우선순위로 표시",
              "Firebase 서버 비밀키는 앱에 포함하지 않고 Supabase 서버 측 Vault에서만 사용",
              "캠프 팀장·총괄팀장 권한별 PUSH 발송 백엔드 기반 추가"
            ]
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apk/Maroowell-1.1.8.apk public/apk/maroowell-latest.apk public/app_version.json
          git commit -m 'Publish Maroowell Android v1.1.8'
          git push origin HEAD:main
