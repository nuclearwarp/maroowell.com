name: Publish v1.1.6 APK from verified artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v116-from-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v1.1.6 artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9bf0-8206-84bd-3fb7c8a3b0b6/raw?se=2026-08-22T15%3A02%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=c8edf87f-bd17-53b5-981b-a2f4b5786e16&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T07%3A12%3A19Z&ske=2026-08-23T07%3A12%3A19Z&sks=b&skv=2026-02-06&sig=XBnCLxzxeiEV%2BQWdyXQL9wgEYLjGZset/SiS9I9SNrg%3D'
          curl -fsSL --retry 3 --retry-all-errors "$URL" -o /tmp/v116.zip
          unzip -q /tmp/v116.zip -d /tmp/v116
          test -f /tmp/v116/Maroowell-1.1.6.apk
          test -f /tmp/v116/maroowell-latest.apk
          EXPECTED='069349984dca9fc0e4733bb05effad2dbdcc5bc83a5e0c1b0441a1cac1268f95'
          test "$(sha256sum /tmp/v116/Maroowell-1.1.6.apk | awk '{print $1}')" = "$EXPECTED"
          test "$(sha256sum /tmp/v116/maroowell-latest.apk | awk '{print $1}')" = "$EXPECTED"
          test "$(stat -c%s /tmp/v116/Maroowell-1.1.6.apk)" = '8000110'
          test "$(head -c 2 /tmp/v116/Maroowell-1.1.6.apk)" = 'PK'

      - name: Put APKs in actual public path and update metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/v116/Maroowell-1.1.6.apk public/apk/Maroowell-1.1.6.apk
          cp /tmp/v116/maroowell-latest.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 18,
            "versionName": "1.1.6",
            "updatedAt": "2026-08-22",
            "fileName": "Maroowell-1.1.6.apk",
            "downloadUrl": "https://maroowell.com/apk/Maroowell-1.1.6.apk",
            "changes": [
              "앱 세션 만료·401 처리 시 토큰을 갱신하고 재시도하도록 권한 처리 안정화",
              "달력에서 배송 수량을 입력해도 캠프 표시를 유지하고 금액을 별도로 표시",
              "날짜 상세 화면에서 해당 날짜의 예상 수수료를 원 단위로 표시",
              "쿠팡 캠프 검색 결과를 카카오 지도에서 한 번에 볼 수 있는 기능 추가"
            ]
          }
          JSON
          sha256sum public/apk/Maroowell-1.1.6.apk public/apk/maroowell-latest.apk

      - name: Commit public v1.1.6
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v116-from-artifact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/apk public/app_version.json .github/workflows/publish-v116-from-artifact.yml
          git commit -m 'Publish Maroowell Android v1.1.6'
          git push origin HEAD:main
