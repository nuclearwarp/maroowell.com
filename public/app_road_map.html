<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>라우트 지도 연결 중 · 마루웰</title>
<script>
(function(){
  "use strict";
  const original = new URLSearchParams(location.search);
  const next = new URL("/coupangRouteMap.html", location.origin);
  next.searchParams.set("mw_app", "1");
  for (const key of ["camp","routes","source"]) {
    const value = original.get(key);
    if (value) next.searchParams.set(key,value);
  }
  location.replace(next.pathname + next.search);
})();
</script>
</head><body>라우트 지도로 이동 중입니다.</body>
</html>
