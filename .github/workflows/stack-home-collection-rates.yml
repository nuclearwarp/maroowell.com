name: Stack Home collection rates
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stack-home-collection-rates.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Home rate layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/home')
          s=p.read_text(encoding='utf-8')
          old='.metricPanel .dual{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:11.5px;font-weight:1000}.metricPanel .dual span{white-space:nowrap}.metricPanel .dual b{font-size:12.5px}'
          new='.metricPanel .dual{display:grid;gap:2px;margin-top:3px;font-size:11.5px;font-weight:1000}.metricPanel .dual span{display:block;white-space:nowrap}.metricPanel .dual b{font-size:12.5px}.summaryBox .stackRate{display:grid;gap:2px;line-height:1.18}.summaryBox .stackRate div{white-space:nowrap}'
          if old not in s: raise SystemExit('dual css pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('<span>완료 <b>${pct(m.completionRate)}</b></span><span>회수 <b>${pct(m.collectionRate)}</b></span>','<span>완료율 <b>${pct(m.completionRate)}</b></span><span>회수율 <b>${pct(m.collectionRate)}</b></span>')
          s=s.replace('$("returnRate").textContent=`완료 ${pct(a.returns.completionRate)} · 회수 ${pct(a.returns.collectionRate)}`;','$("returnRate").innerHTML=`<div class="stackRate"><div>완료율 ${pct(a.returns.completionRate)}</div><div>회수율 ${pct(a.returns.collectionRate)}</div></div>`;')
          s=s.replace('$("freshRate").textContent=`완료 ${pct(a.fresh.completionRate)} · 회수 ${pct(a.fresh.collectionRate)}`;','$("freshRate").innerHTML=`<div class="stackRate"><div>완료율 ${pct(a.fresh.completionRate)}</div><div>회수율 ${pct(a.fresh.collectionRate)}</div></div>`;')
          p.write_text(s,encoding='utf-8')
      - name: Commit Home
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/home
          git commit -m "Stack return and Freshbag completion and collection rates"
          git push
