name: Fix Meta active-only reset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-meta-active-only-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Patch Meta active-only reset and COMPLETED status
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('workers/schedule-api/worker.js')
          s = worker.read_text(encoding='utf-8')
          old = '  const working = metaStatusLooksWorking(status) || hasRoute || (!status && !hasRoute);'
          new = '  const working = metaStatusLooksWorking(status) || hasRoute;'
          if old not in s:
              raise SystemExit('worker active-person pattern not found')
          s = s.replace(old, new, 1)
          worker.write_text(s, encoding='utf-8')

          front = Path('public/maroowell_schedule')
          s = front.read_text(encoding='utf-8')
          anchor = '''      function metaWorkflowSummary(result){
        const d=result?.data||{};'''
          replacement = '''      function metaWorkflowSucceeded(result){
        const status=clean(result?.status).toUpperCase();
        return status==="SUCCESS" || status==="COMPLETED";
      }

      function metaWorkflowSummary(result){
        const d=result?.data||{};'''
          if anchor not in s:
              raise SystemExit('front summary anchor not found')
          s = s.replace(anchor, replacement, 1)
          old_check = 'if(clean(resetResult?.status).toUpperCase()!=="SUCCESS")'
          if old_check not in s:
              raise SystemExit('reset success check not found')
          s = s.replace(old_check, 'if(!metaWorkflowSucceeded(resetResult))', 1)
          old_check2 = 'if(clean(actualResult?.status).toUpperCase()!=="SUCCESS")'
          if old_check2 not in s:
              raise SystemExit('apply success check not found')
          s = s.replace(old_check2, 'if(!metaWorkflowSucceeded(actualResult))', 1)
          front.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -F 'const working = metaStatusLooksWorking(status) || hasRoute;' workers/schedule-api/worker.js
          grep -F 'function metaWorkflowSucceeded(result)' public/maroowell_schedule
          grep -F 'if(!metaWorkflowSucceeded(resetResult))' public/maroowell_schedule
          grep -F 'if(!metaWorkflowSucceeded(actualResult))' public/maroowell_schedule

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/maroowell_schedule workers/schedule-api/worker.js
          git commit -m "Reset only active Meta registrants and accept COMPLETED"
          git push

      - name: Deploy schedule API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config schedule-wrangler.toml --keep-vars
