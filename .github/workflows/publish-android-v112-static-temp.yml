name: Publish Maroowell Android v1.1.2 static APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-v112-static-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed v1.1.2 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-8ec0-8206-9c55-afa9a65f2bfc/raw?se=2026-08-21T03%3A03%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=4dff5531-172b-5f12-8d24-61cdb5c61735&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T00%3A20%3A59Z&ske=2026-08-22T00%3A20%3A59Z&sks=b&skv=2026-02-06&sig=JhRyNZtC016bEDSxoBrG%2BUZ0dkW/fBa1XPnUZbAcjkU%3D' -o artifact.zip
          rm -rf artifact
          mkdir -p artifact
          unzip -o artifact.zip -d artifact
          APK=$(find artifact -type f -name 'Maroowell-1.1.2.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK"

      - name: Stage APK as normal static site asset
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find artifact -type f -name 'Maroowell-1.1.2.apk' | head -n 1)
          mkdir -p apk public/apk
          cp "$APK" apk/Maroowell-1.1.2.apk
          cp "$APK" public/apk/Maroowell-1.1.2.apk
          ls -lh apk/Maroowell-1.1.2.apk public/apk/Maroowell-1.1.2.apk

      - name: Update public app metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > app_version.json <<'JSON'
          {
            "versionCode": 13,
            "versionName": "1.1.2",
            "updatedAt": "2026-08-21",
            "fileName": "Maroowell-1.1.2.apk",
            "downloadUrl": "https://maroowell.com/apk/Maroowell-1.1.2.apk",
            "changes": [
              "달력은 캠프만 표시하고 날짜 클릭 시 상세 스케줄 BottomSheet를 표시",
              "서서브 라우트는 같은 서브 기준으로 묶어 406D · 01 / 02 / 03 형태로 표시",
              "달력의 주간·야간 텍스트를 제거하고 일상점검 / 일상점검! 상태만 표시",
              "마루웰 정보 전체 편집·신규 인원 등록과 메뉴별 권한 배지를 반영"
            ]
          }
          JSON
          cp app_version.json public/app_version.json

      - name: Commit static APK and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Maroowell-1.1.2.apk public/apk/Maroowell-1.1.2.apk app_version.json public/app_version.json
          git rm .github/workflows/publish-android-v112-static-temp.yml
          git commit -m "Publish Maroowell Android v1.1.2 static APK"
          git pull --rebase origin main
          git push origin main
