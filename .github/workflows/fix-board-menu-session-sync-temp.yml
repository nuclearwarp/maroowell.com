name: Fix board menu session sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-board-menu-session-sync-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch board menu auth session sync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/board-menu.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''  function decodeJwtPayload(token) {
'''
          helper = r'''  async function requestSessionCopy(supabaseUrl, timeoutMs = 1200) {
    const projectRef = getSupabaseProjectRef(supabaseUrl);
    if (!projectRef || readStoredSession(supabaseUrl)) return !!readStoredSession(supabaseUrl);
    if (!("BroadcastChannel" in window)) return false;

    const channelName = "mw-auth-bridge:" + projectRef;
    const tabId = Date.now().toString(36) + Math.random().toString(36).slice(2);
    const requestId = tabId + ":" + Date.now().toString(36);
    let channel = null;

    function matchesKey(key) {
      const base = "sb-" + projectRef + "-auth-token";
      return !!key && (key === base || key.startsWith(base + ".") || key.startsWith(base + "-code-verifier"));
    }

    function writeEntries(entries) {
      try {
        for (const row of entries || []) {
          if (!row || !matchesKey(row.key)) continue;
          if (row.value == null) sessionStorage.removeItem(row.key);
          else sessionStorage.setItem(row.key, row.value);
        }
      } catch {}
    }

    return await new Promise(resolve => {
      let finished = false;
      const finish = value => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        try { channel?.close(); } catch {}
        resolve(!!value);
      };
      const timer = setTimeout(() => finish(!!readStoredSession(supabaseUrl)), Math.max(300, Number(timeoutMs) || 1200));

      try {
        channel = new BroadcastChannel(channelName);
        channel.addEventListener("message", event => {
          const msg = event.data || {};
          if (msg.projectRef !== projectRef || msg.fromTabId === tabId) return;
          if (msg.type !== "MW_SESSION_RESPONSE" || msg.requestId !== requestId) return;
          writeEntries(msg.entries);
          finish(!!readStoredSession(supabaseUrl));
        });
        channel.postMessage({ type:"MW_SESSION_REQUEST", projectRef, requestId, fromTabId:tabId });
      } catch {
        finish(false);
      }
    });
  }

'''
          if helper.strip() not in s:
              if anchor not in s:
                  raise SystemExit('decodeJwtPayload anchor not found')
              s = s.replace(anchor, helper + anchor, 1)

          old = '''    const session = readStoredSession(SUPABASE_URL);
    const accessToken = String(session?.access_token || "");
    if (!accessToken) return out;
'''
          new = '''    let session = readStoredSession(SUPABASE_URL);
    if (!session) {
      await requestSessionCopy(SUPABASE_URL, 1400);
      session = readStoredSession(SUPABASE_URL);
    }
    const accessToken = String(session?.access_token || "");
    if (!accessToken) return out;
'''
          if old not in s:
              raise SystemExit('loadAccess session target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/board-menu.js
          git rm .github/workflows/fix-board-menu-session-sync-temp.yml
          git commit -m "Fix web board menu permission session sync"
          git pull --rebase origin main
          git push origin main

