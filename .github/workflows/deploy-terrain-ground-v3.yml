name: Deploy terrain ground V3
on:
  push:
    branches: [main]
    paths:
      - '.diagnostics/deploy_terrain_aws_fallback_v2.py'
      - '.github/workflows/deploy-terrain-ground-v3.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile .diagnostics/deploy_terrain_aws_fallback_v2.py
      - run: python .diagnostics/deploy_terrain_aws_fallback_v2.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
