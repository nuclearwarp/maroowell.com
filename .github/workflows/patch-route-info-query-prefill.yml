name: Patch route-info query prefill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-route-info-query-prefill.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add camp and route query prefill
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('public/maroowell_route_info')
          s = p.read_text(encoding='utf-8')

          anchor = '''  function normalizeRoute(v) {
          '''
          helper = '''  function applyQueryPrefill() {
              const params = new URLSearchParams(location.search);
              const camp = clean(params.get("camp"));
              const route = clean(params.get("route"));

              if (camp) $("campInput").value = camp;
              if (route) $("routeSearchInput").value = route;

              return !!camp;
            }

          '''
          if 'function applyQueryPrefill()' not in s:
              if anchor not in s:
                  raise SystemExit('normalizeRoute anchor not found')
              s = s.replace(anchor, helper + anchor, 1)

          old = '''      await initMap();
              setTimeout(() => {
                try { map?.relayout(); } catch {}
              }, 180);
              renderCounts();
              renderRouteList();
              renderPointList();

              setStatus("Camp와 Route를 입력해 조회하세요.", "warn");
          '''
          new = '''      await initMap();
              setTimeout(() => {
                try { map?.relayout(); } catch {}
              }, 180);
              renderCounts();
              renderRouteList();
              renderPointList();

              if (applyQueryPrefill()) {
                await loadData();
              } else {
                setStatus("Camp와 Route를 입력해 조회하세요.", "warn");
              }
          '''
          if old not in s:
              raise SystemExit('startup anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/maroowell_route_info
          git commit -m 'Prefill route info from app query parameters'
          git push origin main
