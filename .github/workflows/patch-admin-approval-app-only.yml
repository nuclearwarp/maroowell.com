        out.can_clhi = true;
'''
          repl='''      try {
        const { data: accountState } = await sb.rpc("mw_my_account_state").maybeSingle();
        if (accountState) {
          out.approval_status = accountState.approval_status || "pending";
          out.app_only = accountState.app_only === true;
