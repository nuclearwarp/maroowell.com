name: Clean selected SH label stack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-selected-sh-label-stack-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch selected SH labels
        run: python3 .github/scripts/patch_selected_sh_label_stack_v2.py

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff -- public/coupang_camp_map coupang_camp_map
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupang_camp_map coupang_camp_map
          git commit -m "Tighten selected subhub label stacks"
          git pull --rebase origin main
          git push origin main
