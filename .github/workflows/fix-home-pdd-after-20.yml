name: Fix Home PDD behavior after 20
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-pdd-after-20.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Home main META query
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/home')
          s = p.read_text(encoding='utf-8')
          old = 'main=await metaSearch({campCodes:[code],waveCode:S.wave,sortType:"DELIVERY_COMPLETED_RATIO",sortDirection:"ASC",workDate:workDate(),page:0,size:50})'
          new = 'main=await metaSearch({campCodes:[code],waveCode:S.wave,pddTime:null,sortType:"DELIVERY_COMPLETED_RATIO",sortDirection:"ASC",workDate:workDate(),page:0,size:50})'
          if old not in s:
              raise SystemExit('Home META main-query pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit Home patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/home
          git commit -m "Fix Home daytime META query after 20:00"
          git push
