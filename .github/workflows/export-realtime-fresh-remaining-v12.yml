name: Export realtime fresh remaining full TXT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build full corrected TXT
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('public/realtime').read_text(encoding='utf-8')
          s = src

          old = '''  if(cls==="freshDelivery"){
    return `<div class="metricPanel ${cls}">
      <div class="k">${label}</div>
      <div class="rate">${m?.hasData?pct(m.rate):"-"}</div>
      <div class="detail">20시 PDD</div>
    </div>`;
  }'''
          new = '''  if(cls==="freshDelivery"){
    return `<div class="metricPanel ${cls}">
      <div class="k">${label}</div>
      <div class="rate">${m?.hasData?pct(m.rate):"-"}</div>
      <div class="detail">${m?.hasData?("남음 "+num(m.remaining)+" / 전체 "+num(m.total)):"데이터 없음"}<br>20시 PDD</div>
    </div>`;
  }'''
          if old not in s:
              raise SystemExit('fresh delivery panel anchor not found')
          s = s.replace(old, new, 1)

          old2 = '''  $("freshDeliverySub").textContent=onlyNight?"야간 미조회":"20시 PDD";'''
          new2 = '''  $("freshDeliverySub").innerHTML=onlyNight
    ?"야간 미조회"
    :(!a.freshDelivery.hasData
      ?"데이터 없음"
      :`남음 ${num(a.freshDelivery.remaining)} / 전체 ${num(a.freshDelivery.total)}<br>20시 PDD`);'''
          if old2 not in s:
              raise SystemExit('fresh summary anchor not found')
          s = s.replace(old2, new2, 1)

          s = s.replace('<meta name="mw-realtime-live-v11" content="11">','<meta name="mw-realtime-live-v12" content="12">',1)

          assert s.startswith('<!doctype html>')
          assert s.rstrip().endswith('</html>')
          assert '남음 "+num(m.remaining)+" / 전체 "+num(m.total)' in s
          assert '남음 ${num(a.freshDelivery.remaining)} / 전체 ${num(a.freshDelivery.total)}' in s
          assert 'mw-realtime-live-v12' in s

          Path('realtime_full_fresh_remaining_v12.txt').write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('realtime_full_fresh_remaining_v12.txt').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          js=max((b for b in blocks if b.strip()),key=len)
          f=tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False)
          try:
              f.write(js); f.close()
              r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(r.returncode)
          finally:
              try: os.unlink(f.name)
              except: pass
          PY

      - name: Upload full TXT
        uses: actions/upload-artifact@v4
        with:
          name: realtime-full-fresh-remaining-v12
          path: realtime_full_fresh_remaining_v12.txt
          retention-days: 3
