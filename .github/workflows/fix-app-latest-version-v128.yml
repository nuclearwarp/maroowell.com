name: Publish Maroowell Android v1.3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-app-latest-version-v128.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v1.3.4 release artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a184-8211-abd7-005639214305/raw?se=2026-08-31T13%3A50%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=0798645f-97e5-514d-b7c7-46190fc5f03c&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A46%3A52Z&ske=2026-08-31T18%3A46%3A52Z&sks=b&skv=2026-02-06&sig=4ssrCGXdtcX1Ge69sAjIKOnHpxQDJ9HD7t35zRpgAkM%3D'
          curl -fL --retry 3 --retry-all-errors "$URL" -o /tmp/v134.zip
          rm -rf /tmp/v134
          mkdir -p /tmp/v134
          unzip -q /tmp/v134.zip -d /tmp/v134
          test -f /tmp/v134/Maroowell-1.3.4.apk
          test -f /tmp/v134/maroowell-latest.apk
          EXPECTED_SHA='9ecd06dcbc7a4e4235562ed7f1edde00e04f0325715de573cf5fdb757e400d12'
          for APK in /tmp/v134/Maroowell-1.3.4.apk /tmp/v134/maroowell-latest.apk; do
            test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED_SHA"
          done

      - name: Install APK and v1.3.4 metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/apk
          cp /tmp/v134/Maroowell-1.3.4.apk public/apk/Maroowell-1.3.4.apk
          cp /tmp/v134/maroowell-latest.apk public/apk/maroowell-latest.apk
          cat > public/app_version.json <<'JSON'
          {
            "versionCode": 37,
            "versionName": "1.3.4",
            "updatedAt": "2026-08-31",
            "fileName": "Maroowell-1.3.4.apk",
            "downloadUrl": "https://maroowell.com/apk/Maroowell-1.3.4.apk",
            "changes": [
              "야간 실시간 배송 현황에서 앱 스케줄 기준일과 META workDate를 분리",
              "8/31 20:00~9/1 07:59 앱 스케줄은 8/31, META 조회는 9/1로 유지",
              "META 401/403 발생 시 META 로그인 화면으로 자동 복귀",
              "앱 비교 데이터 401/403 발생 시 Supabase 토큰 갱신 후 자동 재시도",
              "앱 세션까지 만료된 경우 마루웰 로그인 화면으로 자동 이동"
            ]
          }
          JSON
          cp public/app_version.json app_version.json

      - name: Commit public v1.3.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apk/Maroowell-1.3.4.apk public/apk/maroowell-latest.apk public/app_version.json app_version.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'v1.3.4 is already published'
            exit 0
          fi
          git commit -m 'Publish Maroowell Android v1.3.4'
          git push origin HEAD:main
