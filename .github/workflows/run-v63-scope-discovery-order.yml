name: Run V63 scope discovery patch

on:
  push:
    paths:
      - '.github/scripts/patch_v63_scope_discovery_order.py'
      - '.github/workflows/run-v63-scope-discovery-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_v63_scope_discovery_order.py
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zipcode_search public/coupangRouteMap.html
          git commit -m "Stabilize parcel discovery and sort zipcode building loads"
          git push
