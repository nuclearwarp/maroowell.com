name: Deploy building analysis V72
on:
  push:
    branches: [main]
    paths:
      - '.diagnostics/deploy_building_v72_strict_apartment.py'
      - '.github/workflows/deploy-building-v72.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m py_compile .diagnostics/deploy_building_v72_strict_apartment.py
      - run: python .diagnostics/deploy_building_v72_strict_apartment.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
