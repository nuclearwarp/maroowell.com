name: Deploy schedule worker

on:
  push:
    branches: [main]
    paths:
      - workers/schedule-api/**
      - schedule-wrangler.toml
      - .github/workflows/deploy-schedule-worker.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deploy-schedule-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy schedule worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config schedule-wrangler.toml --keep-vars
