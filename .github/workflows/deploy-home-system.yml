name: Deploy Home system worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/home-system/**'
      - '.github/workflows/deploy-home-system.yml'

concurrency:
  group: deploy-home-system-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check workers/home-system/worker.js
      - name: Deploy Home system
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config workers/home-system/wrangler.toml --keep-vars
