name: Export realtime fresh remaining full TXT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build full corrected TXT
        run: python scripts/export_realtime_fresh_remaining.py
      - name: Validate generated TXT
        run: |
          test -f realtime_full_fresh_remaining_v12.txt
          grep -q 'mw-realtime-live-v12' realtime_full_fresh_remaining_v12.txt
          grep -q '남음' realtime_full_fresh_remaining_v12.txt
      - name: Upload full corrected TXT
        uses: actions/upload-artifact@v4
        with:
          name: realtime-full-fresh-remaining-v12
          path: realtime_full_fresh_remaining_v12.txt
          if-no-files-found: error
          retention-days: 3
