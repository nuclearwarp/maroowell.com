name: Validate admin approval feature scripts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-admin-approval-feature.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-approval-app-only
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/board-menu.js
          python - <<'PY'
          import re, pathlib, subprocess
          for name in ['public/index.html','public/admin_access.html']:
              text=pathlib.Path(name).read_text()
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)
              for i,script in enumerate(scripts):
                  if not script.strip(): continue
                  path=pathlib.Path('/tmp')/(pathlib.Path(name).stem+f'-{i}.js')
                  path.write_text(script)
                  subprocess.run(['node','--check',str(path)],check=True)
          PY
