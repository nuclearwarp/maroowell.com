name: Run coupang camp QR and region inheritance patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_coupang_camp_qr_region_inheritance.py'
      - '.github/workflows/run-coupang-camp-qr-region-inheritance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_coupang_camp_qr_region_inheritance.py
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupang_camp
          git commit -m "Improve camp QR and inherit parent region"
          git push origin main
