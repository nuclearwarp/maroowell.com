name: Patch schedule suggestions child unlock and toolbar UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-schedule-suggest-child-ui-20260915.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch schedule frontend
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/maroowell_schedule')
          s=p.read_text(encoding='utf-8')

          # 1. Suggest only accounts actually belonging to the selected camp.
          old='''      function accountCampAllowed(acc){\n        if(!state.camp)return true;\n        if(acc?.globalSub)return true;\n        return !!clean(acc?.camp) && campMatches(acc.camp,state.camp);\n      }'''
          new='''      function accountCampAllowed(acc){\n        if(!state.camp)return true;\n        const camp=clean(acc?.camp);\n        if(!camp)return false;\n        return campMatches(camp,state.camp);\n      }'''
          if old not in s: raise SystemExit('accountCampAllowed target missing')
          s=s.replace(old,new,1)

          # 2. Add a reusable event binder so an initially locked child gets suggestions immediately after unlock.
          marker='''      function onCellInput(e){\n        const input=e.currentTarget;'''
          helper='''      function bindCellInputEvents(input){\n        if(!input || input.disabled || input.dataset.mwCellBound==="1")return;\n        input.dataset.mwCellBound="1";\n        input.addEventListener("input",onCellInput);\n        input.addEventListener("focus",e=>{e.currentTarget.select();showSuggest(e.currentTarget)});\n        input.addEventListener("keyup",e=>{\n          if(e.key==="Escape"){hideSuggest();e.currentTarget.blur();return}\n          showSuggest(e.currentTarget);\n        });\n      }\n\n      function onCellInput(e){\n        const input=e.currentTarget;'''
          if marker not in s: raise SystemExit('onCellInput marker missing')
          s=s.replace(marker,helper,1)

          oldbind='''        els.tableHost.querySelectorAll(".cellEdit").forEach(input=>{\n          if(input.disabled)return;\n          input.addEventListener("input",onCellInput);\n          input.addEventListener("focus",e=>{e.currentTarget.select();showSuggest(e.currentTarget)});\n          input.addEventListener("keyup",e=>{\n            if(e.key==="Escape"){hideSuggest();e.currentTarget.blur();return}\n            showSuggest(e.currentTarget);\n          });\n        });'''
          newbind='''        els.tableHost.querySelectorAll(".cellEdit").forEach(input=>{\n          bindCellInputEvents(input);\n        });'''
          if oldbind not in s: raise SystemExit('render cell binder target missing')
          s=s.replace(oldbind,newbind,1)

          # Rebind immediately whenever a parent/child becomes editable.
          old_parent='''          parentInput.disabled=false;\n          parentInput.classList.remove("parentLocked");\n          parentInput.classList.toggle("dirty",dirty);\n          parentInput.value=val;\n          applyInputVisual(parentInput,val);'''
          new_parent='''          parentInput.disabled=false;\n          parentInput.classList.remove("parentLocked");\n          parentInput.classList.toggle("dirty",dirty);\n          parentInput.value=val;\n          applyInputVisual(parentInput,val);\n          bindCellInputEvents(parentInput);'''
          if old_parent not in s: raise SystemExit('parent unlock target missing')
          s=s.replace(old_parent,new_parent,1)

          old_child='''            childInput.disabled=false;\n            childInput.classList.remove("childLocked");\n            childInput.classList.toggle("dirty",dirty);\n            childInput.value=val;\n            applyInputVisual(childInput,val);'''
          new_child='''            childInput.disabled=false;\n            childInput.classList.remove("childLocked");\n            childInput.classList.toggle("dirty",dirty);\n            childInput.value=val;\n            applyInputVisual(childInput,val);\n            bindCellInputEvents(childInput);'''
          if old_child not in s: raise SystemExit('child unlock target missing')
          s=s.replace(old_child,new_child,1)

          # 3. Put all action buttons on a dedicated second row.
          old_actions='''      <div class="weekBtns">\n        <button id="btnPrevWeek" class="btn" type="button">이전주</button>\n        <button id="btnNextWeek" class="btn" type="button">다음주</button>\n      </div>\n\n      <button id="btnLoad" class="btn primary" type="button">불러오기</button>\n      <button id="btnSave" class="btn ok" type="button">저장</button>\n      <button id="btnExportMeta" class="btn excel" type="button">📊 엑셀 생성</button>\n      <button id="btnMetaUpload" class="btn ok" type="button">🚀 메타어드민 전송</button>\n      <button id="btnCopyImage" class="btn warn" type="button">이미지 복사</button>\n      <button id="btnReset" class="btn" type="button">초기화</button>'''
          new_actions='''      <div class="toolbarActions">\n        <div class="weekBtns">\n          <button id="btnPrevWeek" class="btn" type="button">이전주</button>\n          <button id="btnNextWeek" class="btn" type="button">다음주</button>\n        </div>\n        <button id="btnLoad" class="btn primary" type="button">불러오기</button>\n        <button id="btnSave" class="btn ok" type="button">저장</button>\n        <button id="btnExportMeta" class="btn excel" type="button">📊 엑셀 생성</button>\n        <button id="btnMetaUpload" class="btn ok" type="button">🚀 메타어드민 전송</button>\n        <button id="btnCopyImage" class="btn warn" type="button">이미지 복사</button>\n        <button id="btnReset" class="btn" type="button">초기화</button>\n      </div>'''
          if old_actions not in s: raise SystemExit('toolbar action markup target missing')
          s=s.replace(old_actions,new_actions,1)

          # 4. Final desktop UI override: more room for week, smaller wave/search, larger actual/fake labels.
          css='''\n    /* ===== SCHEDULE DESKTOP TOOLBAR COMPACT V2 - 2026-09-15 ===== */\n    @media(min-width:1181px){\n      .toolbar{\n        display:grid!important;\n        grid-template-columns:160px 92px minmax(255px,300px) 150px minmax(340px,390px)!important;\n        gap:10px!important;\n        align-items:end!important;\n        overflow:visible!important;\n      }\n      .toolbar > .field,.toolbar > .updateEditor{min-width:0!important;width:auto!important;}\n      .toolbar > .field:nth-of-type(2){max-width:92px!important;}\n      .toolbar > .field:nth-of-type(4){max-width:150px!important;}\n      .weekButton{min-width:255px!important;}\n      .weekButton span:first-child{overflow:visible!important;text-overflow:clip!important;white-space:nowrap!important;}\n      .updateEditor{min-width:340px!important;}\n      .dateMini{grid-template-columns:38px minmax(82px,1fr)!important;}\n      .dateMini b{font-size:13px!important;font-weight:600!important;}\n      .dateMini::after{left:41px!important;font-size:12px!important;font-weight:500!important;}\n      .toolbarActions{\n        grid-column:1 / -1!important;\n        display:flex!important;\n        align-items:center!important;\n        gap:8px!important;\n        flex-wrap:wrap!important;\n        width:100%!important;\n        padding-top:2px!important;\n      }\n      .toolbarActions .weekBtns{display:flex!important;gap:8px!important;width:auto!important;}\n      .toolbarActions .btn{width:auto!important;min-width:78px!important;}\n      .toolbarActions #btnMetaUpload{min-width:138px!important;}\n      .toolbarActions #btnExportMeta{min-width:105px!important;}\n      .metaLine{grid-column:1 / -1!important;}\n    }\n    @media(max-width:1180px){\n      .toolbarActions{grid-column:1 / -1!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;width:100%!important;}\n      .toolbarActions .weekBtns{grid-column:1 / -1!important;}\n      .toolbarActions .btn{width:100%!important;}\n    }\n    @media(max-width:720px){\n      .toolbarActions{grid-template-columns:1fr!important;}\n      .toolbarActions .weekBtns{grid-column:auto!important;}\n    }\n    /* ===== SCHEDULE DESKTOP TOOLBAR COMPACT V2 END ===== */\n'''
          idx=s.rfind('</style>')
          if idx<0: raise SystemExit('style close missing')
          s=s[:idx]+css+s[idx:]

          p.write_text(s,encoding='utf-8')

      - name: Verify patch
        run: |
          grep -q 'function bindCellInputEvents' public/maroowell_schedule
          grep -q 'const camp=clean(acc?.camp)' public/maroowell_schedule
          grep -q 'class="toolbarActions"' public/maroowell_schedule
          grep -q 'grid-template-columns:160px 92px minmax(255px,300px) 150px' public/maroowell_schedule

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/maroowell_schedule
          git commit -m "Fix schedule account suggestions child unlock and toolbar layout"
          git push
