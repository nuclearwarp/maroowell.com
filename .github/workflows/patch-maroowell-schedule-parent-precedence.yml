name: Patch maroowell schedule parent precedence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-maroowell-schedule-parent-precedence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply parent precedence patch
        run: python3 .github/scripts/patch_maroowell_schedule_parent_precedence.py

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff -- public/maroowell_schedule
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maroowell_schedule
          git rm .github/workflows/patch-maroowell-schedule-parent-precedence.yml
          git rm .github/scripts/patch_maroowell_schedule_parent_precedence.py
          git commit -m "Honor parent route assignments over stale subroutes"
          git pull --rebase origin main
          git push origin main
