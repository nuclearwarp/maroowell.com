name: Stack same-location camp markers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-camp-map-same-location-stack.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch camp marker grouping and stack spacing
        run: python3 .github/scripts/patch_camp_map_same_location_stack.py

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff -- public/coupang_camp_map coupang_camp_map
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupang_camp_map coupang_camp_map
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Stack same-location camp and subhub labels"
          git pull --rebase origin main
          git push origin main
