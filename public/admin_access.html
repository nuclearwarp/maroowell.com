<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마루웰 · 관리자 권한 관리</title>
<link rel="icon" href="/favicon.ico">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/mw-global-font.css">
<style>
:root{font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;color:#1c2b40;background:#f5f7fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}
.shell{max-width:1260px;padding:28px 20px 55px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:45px;height:45px;object-fit:contain}
h1{font-size:23px;letter-spacing:-.055em;margin:0;font-weight:850}h2{font-size:17px;letter-spacing:-.03em;margin:0}
.sub{color:#77869c;font-size:12px;margin-top:5px}.headerActions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{border:1px solid #d6deeb;background:#fff;color:#334968;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:750;min-height:39px}
.btn:hover{border-color:#96b9ef;background:#f6faff}.btn.primary{border-color:#2667e8;background:#2667e8;color:#fff}
.btn.primary:hover{background:#1653cb}.btn.soft{background:#eaf1fe;border-color:#cfddf7;color:#2454a8}
.auth{font-size:12px;color:#64748b;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice{border:1px solid #d9e4f4;background:white;border-radius:12px;padding:13px 16px;color:#5b718a;font-size:12px;line-height:1.5;margin-bottom:15px}
.notice.error{color:#ad2434;border-color:#f7cdd1;background:#fff7f7}.notice.success{color:#17633e;border-color:#bce8ca;background:#f1fff6}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.metric{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:16px 18px}
.metric span{font-size:11px;color:#718199;font-weight:650}.metric strong{display:block;font-size:23px;margin-top:5px;letter-spacing:-.025em}
.main{display:grid;grid-template-columns:minmax(340px,1.07fr) minmax(390px,.93fr);gap:15px;align-items:start}
.card{background:white;border:1px solid #dfe6f1;border-radius:17px;box-shadow:0 4px 18px rgba(40,67,104,.025);overflow:hidden}
.cardHeader{padding:19px 20px 16px;border-bottom:1px solid #edf1f6}.cardBody{padding:18px 20px}
.searchBar{display:flex;gap:8px;margin-bottom:11px}.searchBar input{flex:1;min-width:0}
input:not([type=checkbox]),select,textarea{height:40px;background:#fff;border:1px solid #d2deeb;border-radius:10px;padding:0 12px;color:#243449;outline:0;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:#4385ed;box-shadow:0 0 0 3px #e8f1ff}
textarea{resize:vertical;min-height:76px;height:auto;padding:11px 12px}
.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid #d9e3ef;background:#fff;border-radius:9px;padding:8px 11px;color:#62738b;font-size:11px;font-weight:750}
.filter.active{color:#1d55b1;background:#edf4ff;border-color:#bed5fb}.count{font-size:11px;color:#7b899f;margin-top:12px}
.users{max-height:600px;overflow:auto;padding:5px 7px 9px}
.user{width:100%;display:flex;text-align:left;gap:12px;align-items:center;padding:13px 14px;border:1px solid transparent;border-bottom-color:#edf0f6;border-radius:10px;background:#fff;color:#263951}
.user:hover{background:#f7faff}.user.active{background:#edf4ff;border-color:#bcd4f9}
.avatar{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:#eaf0fc;color:#285fc5;display:grid;place-items:center;font-weight:850}
.identity{min-width:0;flex:1}.identity strong{font-size:13px;display:block}.identity small{display:block;margin-top:4px;color:#8492a7;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roleBadge{border-radius:8px;padding:6px 9px;background:#f1f5f9;color:#62758b;font-size:10.5px;font-weight:750;white-space:nowrap}
.roleBadge.super{background:#e8eeff;color:#344ca3}.roleBadge.manager{background:#e6f4ee;color:#277651}.roleBadge.team{background:#fff5e9;color:#a66b22}
.placeholder{padding:55px 16px;text-align:center;color:#96a1b2;font-size:13px}
.personTitle{display:flex;align-items:center;gap:12px;margin-bottom:17px}.personTitle strong{font-size:18px;display:block}
.personTitle span{font-size:12px;color:#8491a4;display:block;margin-top:5px}
.info{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.pill{font-size:10.5px;border-radius:8px;padding:7px 9px;color:#64748b;background:#f2f5fa}
.field{margin-bottom:17px}.field label{display:block;font-size:12px;color:#52657e;font-weight:750;margin-bottom:8px}
.field select,.field textarea{width:100%}.switchRows{border:1px solid #e0e7f0;border-radius:12px;margin:9px 0 16px}
.switchRow{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 14px;border-bottom:1px solid #edf1f5}
.switchRow:last-child{border:0}.switchRow b{display:block;font-size:12px}.switchRow small{display:block;margin-top:4px;font-size:11px;color:#94a0b1}
.switchRow input{appearance:none;width:37px;height:22px;flex-shrink:0;background:#d3dce8;border-radius:20px;position:relative;cursor:pointer;transition:.2s}
.switchRow input:checked{background:#2563eb}.switchRow input:before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:white;transition:.2s}
.switchRow input:checked:before{left:18px}
.footer{display:flex;justify-content:flex-end;align-items:center;gap:10px;border-top:1px solid #edf1f6;margin-top:20px;padding-top:17px}
.savedMsg{margin-right:auto;font-size:12px;color:#64748b}
.contextNote{font-size:11px;line-height:1.6;color:#748399;margin:3px 0 0}
#editPanel[hidden],#emptySelection[hidden],#advancedBtn[hidden]{display:none}
@media(max-width:950px){.main{grid-template-columns:1fr}.users{max-height:340px}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.shell{padding:16px 12px}.header{align-items:flex-start}.headerActions{justify-content:flex-end}.auth{max-width:125px}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:21px}.cardBody{padding:14px}}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div class="brand"><img src="/favicon.ico" alt=""><div><h1>관리자 권한 관리</h1><div class="sub">계정을 선택하고 필요한 권한만 변경하세요.</div></div></div>
    <div class="headerActions"><span class="auth" id="loginPill">로그인 확인 중</span><a href="/home" class="btn">홈으로</a><a href="/admin_access_legacy.html" class="btn soft" id="advancedBtn" hidden>가입 승인 · 고급 관리</a></div>
  </header>
  <div class="notice" id="statusText" role="status" aria-live="polite">계정 및 권한 정보를 불러오는 중입니다.</div>
  <section class="metrics">
    <div class="metric"><span>전체 관련 계정</span><strong id="totalCount">-</strong></div>
    <div class="metric"><span>최고관리자</span><strong id="superCount">-</strong></div>
    <div class="metric"><span>관리자 · 팀장</span><strong id="staffCount">-</strong></div>
    <div class="metric"><span>승인 대기</span><strong id="pendingCount">-</strong></div>
  </section>
  <div class="main">
    <section class="card" aria-label="계정 목록">
      <div class="cardHeader"><h2>계정 목록</h2><div class="sub">이름이나 이메일로 바로 찾을 수 있습니다.</div></div>
      <div class="cardBody">
        <div class="searchBar"><input type="search" id="searchInput" placeholder="이름 · 이메일 · 캠프 검색" autocomplete="off"><button type="button" class="btn" id="reloadBtn">새로고침</button></div>
        <div class="filters" id="filterBar">
          <button class="filter active" data-filter="all">전체</button>
          <button class="filter" data-filter="staff">관리 권한</button>
          <button class="filter" data-filter="member">일반</button>
          <button class="filter" data-filter="pending">승인 대기</button>
          <button class="filter" data-filter="app">앱 전용</button>
        </div>
        <div class="count" id="visibleCount"></div>
      </div>
      <div class="users" id="userList"></div>
    </section>
    <section class="card" aria-label="권한 편집">
      <div class="cardHeader"><h2>권한 설정</h2><div class="sub">변경한 내용은 저장 후 서버에서 한 번 더 검증합니다.</div></div>
      <div class="cardBody">
        <div id="emptySelection" class="placeholder">왼쪽에서 계정을 선택하세요.</div>
        <div id="editPanel" hidden>
          <div class="personTitle"><div class="avatar" id="personAvatar"></div><div><strong id="personName"></strong><span id="personEmail"></span></div></div>
          <div class="info" id="personInfo"></div>
          <div class="field"><label for="roleSelect">관리 권한</label>
            <select id="roleSelect">
              <option value="0">일반 사용자 · 관리 권한 없음</option>
              <option value="30">팀장 · 실시간 현황 등</option>
              <option value="60">관리자 · 운영 화면</option>
              <option value="90">최고관리자 · 모든 관리 기능</option>
            </select>
          </div>
          <div class="field"><label>세부 접근 권한</label><div class="switchRows">
            <label class="switchRow"><span><b>용차 관리</b><small>용차 관리 기능에 접근</small></span><input type="checkbox" id="dragonSwitch"></label>
            <label class="switchRow"><span><b>스케줄 수정</b><small>등록된 근무 스케줄을 변경</small></span><input type="checkbox" id="scheduleSwitch"></label>
            <label class="switchRow"><span><b>클렌징 히스토리</b><small>클렌징 이력 조회 권한</small></span><input type="checkbox" id="clhiSwitch"></label>
          </div></div>
          <div class="field"><label for="memoInput">변경 메모 (선택)</label><textarea id="memoInput" maxlength="300" placeholder="권한 변경 사유를 기록할 수 있습니다."></textarea></div>
          <p class="contextNote" id="permissionHelp">각 권한은 저장 즉시 서버에서 검증됩니다. 미승인 계정은 먼저 가입 승인을 진행해야 합니다.</p>
          <div class="footer"><span class="savedMsg" id="savedText"></span><button type="button" class="btn" id="resetBtn">취소</button><button type="button" class="btn primary" id="saveBtn">변경사항 저장</button></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script>
(function(){
"use strict";
var cfg=window.MARUWELL_CONFIG||{};
var API=String(cfg.ADMIN_API_BASE||"https://admin-access.maroowell.com").replace(/\/+$/,"");
var $=function(id){return document.getElementById(id)};
var sb=null,viewer=null,users=[],selectedId=null,currentFilter="all",busy=false,original=null;
function showStatus(text,kind){$("statusText").textContent=text;$("statusText").className="notice"+(kind?" "+kind:"")}
function roleName(n){return n>=90?"최고관리자":n>=60?"관리자":n>=30?"팀장":"일반"}
function nameFor(u){return u.display_name||u.email||"이름 없음"}
function pill(text){var p=document.createElement("span");p.className="pill";p.textContent=text;return p}
function getSelected(){return users.find(function(u){return u.user_id===selectedId})}
function getDraft(){return{role_level:Number($("roleSelect").value),dragon:$("dragonSwitch").checked,schedule:$("scheduleSwitch").checked,clhi:$("clhiSwitch").checked}}
function same(a,b){return a&&b&&a.role_level===b.role_level&&a.dragon===b.dragon&&a.schedule===b.schedule&&a.clhi===b.clhi}
function setEditing(on){
 ["roleSelect","dragonSwitch","scheduleSwitch","clhiSwitch","memoInput"].forEach(function(k){$(k).disabled=!on});
 $("saveBtn").disabled=!on||busy;
 $("resetBtn").disabled=!on||busy;
}
function renderMetrics(){
 $("totalCount").textContent=users.length;
 $("superCount").textContent=users.filter(function(u){return u.role_level>=90}).length;
 $("staffCount").textContent=users.filter(function(u){return u.role_level>=30&&u.role_level<90}).length;
 $("pendingCount").textContent=users.filter(function(u){return u.approval_status==="pending"}).length;
}
function filterUser(u){
 if(currentFilter==="staff")return u.role_level>=30;
 if(currentFilter==="member")return u.role_level<30;
 if(currentFilter==="pending")return u.approval_status==="pending";
 if(currentFilter==="app")return u.app_only;
 return true;
}
function renderList(){
 var query=$("searchInput").value.trim().toLocaleLowerCase();
 var filtered=users.filter(function(u){
  return filterUser(u)&&[nameFor(u),u.email,u.camp_code,u.coupang_id].some(function(v){return String(v||"").toLocaleLowerCase().includes(query)})
 });
 $("visibleCount").textContent=filtered.length+"명 표시";
 var box=$("userList");box.replaceChildren();
 if(!filtered.length){var empty=document.createElement("div");empty.className="placeholder";empty.textContent="조건에 맞는 계정이 없습니다.";box.append(empty);return}
 filtered.forEach(function(u){
  var b=document.createElement("button");b.type="button";b.className="user"+(selectedId===u.user_id?" active":"");
  var a=document.createElement("span");a.className="avatar";a.textContent=nameFor(u).slice(0,1);
  var identity=document.createElement("span");identity.className="identity";
  var title=document.createElement("strong");title.textContent=nameFor(u);
  var mail=document.createElement("small");mail.textContent=u.email||"";
  var role=document.createElement("span");role.className="roleBadge"+(u.role_level>=90?" super":u.role_level>=60?" manager":u.role_level>=30?" team":"");
  role.textContent=u.approval_status==="pending"?"승인 대기":roleName(u.role_level);
  identity.append(title,mail);b.append(a,identity,role);
  b.addEventListener("click",function(){selectUser(u.user_id)});
  box.append(b);
 });
}
function fillEditor(u){
 $("emptySelection").hidden=!!u;$("editPanel").hidden=!u;
 if(!u)return;
 $("personAvatar").textContent=nameFor(u).slice(0,1);
 $("personName").textContent=nameFor(u);
 $("personEmail").textContent=u.email||"";
 var info=$("personInfo");info.replaceChildren();
 info.append(pill(u.approval_status==="approved"?"승인 완료":u.approval_status==="pending"?"승인 대기":"가입 "+String(u.approval_status||"미확인")));
 info.append(pill(u.app_only?"앱 전용":"웹 계정"));
 if(u.camp_code)info.append(pill("캠프 "+u.camp_code));
 if(u.coupang_id)info.append(pill("쿠팡ID "+u.coupang_id));
 if(u.info_id)info.append(pill("인사정보 연결됨"));
 $("roleSelect").value=String(u.role_level||0);
 $("dragonSwitch").checked=u.is_dragon_car_admin===true;
 $("scheduleSwitch").checked=u.schedule_can_write===true;
 $("clhiSwitch").checked=u.clhi_can_select===true;
 $("memoInput").value=u.memo||"";
 original=getDraft();
 var can=u.can_edit===true&&u.approval_status==="approved"&&!busy;
 setEditing(can);
 $("roleSelect").querySelector('option[value="90"]').disabled=!viewer.can_grant_super;
 $("permissionHelp").textContent=u.user_id===viewer.user_id?"본인 계정의 권한은 여기에서 변경할 수 없습니다.":
   u.approval_status!=="approved"?"가입 승인 후 권한을 변경할 수 있습니다.":
   !u.can_edit?"상위 관리자 계정이므로 변경할 수 없습니다.":
   "저장 시 역할 및 세부 권한이 함께 반영되고, 서버에서 실제 저장값을 확인합니다.";
 $("savedText").textContent=can?"":"조회 전용";
}
function selectUser(id){
 if(selectedId!==id&&original&&!same(original,getDraft())&&!confirm("저장하지 않은 변경사항을 버릴까요?"))return;
 selectedId=id;renderList();fillEditor(getSelected());
}
async function getSession(){
 if(!sb){if(!window.supabase?.createClient)throw Error("인증 모듈을 불러오지 못했습니다.");
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,storage:sessionStorage,autoRefreshToken:true,detectSessionInUrl:false}});
 }
 var result=await sb.auth.getSession();
 if(result.error)throw result.error;
 if(!result.data?.session?.access_token)throw Error("로그인 세션이 없습니다. 다시 로그인해주세요.");
 return result.data.session.access_token;
}
async function api(path,opt){
 var token=await getSession();
 var options=opt||{},headers=new Headers(options.headers||{});
 headers.set("authorization","Bearer "+token);
 if(options.body)headers.set("content-type","application/json");
 var res=await fetch(API+path,Object.assign({},options,{headers:headers,cache:"no-store"}));
 var data=await res.json().catch(function(){return{ok:false,error:"서버 응답 형식 오류"}});
 if(!res.ok||data?.ok===false)throw Error(data?.error||"HTTP "+res.status);
 return data;
}
async function reload(preferredId){
 if(busy)return;
 showStatus("계정 권한을 확인하고 있습니다.");
 var d=await api("/admin/permissions/snapshot");
 viewer=d.viewer;users=d.users;
 $("loginPill").textContent="권한 "+roleName(viewer.role_level);
 $("advancedBtn").hidden=!viewer.can_grant_super;
 renderMetrics();
 var target=preferredId||selectedId;
 selectedId=target&&users.some(function(u){return u.user_id===target})?target:null;
 original=null;renderList();fillEditor(getSelected());
 showStatus("총 "+users.length+"명 · 서버 권한 조회 완료","success");
}
async function save(){
 var u=getSelected();
 if(!u||!u.can_edit||busy)return;
 var draft=getDraft();
 if(viewer.role_level<90&&draft.role_level>60){showStatus("최고관리자는 최고관리자만 지정할 수 있습니다.","error");return}
 if(draft.role_level<30&&draft.schedule){showStatus("팀장 이상만 스케줄 수정 권한을 가질 수 있습니다.","error");return}
 if(same(draft,original)&&$("memoInput").value===(u.memo||"")){showStatus("변경사항이 없습니다.");return}
 if(!confirm(nameFor(u)+" 계정의 권한을 저장할까요?"))return;
 busy=true;setEditing(false);
 showStatus("권한을 저장하고 실제 반영 여부를 확인하는 중입니다.");
 try{
  var result=await api("/admin/permissions/save",{method:"POST",body:JSON.stringify({
   user_id:u.user_id,role_level:draft.role_level,dragon:draft.dragon,
   schedule:draft.schedule,clhi:draft.clhi,memo:$("memoInput").value
  })});
  if(result.saved!==true||!result.user)throw Error("저장 검증 응답이 없습니다.");
  await reloadAfterSave(u.user_id,draft);
 }catch(e){showStatus("저장 실패: "+e.message,"error");setEditing(u.can_edit);return}
 finally{busy=false;var selected=getSelected();if(selected)fillEditor(selected)}
}
async function reloadAfterSave(id,draft){
 var d=await api("/admin/permissions/snapshot"),actual=d.users.find(function(u){return u.user_id===id});
 if(!actual||Number(actual.role_level)!==draft.role_level||
    actual.is_dragon_car_admin!==draft.dragon||actual.schedule_can_write!==draft.schedule||
    actual.clhi_can_select!==draft.clhi)throw Error("서버 저장값이 일치하지 않습니다. 재조회가 필요합니다.");
 viewer=d.viewer;users=d.users;selectedId=id;
 renderMetrics();renderList();fillEditor(actual);
 showStatus(nameFor(actual)+" 계정의 권한을 저장하고 DB 반영까지 확인했습니다.","success");
}
$("searchInput").addEventListener("input",renderList);
$("filterBar").addEventListener("click",function(e){
 var btn=e.target.closest("[data-filter]");if(!btn)return;
 currentFilter=btn.dataset.filter;
 $("filterBar").querySelectorAll("[data-filter]").forEach(function(item){item.classList.toggle("active",item===btn)});
 renderList();
});
$("reloadBtn").addEventListener("click",function(){reload().catch(function(e){showStatus(e.message,"error")})});
$("saveBtn").addEventListener("click",save);
$("resetBtn").addEventListener("click",function(){fillEditor(getSelected());showStatus("변경사항을 취소했습니다.")});
reload().catch(function(e){showStatus("권한 목록을 불러오지 못했습니다: "+e.message,"error")});
})();
</script>
<script>window.MW_BOARD_MENU_MODE="admin";</script>
<script src="/board-menu.js?v=20261025-vendor-view1"></script>
</body></html>
