name: Deploy realtime v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-realtime-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector
        run: node --check workers/meta-collector/entry.js
      - name: Validate realtime inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/realtime').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/realtime-inline.js').write_text('\n'.join(x for x in parts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/realtime-inline.js
      - name: Deploy META collector
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config workers/meta-collector/wrangler.toml --keep-vars
      - name: Deploy realtime frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config login-wrangler.toml --keep-vars
