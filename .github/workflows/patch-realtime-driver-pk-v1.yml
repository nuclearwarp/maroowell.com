name: Patch realtime driver PK identity
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collector and realtime
        shell: python
        run: |
          from pathlib import Path

          def rep(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              return s.replace(old, new, 1)

          # ---- collector ----
          p = Path('workers/meta-collector/entry.js')
          s = p.read_text(encoding='utf-8')

          s = rep(s,
          '''function rowIdentity(r) { return canonicalIdentity(r?.coupang_id, r?.driver_name, r?.meta_worker_key); }''',
          '''function rowIdentity(r) { return r?.driver_pk != null ? `pk:${Number(r.driver_pk)}` : canonicalIdentity(r?.coupang_id, r?.driver_name, r?.meta_worker_key); }
          function driverIdentity(driverPk, cid, name, fallback) { return driverPk != null ? `pk:${Number(driverPk)}` : canonicalIdentity(cid, name, fallback); }
          function infoWave(wave) { return String(wave || '').toUpperCase() === 'WAVE1' ? '야간' : String(wave || '').toUpperCase() === 'WAVE2' ? '주간' : String(wave || '').trim(); }
          async function loadDriverDirectory(env) { return await sbGet(env, 'maroowell_info?select=pk_id,person_name,coupang_id,camp_code,wave,position_title') || []; }
          function resolveDriverPk(directory, cid, name, camp, wave) {
            const id = String(cid || '').trim().toLowerCase(), dn = String(name || '').trim(), campName = String(camp || '').trim(), iw = infoWave(wave);
            const active = r => String(r?.position_title || '').trim().toLowerCase() !== '퇴사';
            if (id) {
              const byId = (directory || []).filter(r => String(r?.coupang_id || '').trim().toLowerCase() === id);
              if (byId.length === 1) return Number(byId[0].pk_id);
              const scopedActive = byId.filter(r => (!campName || String(r?.camp_code || '').trim() === campName) && (!iw || String(r?.wave || '').trim() === iw) && active(r));
              if (scopedActive.length === 1) return Number(scopedActive[0].pk_id);
              const scoped = byId.filter(r => (!campName || String(r?.camp_code || '').trim() === campName) && (!iw || String(r?.wave || '').trim() === iw));
              if (scoped.length === 1) return Number(scoped[0].pk_id);
            }
            if (dn) {
              const scopedActive = (directory || []).filter(r => String(r?.person_name || '').trim() === dn && (!campName || String(r?.camp_code || '').trim() === campName) && (!iw || String(r?.wave || '').trim() === iw) && active(r));
              if (scopedActive.length === 1) return Number(scopedActive[0].pk_id);
              const byName = (directory || []).filter(r => String(r?.person_name || '').trim() === dn);
              if (byName.length === 1) return Number(byName[0].pk_id);
            }
            return null;
          }''', 'collector identity helpers')

          s = rep(s,
          '''  return { assigned, scanned, completed, impossible, pdd, total, rate: pct(completed, total) };''',
          '''  const settled = completed + impossible + assigned + pdd;
            return { assigned, scanned, completed, impossible, pdd, total, rate: pct(settled, total) };''', 'collector delivery rate')

          s = rep(s, 'async function storeFreshRows(env, batch, schedule, fresh, now) {', 'async function storeFreshRows(env, batch, schedule, directory, fresh, now) {', 'fresh signature')
          s = rep(s,
          '''    const mappedName = String(matched[0]?.driver_display_name || matched[0]?.driver_name || matched[0]?.driver_owner_name || name || "").trim() || null;
              const key = canonicalIdentity(realCid, mappedName, workerKey(src));''',
          '''    const mappedName = String(matched[0]?.driver_display_name || matched[0]?.driver_name || matched[0]?.driver_owner_name || name || "").trim() || null;
              const driverPk = resolveDriverPk(directory, realCid, mappedName, batch.camp_name, batch.wave);
              const key = driverIdentity(driverPk, realCid, mappedName, workerKey(src));''', 'fresh resolve pk')
          s = rep(s, 'meta_worker_key:key, coupang_id:realCid, driver_name:mappedName,', 'meta_worker_key:key, driver_pk:driverPk, coupang_id:realCid, driver_name:mappedName,', 'fresh pk field')

          s = rep(s,
          '''  const schedule = await loadSchedule(env, batch.schedule_date, batch.wave, batch.camp_name);
            const prevRows = await sbGet(env, `meta_realtime_current?select=*&batch_id=eq.${batch.id}`) || [];''',
          '''  const schedule = await loadSchedule(env, batch.schedule_date, batch.wave, batch.camp_name);
            const directory = await loadDriverDirectory(env);
            const prevRows = await sbGet(env, `meta_realtime_current?select=*&batch_id=eq.${batch.id}`) || [];''', 'load driver directory')
          s = rep(s,
          '''    const mappedName = String(matched[0]?.driver_display_name || matched[0]?.driver_name || matched[0]?.driver_owner_name || name || "").trim() || null;
              const key = canonicalIdentity(realCid, mappedName, workerKey(src)), prev = prevMap.get(key);''',
          '''    const mappedName = String(matched[0]?.driver_display_name || matched[0]?.driver_name || matched[0]?.driver_owner_name || name || "").trim() || null;
              const driverPk = resolveDriverPk(directory, realCid, mappedName, batch.camp_name, batch.wave);
              const key = driverIdentity(driverPk, realCid, mappedName, workerKey(src)), prev = prevMap.get(key);''', 'main resolve pk')
          s = rep(s, 'meta_worker_key: key, source_camp_code: sourceCampCode(src), coupang_id: realCid,', 'meta_worker_key: key, source_camp_code: sourceCampCode(src), driver_pk: driverPk, coupang_id: realCid,', 'main pk field')
          s = rep(s, 'const deliveryDone = d.total > 0 && d.completed === d.total;', 'const deliveryDone = d.total > 0 && d.scanned === 0 && (d.completed + d.impossible + d.assigned + d.pdd) >= d.total;', 'delivery done semantics')
          s = rep(s, 'await storeFreshRows(env, batch, schedule, fresh, now);', 'await storeFreshRows(env, batch, schedule, directory, fresh, now);', 'fresh call')
          p.write_text(s, encoding='utf-8')

          # ---- realtime frontend ----
          p = Path('public/realtime')
          s = p.read_text(encoding='utf-8')

          s = rep(s, 'const defaultDate=()=>iso(new Date());', '''const addIsoDate=(date,days)=>{const d=new Date(date+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)};
          const kstNow=()=>{const d=new Date(Date.now()+9*3600000);return{date:d.toISOString().slice(0,10),hour:d.getUTCHours()}};
          const defaultDate=()=>kstNow().date;
          const activeScheduleDateForWave=wave=>{const k=kstNow();return wave==="WAVE1"&&k.hour<12?addIsoDate(k.date,-1):k.date};
          const batchIsCurrentShift=b=>String(b?.schedule_date||"")===activeScheduleDateForWave(String(b?.wave||"").toUpperCase());''', 'frontend KST shift')

          s = rep(s,
          '''function makeScheduleIndex(){
            const byCampWave=new Map();
            const today=$("scheduleDate").value||defaultDate();
            for(const x of S.scheduleRows||[]){
              if(String(x.schedule_date)!==today || x.is_active===false || norm(x.route_label)==="휴무자")continue;
              const camp=cleanCampName(x.camp);
              const wave=String(x.wave||"").toUpperCase();
              if(!camp||!wave)continue;
              const key=`${camp}|${wave}`;''',
          '''function makeScheduleIndex(){
            const byCampWave=new Map();
            for(const x of S.scheduleRows||[]){
              if(x.is_active===false || norm(x.route_label)==="휴무자")continue;
              const camp=cleanCampName(x.camp);
              const wave=String(x.wave||"").toUpperCase();
              const scheduleDate=String(x.schedule_date||"");
              if(!camp||!wave||!scheduleDate)continue;
              const key=`${scheduleDate}|${camp}|${wave}`;''', 'schedule index date')
          s = rep(s, 'key,name,wave,code:src.camp_code||b.camp_code||"",', 'key,name,wave,code:src.camp_code||b.camp_code||"",scheduleDate:String(b.schedule_date||""),', 'camp date')
          s = rep(s, 'const scheduled=scheduleIndex.get(g.key)||new Map();', 'const scheduled=scheduleIndex.get(`${g.scheduleDate}|${g.name}|${g.wave}`)||new Map();', 'schedule lookup')
          s = rep(s, 'driver:String(src.driver_name||src.coupang_id||"담당 확인").trim(),\n      coupangId:String(src.coupang_id||"").trim().toLowerCase(),', 'driver:String(src.driver_name||src.coupang_id||"담당 확인").trim(),\n      driverPk:src.driver_pk==null?null:Number(src.driver_pk),\n      coupangId:String(src.coupang_id||"").trim().toLowerCase(),', 'frontend driver pk')

          s = rep(s, 'const byKey=new Map(),byCid=new Map(),byName=new Map();', 'const byPk=new Map(),byKey=new Map(),byCid=new Map(),byName=new Map();', 'fresh map pk init')
          s = rep(s, 'for(const f of freshRows||[]){\n    if(f.meta_worker_key)', 'for(const f of freshRows||[]){\n    if(f.driver_pk!=null)byPk.set(`${f.batch_id}|${Number(f.driver_pk)}`,f);\n    if(f.meta_worker_key)', 'fresh map pk fill')
          s = rep(s, 'return{byKey,byCid,byName};', 'return{byPk,byKey,byCid,byName};', 'fresh map return')
          s = rep(s, 'const f=\n      (r.meta_worker_key&&fm.byKey.get', 'const f=\n      (r.driver_pk!=null&&fm.byPk.get(`${r.batch_id}|${Number(r.driver_pk)}`))||\n      (r.meta_worker_key&&fm.byKey.get', 'fresh join pk first')

          s = rep(s, '.eq("schedule_date",today)\n      .in("status",activeStatuses)', '.in("status",activeStatuses)', 'remove today batch filter')
          s = rep(s,
          '''    S.batches=batches||[];

              const schedulePromise=S.sb
                .from("maroowell_schedule")
                .select("schedule_date,camp,wave,route_label,driver_name,driver_display_name,driver_owner_name,driver_coupang_id,is_active")
                .eq("schedule_date",today)
                .eq("is_active",true);

              if(!S.batches.length){
                const{data:scheduleRows,error:se}=await schedulePromise;
                if(se)throw se;
                S.scheduleRows=scheduleRows||[];''',
          '''    S.batches=(batches||[]).filter(batchIsCurrentShift);

              if(!S.batches.length){
                S.scheduleRows=[];''', 'filter current shifts')
          s = rep(s, 'const ids=S.batches.map(b=>b.id);\n    const [currentRes,freshRes,scheduleRes]=await Promise.all([', 'const ids=S.batches.map(b=>b.id);\n    const scheduleDates=uniq(S.batches.map(b=>String(b.schedule_date||"")).filter(Boolean));\n    const [currentRes,freshRes,scheduleRes]=await Promise.all([', 'schedule dates')
          s = rep(s, 'batch_id,meta_worker_key,camp_code,camp_name,wave,coupang_id,driver_name,', 'batch_id,meta_worker_key,driver_pk,camp_code,camp_name,wave,coupang_id,driver_name,', 'current select pk')
          s = rep(s, 'batch_id,meta_worker_key,coupang_id,driver_name,delivery_assigned', 'batch_id,meta_worker_key,driver_pk,coupang_id,driver_name,delivery_assigned', 'fresh select pk')
          s = rep(s, '      schedulePromise\n    ]);', '      S.sb.from("maroowell_schedule").select("schedule_date,camp,wave,route_label,driver_name,driver_display_name,driver_owner_name,driver_coupang_id,is_active").in("schedule_date",scheduleDates).eq("is_active",true)\n    ]);', 'multi date schedules')
          s = s.replace('mw-realtime-live-v9', 'mw-realtime-live-v11').replace('content="9"', 'content="11"').replace('20260914-realtime3','20260915-realtime11')
          p.write_text(s, encoding='utf-8')

      - name: Syntax check
        run: node --check workers/meta-collector/entry.js
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workers/meta-collector/entry.js public/realtime
          git commit -m "Use Maroowell PK for realtime driver identity"
          git push
      - name: Deploy META collector
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config workers/meta-collector/wrangler.toml --keep-vars
      - name: Deploy realtime frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config login-wrangler.toml --keep-vars
