name: Diagnose Maroowell META outage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/meta-incident-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment and safe live responses without triggering MFA
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request,urllib.error,concurrent.futures
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          def read(url,headers=None):
              h={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8','Accept-Language':'ko-KR,ko;q=0.9,en;q=0.7'}
              h.update(headers or {})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=90) as r:return r.status,r.headers,r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:return e.code,e.headers,e.read().decode('utf-8','replace')
          def probe(path):
              status,headers,text=read('https://maroowell.com'+path)
              report={'path':path,'http':status,'content_type':headers.get('content-type'),'server':headers.get('server'),'cf_mitigated':headers.get('cf-mitigated'),'cf_ray':headers.get('cf-ray'),'recovery_hook':'/meta-connection.js?v=20261008-recovery1' in text,'login_asset':'__MW_META_CONNECTION__' in text}
              if status!=200:
                  visible=re.sub(r'<script\b[^>]*>[\s\S]*?</script>|<style\b[^>]*>[\s\S]*?</style>','',text,flags=re.I)
                  report['error_text']=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',visible))[:350]
              return report
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              for result in ex.map(probe,['/home','/realtime','/meta-connection.js?v=20261008-recovery1']):print('FRONTEND_LIVE',json.dumps(result,ensure_ascii=False))
          root='https://api.cloudflare.com/client/v4/accounts/0f644373a9db40f2b36e4ffece348c46/workers/scripts/'
          h={'Authorization':'Bearer '+os.environ['CF_TOKEN']}
          for worker in ['meta-direct-poc','login']:
              status,headers,text=read(root+worker,h)
              print('DEPLOYED_SOURCE',json.dumps({'worker':worker,'http':status,'meta_failure_guard':'META_AUTH_REQUIRED' in text,'session_version_check':'expectedUpdatedAt' in text,'mobile_asset_route':'meta-connection.js' in text,'foreign_tenant':bool(re.search(r'chunwoo|heroes',text,re.I))}))
              assert status==200
          status,headers,text=read('https://meta-direct-poc.brain-0f6.workers.dev/collector/run')
          try:
              d=json.loads(text)
              report={'http':status,'ok':d.get('ok'),'successful':d.get('successful'),'due':d.get('due'),'error':d.get('error'),'errors':[r.get('error') for r in d.get('results',[]) if r.get('error')]}
              print('COLLECTOR_LIVE',json.dumps(report,ensure_ascii=False))
              assert status==200 and not (d.get('ok') is True and report['errors'])
          except ValueError:
              print('COLLECTOR_PROBE_HTTP',status,headers.get('content-type'))
              raise
          PY
