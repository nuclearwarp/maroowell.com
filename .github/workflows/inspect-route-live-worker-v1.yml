name: Inspect live route worker v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-route-live-worker-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect live route worker source, deployment and bindings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 0f644373a9db40f2b36e4ffece348c46
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_TOKEN")
          service='purple-river-0717'

          echo '=== local source ==='
          sha256sum worker.js
          grep -n 'MW_ROUTE_WRITE_AUTH_V1\|requireRouteWriteAccess(request, env)\|ROUTE_WRITE_MIN_LEVEL' worker.js | head -n 20

          echo
          echo '=== production bindings ==='
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/services/$service/environments/production/settings" \
            | jq '{success, errors, bindings: [.result.bindings[]? | {name, type}]}'

          echo
          echo '=== current deployments ==='
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$service/deployments" \
            | jq '{success, errors, result}' || true

          echo
          echo '=== current versions ==='
          curl -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$service/versions" \
            | jq '{success, errors, result}' || true

          echo
          echo '=== deployed script content marker ==='
          code=$(curl -sS -o /tmp/live-script.bin -w '%{http_code}' "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$service/content" || true)
          echo "content HTTP $code"
          ls -lh /tmp/live-script.bin || true
          if grep -a -q 'MW_ROUTE_WRITE_AUTH_V1' /tmp/live-script.bin; then
            echo 'LIVE_SOURCE_HAS_AUTH_MARKER=yes'
          else
            echo 'LIVE_SOURCE_HAS_AUTH_MARKER=no'
          fi
          if grep -a -q 'requireRouteWriteAccess(request, env)' /tmp/live-script.bin; then
            echo 'LIVE_SOURCE_HAS_AUTH_CALL=yes'
          else
            echo 'LIVE_SOURCE_HAS_AUTH_CALL=no'
          fi

      - name: Probe direct worker without mutations
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://purple-river-0717.brain-0f6.workers.dev'

          echo '=== health ==='
          code=$(curl -sS -D /tmp/h1 -o /tmp/b1 -w '%{http_code}' "$BASE/health" || true)
          echo "HTTP $code"
          cat /tmp/b1 || true
          echo

          echo '=== anonymous POST /route with empty body object ==='
          code=$(curl -sS -D /tmp/h2 -o /tmp/b2 -w '%{http_code}' -X POST "$BASE/route" \
            -H 'Content-Type: application/json' --data '{}' || true)
          echo "HTTP $code"
          cat /tmp/b2 || true
          echo

          echo '=== invalid bearer POST /route with empty body object ==='
          code=$(curl -sS -D /tmp/h3 -o /tmp/b3 -w '%{http_code}' -X POST "$BASE/route" \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer invalid-security-probe' --data '{}' || true)
          echo "HTTP $code"
          cat /tmp/b3 || true
          echo

          echo '=== custom domain probes ==='
          for method in GET POST; do
            if [ "$method" = GET ]; then
              code=$(curl -sS -D /tmp/h4 -o /tmp/b4 -w '%{http_code}' 'https://route.maroowell.com/health' || true)
            else
              code=$(curl -sS -D /tmp/h4 -o /tmp/b4 -w '%{http_code}' -X POST 'https://route.maroowell.com/route' \
                -H 'Content-Type: application/json' --data '{}' || true)
            fi
            echo "$method HTTP $code"
            grep -iE '^(server:|cf-ray:|cf-mitigated:|content-type:)' /tmp/h4 || true
            head -c 500 /tmp/b4 || true
            echo
          done
