name: Verify Maroowell Android test download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-maroowell-test-apk-temp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public endpoints
        shell: bash
        run: |
          set -euxo pipefail
          curl -fLI --retry 5 --retry-delay 3 https://maroowell.com/downloads/maroowell-latest.apk
          curl -fsS --retry 5 --retry-delay 3 https://maroowell.com/app_version.json | tee /tmp/app_version.json
          grep -q '1.0.1-test' /tmp/app_version.json
          curl -fsS --retry 5 --retry-delay 3 https://maroowell.com/app | grep -q '관리자 테스트 앱'
      - name: Remove temporary verification workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-maroowell-test-apk-temp.yml
          git commit -m "Remove temporary APK verification workflow"
          git push origin main
