name: Publish Maroowell Android v1.0.4 test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-maroowell-v104-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed v1.0.4 APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprseasia.oaiusercontent.com/files/00000000-8868-8207-b1f9-4b498731f5e9/raw?se=2026-08-17T23%3A08%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=cd9dae8a-ca61-51f3-966a-5220199c08f2&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T22%3A39%3A12Z&ske=2026-08-18T22%3A39%3A12Z&sks=b&skv=2026-02-06&sig=iZHPvtPMWKLIn4Hade8AwkWo7PKuXT3g3GKZWp3w%2Big%3D' -o artifact.zip
          unzip -o artifact.zip -d artifact
          APK=$(find artifact -type f -name 'Maroowell-1.0.4.apk' | head -n 1)
          test -n "$APK"
          mkdir -p apk-dist/downloads
          cp "$APK" apk-dist/downloads/Maroowell-1.0.4.apk
          cp "$APK" apk-dist/downloads/maroowell-latest.apk
          sha256sum apk-dist/downloads/Maroowell-1.0.4.apk

      - name: Deploy APK to Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cat > wrangler-apk.toml <<'TOML'
          name = "maroowell-app-download"
          account_id = "0f644373a9db40f2b36e4ffece348c46"
          compatibility_date = "2026-08-18"
          workers_dev = true
          routes = [
            { pattern = "maroowell.com/downloads/*", zone_name = "maroowell.com" }
          ]

          [assets]
          directory = "./apk-dist"
          TOML
          npx wrangler@4 deploy --config wrangler-apk.toml
          curl -fL --retry 5 --retry-delay 3 -o /tmp/verify.apk https://maroowell-app-download.brain-0f6.workers.dev/downloads/Maroowell-1.0.4.apk
          test -s /tmp/verify.apk
          sha256sum /tmp/verify.apk

      - name: Update public version metadata
        shell: bash
        run: |
          cat > app_version.json <<'JSON'
          {
            "versionCode": 5,
            "versionName": "1.0.4-test",
            "updatedAt": "2026-08-18",
            "fileName": "Maroowell-1.0.4.apk",
            "downloadUrl": "https://maroowell-app-download.brain-0f6.workers.dev/downloads/Maroowell-1.0.4.apk",
            "changes": [
              "메인 홈을 기사 중심 월간 달력 UI로 개편",
              "로그인 기사 입차 스케줄을 달력에 자동 표시",
              "날짜별 배송 수량 예상소득을 홈 달력에 표시",
              "메뉴를 세로형 리스트와 노란 표정 마스코트 스타일로 정리",
              "여러 라우트의 수량과 서로 다른 단가를 날짜별로 분리 등록 지원"
            ]
          }
          JSON
          cp app_version.json public/app_version.json

      - name: Commit metadata and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_version.json public/app_version.json
          git rm .github/workflows/publish-maroowell-v104-temp.yml
          git commit -m "Publish Android test v1.0.4"
          git pull --rebase origin main
          git push origin main
