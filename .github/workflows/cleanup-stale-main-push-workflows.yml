name: Cleanup stale main-push workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stale-main-push-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable obsolete one-off workflows on push
        shell: python
        run: |
          from pathlib import Path

          targets = [
              'patch-purple-resonance-v68.yml',
              'patch-v63-scope-discovery-order.yml',
              'patch-purple-resonance-v69-detail-error-terminal.yml',
              'hotfix-meta-direct-upload-v1.yml',
              'patch-meta-direct-upload-ui-v2.yml',
              'patch-coupang-camp-map-roadview.yml',
              'patch-home-backend-live-3col.yml',
              'live-copernicus-auth-probe-v2.yml',
              'temp-build-schedule-account-fix.yml',
              'export-realtime-fresh-remaining-v12.yml',
              'patch-meta-actual-reset-ui-v3.yml',
              'patch-coupang-camp-qr-copy-label.yml',
              'fix-supabase-auth-concurrency.yml',
              'export-zipcode-sqm-pr.yml',
              'fix-meta-bridge-pdd-v025.yml',
              'export-schedule-full-fixed-txt.yml',
              'run-patch-meta-actual-reset-ui-v3.yml',
              'run-fix-meta-upload-js-v4.yml',
              'patch-schedule-suggest-child-ui-20260915.yml',
          ]

          root = Path('.github/workflows')
          changed = []
          missing = []

          for name in targets:
              p = root / name
              if not p.exists():
                  missing.append(name)
                  continue
              text = p.read_text(encoding='utf-8')
              lines = text.splitlines()
              try:
                  i = next(n for n, line in enumerate(lines) if line.strip() == 'on:' and not line.startswith((' ', '\t')))
              except StopIteration:
                  continue
              j = i + 1
              while j < len(lines):
                  line = lines[j]
                  if line and not line.startswith((' ', '\t', '#')):
                      break
                  j += 1
              replacement = ['on:', '  workflow_dispatch:']
              new_lines = lines[:i] + replacement + [''] + lines[j:]
              new_text = '\n'.join(new_lines).rstrip() + '\n'
              if new_text != text:
                  p.write_text(new_text, encoding='utf-8')
                  changed.append(name)

          print('disabled:', ', '.join(changed) or '(none)')
          print('missing:', ', '.join(missing) or '(none)')

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No workflow cleanup changes needed.'
            exit 0
          fi
          git commit -m 'Disable obsolete one-off workflows on automatic main pushes'
          git push
