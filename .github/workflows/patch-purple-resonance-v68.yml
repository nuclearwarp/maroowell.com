name: Export schedule full TXT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build full corrected TXT
        run: python scripts/export_schedule_account_fix.py
      - name: Commit generated TXT
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add maroowell_schedule_front_full_fixed_20260915.txt
          git commit -m 'Add full corrected schedule TXT' || true
          git push origin HEAD:main
